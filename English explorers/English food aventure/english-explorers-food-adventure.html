<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>English Explorers: Food Adventure in New York</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: a full-bleed New York scene behind a top bar (map, backpack, sound), a centred play area, and a bottom dock where Emma and Max talk.
   Single bright look on purpose (a children's game): every colour is a token below. */
:root{
  --ink:#1b2a52; --ink2:#5a6a98; --taxi:#ffc61a; --taxi-d:#d99a00; --sky:#8fd6ff; --sky2:#dff3ff; --paper:#ffffff; --cream:#fff8e8;
  --coral:#ff5d5d; --mint:#2dbf86; --mint-d:#1b9468; --lilac:#9a78f4; --pink:#ff86b6; --blue:#2f80ed; --orange:#ff9a1f;
  --gx:max(16px,env(safe-area-inset-left,0px)); --gy:max(16px,env(safe-area-inset-right,0px));
  --font-display:'Fredoka','Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Nunito','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--sky2);color:var(--ink);font:700 18px/1.35 var(--font-body);overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.1}
svg{overflow:visible}
.ic{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none}
.food{width:100%;height:100%;display:block}

/* ---------- Frame ---------- */
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--sky2)}
#bg svg{width:100%;height:100%;display:block}
#bg::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.34),rgba(255,255,255,.12))}
body[data-screen="title"] #bg::after{background:none}
#app{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
#view{flex:1;display:flex;padding:14px var(--gy) 18px var(--gx);outline:none}
.screen{width:100%;max-width:1120px;margin:0 auto;animation:fadeIn .4s ease both}
.panel{background:rgba(255,255,255,.95);border:4px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 rgba(27,42,82,.22);padding:clamp(14px,2.4vw,26px)}
.row{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:center;margin-top:18px}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 clamp(18px,2.4vw,24px)/1.1 var(--font-display);color:var(--ink);background:#fff;border:4px solid var(--ink);border-radius:18px;padding:12px 22px;min-height:54px;box-shadow:0 6px 0 var(--ink);transition:transform .08s,box-shadow .08s,background .15s;user-select:none;-webkit-tap-highlight-color:transparent}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 0 var(--ink)}
.btn:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--taxi)}
.btn.big{font-size:clamp(24px,4.2vw,40px);padding:16px clamp(22px,4vw,44px);border-radius:26px;min-height:70px}
.btn.small{font-size:clamp(15px,1.8vw,18px);padding:8px 14px;min-height:44px;border-radius:14px;box-shadow:0 4px 0 var(--ink)}
.btn:disabled{opacity:.6}
.mini{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;border:3px solid var(--ink);background:var(--taxi);color:var(--ink);vertical-align:middle;padding:0}
.pulse{animation:btnpulse 1.6s ease-in-out infinite}

/* ---------- Top bar ---------- */
#hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:10px;padding:8px var(--gy) 8px var(--gx);background:rgba(255,255,255,.94);border-bottom:4px solid var(--ink);backdrop-filter:blur(6px)}
body[data-screen="title"] #hud{display:none}
.hud-title{flex:1;min-width:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--font-display);font-weight:600}
.hudact{font-size:15px;color:var(--ink2)}
.chip{display:inline-block;font:700 14px var(--font-display);letter-spacing:.06em;padding:5px 12px;border-radius:999px;background:var(--ink);color:#fff;white-space:nowrap}
.chip.lv1{background:var(--mint-d)}.chip.lv2{background:#d17a00}.chip.lv3{background:#d7384a}.chip.lv4{background:var(--lilac)}
.dots{display:inline-flex;gap:6px}.dots i{width:12px;height:12px;border-radius:50%;background:#d6def0;border:2px solid var(--ink)}.dots i.on{background:var(--mint)}.dots i.now{background:var(--taxi)}
.packbtn{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 6px;border:4px solid var(--ink);border-radius:18px;background:#f3ecff;box-shadow:0 4px 0 var(--ink)}
.packbtn:hover{background:#e8dcff}
.pk-ico{width:34px}.pk-ico svg{width:100%;display:block}
.slots{display:flex;gap:6px}
.slot{width:40px;height:40px;border-radius:50%;border:3px dashed #9d8fc4;background:#fff;display:grid;place-items:center;font:700 20px var(--font-display);color:#9d8fc4;padding:4px}
.slot.full{border:3px solid var(--ink);background:#fff7d6}
.slot i{font-style:normal}
.slot.newbie{animation:pop .6s}
#hudSound{width:50px;padding:6px}

/* ---------- Dock: Emma and Max ---------- */
#dock{position:sticky;bottom:0;z-index:25;display:none;align-items:flex-end;gap:10px;padding:0 var(--gy) env(safe-area-inset-bottom,0px) var(--gx);pointer-events:none}
body:not([data-screen="title"]):not([data-screen="final"]):not([data-screen="wordbook"]):not([data-screen="passport"]) #dock{display:flex}
.wbbtn{background:#fff}.ic.flip{transform:scaleX(-1)}
:not([data-screen="passport"]) #dock{}
/* Passport */
.pp-wrap{margin:auto;width:100%;max-width:940px;text-align:center}
.pp-title{font-size:clamp(30px,5vw,48px);color:var(--taxi);-webkit-text-stroke:8px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);margin-bottom:12px}
.pp-book{background:linear-gradient(#f9f1dc,#efe2bd);border:5px solid var(--ink);border-radius:30px;box-shadow:0 10px 0 rgba(27,42,82,.4);padding:clamp(14px,2.6vw,24px);position:relative}
.pp-book.shake{animation:bookShake .45s ease}
.pp-head{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:14px;font:700 clamp(17px,2.8vw,26px) var(--font-display);letter-spacing:.06em;color:#2B3F9A}
.pp-head .face{width:54px;height:54px;border-radius:50%;border:3px solid var(--ink);background:#ffe27a;overflow:hidden;flex:none}.pp-head .face svg{width:100%;height:100%;display:block}
.pp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr));gap:clamp(10px,2vw,20px)}
.pp-slot{display:flex;flex-direction:column;align-items:center;gap:6px}
.pp-circle{position:relative;width:100%;max-width:160px;aspect-ratio:1;border-radius:50%;border:4px dashed #b9a98a;background:rgba(255,255,255,.55);display:grid;place-items:center}
.pp-circle .q{font:700 clamp(40px,7vw,62px) var(--font-display);color:#b9a98a;animation:float 3s ease-in-out infinite}
.pp-slot.done .pp-circle{border-style:solid;border-color:#2B3F9A;background:rgba(255,255,255,.85)}.pp-slot.done .q{display:none}
.pp-stamp{position:absolute;inset:-6%;opacity:0;pointer-events:none}.pp-stamp svg{width:100%;height:100%;overflow:visible}
.pp-slot.pre .pp-stamp{opacity:1;transform:rotate(-8deg)}
.pp-slot.stamped .pp-stamp{animation:stampDrop .95s cubic-bezier(.3,.1,.5,1) both}
.pp-ring{position:absolute;inset:0;border-radius:50%;border:6px solid #C8283C;opacity:0;pointer-events:none}
.pp-slot.stamped .pp-ring{animation:inkRing .95s ease-out both}
.pp-name{font:700 clamp(15px,2.4vw,21px) var(--font-display);min-height:1.4em}.pp-name.new{animation:pop .5s}
.pp-num{font:700 12px var(--font-body);color:var(--ink2);letter-spacing:.08em;text-transform:uppercase}
.pp-msg{margin:14px 0 0;font:700 clamp(18px,2.6vw,26px) var(--font-display);text-shadow:0 0 8px #fff,0 0 8px #fff}
@keyframes stampDrop{0%{opacity:0;transform:translateY(-170px) scale(2.6) rotate(-28deg)}52%{opacity:1;transform:translateY(0) scale(1) rotate(-8deg)}60%{opacity:1;transform:scale(.86) rotate(-8deg)}76%{transform:scale(1.07) rotate(-8deg)}100%{opacity:1;transform:scale(1) rotate(-8deg)}}
@keyframes inkRing{0%,52%{opacity:0;transform:scale(.7)}58%{opacity:.65}100%{opacity:0;transform:scale(1.5)}}
@keyframes bookShake{0%,100%{transform:none}30%{transform:translateY(6px)}60%{transform:translateY(-2px)}}/* Wordbook */
.wb{max-width:1000px;margin:0 auto;width:100%}
.wb-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.wb-head h1{font-size:clamp(30px,5vw,48px)}.wb-sub{margin:4px 0 0;color:var(--ink2);font-size:clamp(15px,2vw,19px)}
.wb-tabs{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 10px}
.wb-tab{padding:8px 16px;font:700 clamp(15px,2vw,19px) var(--font-display);background:#fff;border:3px solid var(--ink);border-radius:999px;box-shadow:0 4px 0 var(--ink)}
.wb-tab.on{background:var(--taxi)}
.wb-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;font:700 17px var(--font-display);color:var(--ink2)}
.wb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px}
.wb-card{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px 8px;background:linear-gradient(#fff,#fff8e2);border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 rgba(27,42,82,.3);font:700 clamp(15px,2vw,19px) var(--font-display)}
.wb-card svg.food{width:min(100%,92px);aspect-ratio:1;pointer-events:none}
.wb-card:hover{background:#fff3c4}
.wb-s{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:var(--taxi);border:2px solid var(--ink);display:grid;place-items:center;padding:4px}
.wb-price{background:var(--taxi);border:2px solid var(--ink);border-radius:99px;padding:0 10px;font-size:.9em}
.wb-phr{display:grid;gap:10px}
.wb-p{display:flex;align-items:center;gap:12px;padding:10px 14px;background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 rgba(27,42,82,.3);text-align:left}
.wb-p:hover{background:#fff6cf}
.wp-who{flex:none;min-width:70px;text-align:center;font:700 13px var(--font-display);letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:99px;color:#fff;background:#d6559a}.wp-who.max{background:#2468c7}
.wp-t{flex:1;font:700 clamp(17px,2.4vw,23px) var(--font-display)}
.wp-s{width:34px;height:34px;border-radius:50%;background:var(--taxi);border:3px solid var(--ink);display:grid;place-items:center;padding:5px}
#dock>*{pointer-events:auto}
.char{flex:0 0 auto;width:clamp(74px,10.5vw,124px);aspect-ratio:1/1;filter:drop-shadow(0 5px 0 rgba(27,42,82,.16));transition:transform .3s;transform-origin:50% 100%}
.char.speaking{transform:scale(1.1);animation:bob 1.6s ease-in-out infinite}
.char svg{width:100%;height:100%;display:block}
.bubble{position:relative;flex:1;min-width:0;background:#fff;border:4px solid var(--ink);border-radius:22px;padding:8px 16px 10px;margin-bottom:12px;box-shadow:0 6px 0 rgba(27,42,82,.22)}
.bubble::after{content:"";position:absolute;bottom:24px;width:18px;height:18px;background:#fff;border:4px solid var(--ink);transform:rotate(45deg)}
.bubble.from-emma::after{left:-13px;border-width:0 0 4px 4px}
.bubble.from-max::after{right:-13px;border-width:4px 4px 0 0}
.bubble.pop{animation:pop .3s}
.bwho{font:700 14px var(--font-display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.from-emma .bwho{color:#d6559a}.from-max .bwho{color:#2468c7}
#btext{margin:2px 0 0;font:700 clamp(16px,2.1vw,22px)/1.25 var(--font-body);padding-right:46px}
#bspeak{position:absolute;right:10px;top:50%;transform:translateY(-50%)}

/* ---------- Toast / overlays ---------- */
.toast{position:fixed;left:50%;top:92px;z-index:150;display:flex;align-items:center;gap:10px;pointer-events:none;font:700 clamp(26px,5.2vw,46px) var(--font-display);padding:8px 28px;border:5px solid var(--ink);border-radius:999px;background:var(--taxi);color:var(--ink);box-shadow:0 8px 0 var(--ink);opacity:0;transform:translate(-50%,-20px) scale(.8);transition:opacity .2s,transform .25s cubic-bezier(.3,1.6,.5,1);white-space:nowrap;max-width:94vw}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
.toast.bad{background:#ffe0d6}
.t-star{width:1.1em;height:1.1em;fill:#fff;stroke:var(--ink);animation:spin 1s linear infinite}
#fx{position:fixed;inset:0;z-index:160;pointer-events:none;width:100%;height:100%}
.overlay{position:fixed;inset:0;z-index:100;background:rgba(27,42,82,.58);display:grid;place-items:center;padding:16px;animation:fadeIn .2s}
.dialog{background:#fff;border:5px solid var(--ink);border-radius:28px;max-width:580px;width:100%;max-height:92vh;overflow:auto;padding:22px;text-align:center;box-shadow:0 10px 0 rgba(27,42,82,.3);animation:pop .35s}
.dialog h2{font-size:clamp(26px,4vw,36px);margin-bottom:10px}
.dlg-body p{margin:8px 0;font-size:20px}
.dlg-btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:16px}
.pack-art{width:96px;margin:0 auto}.pack-art svg{width:100%}
.pack-row{display:flex;gap:12px;justify-content:center;margin:10px 0}
.pk{width:104px;border:4px dashed #b7b0d1;border-radius:18px;padding:8px;background:#f7f4ff;font:700 17px var(--font-display);color:#8d85ae}
.pk.got{border:4px solid var(--ink);background:#fff7d6;color:var(--ink)}
.pk svg{width:70px;height:70px;margin:0 auto;display:block}.pk b{display:block;font-size:44px;line-height:70px;font-family:var(--font-display)}
.pk span{display:block;margin-top:4px}
.dd-chars{display:flex;justify-content:center;gap:10px}.dd-chars svg{width:110px}
.fly{margin:0!important;transform-origin:0 0}
.ghost{position:fixed!important;z-index:200;pointer-events:none;margin:0!important;opacity:.95;transform:rotate(-4deg) scale(1.1);box-shadow:0 14px 26px rgba(0,0,0,.28)}
.dragging{opacity:.3}
[data-drop].over{outline:5px dashed var(--mint);outline-offset:3px}
.shake{animation:shake .5s}.bump{animation:bump .5s}

/* ---------- Title ---------- */
.title-wrap{position:relative;display:flex;flex-direction:column;align-items:center;min-height:calc(100dvh - 32px)}
.logo{text-align:center;margin:clamp(2px,2vh,18px) 0 0;font-family:var(--font-display);font-weight:700;line-height:1;text-transform:uppercase}
.logo span,.logo em{display:block;font-style:normal}
.l1{font-size:clamp(38px,9.4vw,108px);color:var(--taxi);-webkit-text-stroke:clamp(6px,1.2vw,14px) var(--ink);paint-order:stroke fill;text-shadow:0 clamp(4px,.9vw,10px) 0 var(--ink);letter-spacing:.01em}
.l2{margin-top:clamp(6px,1.4vw,14px);font-size:clamp(20px,4.6vw,52px);color:#fff;-webkit-text-stroke:clamp(5px,.9vw,10px) var(--ink);paint-order:stroke fill;text-shadow:0 clamp(3px,.6vw,7px) 0 var(--ink)}
.l2 em{display:inline;color:#ff6b6b}
.checker{width:min(560px,80%);height:28px;margin:clamp(8px,1.6vw,16px) auto 0;border:4px solid var(--ink);border-radius:10px;background:conic-gradient(var(--ink) 25%,var(--taxi) 0 50%,var(--ink) 0 75%,var(--taxi) 0) 0 0/28px 28px}
.title-stage{position:relative;z-index:2;width:100%;max-width:940px;margin-inline:auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:12px;margin-top:auto;padding-top:20px}
.tchar{position:relative;width:min(100%,clamp(170px,30vh,340px));animation:bob 3.4s ease-in-out infinite}
.tchar svg{width:100%;display:block;filter:drop-shadow(0 8px 0 rgba(27,42,82,.2))}
.tc-emma{justify-self:end}.tc-max{justify-self:start;animation-delay:-1.4s}
.tbub{position:absolute;top:-14px;font:700 clamp(15px,1.9vw,22px)/1.2 var(--font-display);background:#fff;border:4px solid var(--ink);border-radius:18px;padding:8px 14px;width:max-content;max-width:150%;text-align:center;box-shadow:0 5px 0 rgba(27,42,82,.25)}
.tc-emma .tbub{left:70%}.tc-max .tbub{right:70%}
.tcenter{display:flex;flex-direction:column;align-items:center;gap:14px;padding-bottom:clamp(28px,8vh,90px)}
.trow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.taxi-lane{position:absolute;left:0;right:0;bottom:2px;height:90px;pointer-events:none;z-index:1;overflow:hidden}
.taxi.drive{position:absolute;bottom:0;width:150px;animation:drive 16s linear infinite}

/* ---------- Story card ---------- */
.postcard{max-width:700px;margin:auto;text-align:center}
.pc-art{width:100%;max-height:44vh;border:4px solid var(--ink);border-radius:20px;display:block}
.pc-btns{display:flex;gap:14px;justify-content:center;align-items:center;margin-top:18px;flex-wrap:wrap}

/* ---------- Map ---------- */
.map-head{text-align:center;margin-bottom:8px}
.map-head h1{font-size:clamp(26px,4.4vw,44px);color:var(--ink);text-shadow:0 3px 0 #fff,0 0 12px #fff}
.map-head p{margin:2px 0 0;font-size:clamp(15px,2vw,19px);text-shadow:0 0 8px #fff,0 0 8px #fff}
.map-box{width:100%}
.mapsvg{display:block;width:100%;height:auto;max-height:calc(100dvh - 340px);min-height:340px;border:5px solid var(--ink);border-radius:26px;background:#7ec8f2;box-shadow:0 8px 0 rgba(27,42,82,.25)}
.mapsvg .node{cursor:pointer;outline:none}
.mapsvg .disc{fill:#fff;stroke:var(--ink);stroke-width:5;transition:fill .2s}
.mapsvg .shadow{fill:rgba(27,42,82,.25)}
.mapsvg .ring{fill:none;stroke:var(--taxi);stroke-width:7;opacity:0;transform-box:fill-box;transform-origin:center}
.mapsvg .node.open .ring{opacity:1;animation:ringpulse 1.4s ease-in-out infinite}
.mapsvg .node.open .disc{fill:#fff7d6}
.mapsvg .node.done .disc{fill:#d9f7e8}
.mapsvg .node.locked .disc{fill:#d3d9e8}
.mapsvg .node.locked .nicon{filter:grayscale(1);opacity:.45}
.mapsvg .node:hover:not(.locked) .disc{fill:#fff0b3}
.mapsvg .node:focus-visible .disc{stroke:var(--blue);stroke-width:9}
.mapsvg .lockb,.mapsvg .tickb{display:none}
.mapsvg .node.locked .lockb,.mapsvg .node.done .tickb{display:block}
.mapsvg .plate{fill:#fff;stroke:var(--ink);stroke-width:4}
.mapsvg .node.locked .plate{fill:#e6eaf5}
.mapsvg .plvl{font:700 15px var(--font-display);text-anchor:middle;fill:var(--ink2);letter-spacing:.08em}
.mapsvg .pname{font:700 24px var(--font-display);text-anchor:middle;fill:var(--ink)}
.mapsvg .st{fill:#d8dff0;stroke:var(--ink);stroke-width:3;stroke-linejoin:round}.mapsvg .st.on{fill:var(--taxi)}
.mapsvg .maplbl{font:700 17px var(--font-display);fill:#5a7a4d;text-anchor:middle;letter-spacing:.14em}.mapsvg .maplbl.w{fill:#fff;opacity:.85}
.mapsvg .taxiwrap{animation:bob 1.8s ease-in-out infinite;pointer-events:none}

/* ---------- Level intro ---------- */
.phase-card{max-width:760px;margin:auto;text-align:center}
.lvl-tag{display:inline-block;font:700 18px var(--font-display);letter-spacing:.1em;padding:6px 18px;border-radius:999px;color:#fff;background:var(--ink)}
.lvl-tag.lv1{background:var(--mint-d)}.lvl-tag.lv2{background:#d17a00}.lvl-tag.lv3{background:#d7384a}
.phase-card h1{font-size:clamp(30px,5.4vw,54px);margin:10px 0 4px}
.place{margin:0 0 14px;font-size:clamp(16px,2.2vw,20px);color:var(--ink2)}
.act-list{display:grid;gap:10px;text-align:left;margin:8px 0 14px}
.act-item{display:flex;align-items:center;gap:14px;padding:10px 14px;background:#fff;border:4px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 rgba(27,42,82,.3);text-align:left}
.act-item:hover:not(:disabled){background:#fff6cf}
.act-item .ai-n{flex:none;width:44px;height:44px;border-radius:50%;background:var(--taxi);border:3px solid var(--ink);display:grid;place-items:center;font:700 22px var(--font-display)}
.act-item.done .ai-n{background:var(--mint);color:#fff}
.act-item.locked{opacity:.55;background:#eef1f8}.act-item.locked .ai-n{background:#cdd5e8}
.ai-t b{display:block;font:700 clamp(18px,2.4vw,24px) var(--font-display)}.ai-t small{font:700 15px var(--font-body);color:var(--ink2)}
.phase-words{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0 4px}
.wchip{display:inline-flex;align-items:center;gap:6px;padding:3px 12px 3px 6px;background:#fff;border:3px solid var(--ink);border-radius:999px;font:700 16px var(--font-display);cursor:pointer}
.wchip svg{width:30px;height:30px}.wchip:hover{background:#fff6cf}
.phase-words.small .wchip{font-size:15px}

/* ---------- Activity frame ---------- */
.act-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:2px 0 10px}
.act-head h1{font-size:clamp(26px,4.6vw,44px);color:var(--ink);text-shadow:0 3px 0 #fff,0 0 14px #fff}
.act-no{font:700 14px var(--font-display);letter-spacing:.14em;color:var(--ink);background:var(--taxi);display:inline-block;padding:3px 12px;border-radius:999px;border:3px solid var(--ink);margin-bottom:4px}
.act-tools{display:flex;gap:10px}
.act-body{min-height:300px}
.instr{margin:0 0 12px;text-align:center;font:700 clamp(17px,2.2vw,22px) var(--font-body)}
.q-top{display:flex;align-items:center;justify-content:center;gap:14px;font:700 clamp(15px,2vw,19px) var(--font-display);margin-bottom:10px}
.bar{width:min(240px,40%);height:14px;border-radius:99px;background:#dce4f5;border:3px solid var(--ink);overflow:hidden}
.bar i{display:block;height:100%;background:var(--mint);transition:width .5s}

/* Memory */
.mem-count{text-align:center;font:700 20px var(--font-display);margin-bottom:10px}
.mem-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(8px,1.4vw,14px);max-width:clamp(300px,calc((100vh - 440px)*1.33),760px);margin:0 auto}
@supports (height:100dvh){.mem-grid{max-width:clamp(300px,calc((100dvh - 440px)*1.33),760px)}}
.mem-card{aspect-ratio:1/1;perspective:800px;border:0;background:none;padding:0}
.mem-card .inner{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s}
.mem-card.up .inner,.mem-card.matched .inner{transform:rotateY(180deg)}
.mem-card .face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border:4px solid var(--ink);border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:8%}
.mem-card .back{background:conic-gradient(var(--ink) 25%,var(--taxi) 0 50%,var(--ink) 0 75%,var(--taxi) 0) 0 0/24px 24px;padding:0}
.mem-card .back .star{width:52%;height:52%;fill:#fff;stroke:var(--ink);stroke-width:2;background:var(--blue);border-radius:50%;padding:12%;border:4px solid var(--ink);box-sizing:content-box}
.mem-card:hover:not(.up) .back{filter:brightness(1.08)}
.mem-card .front{transform:rotateY(180deg);background:#fff}
.mem-card .front.word b{font:700 clamp(17px,3.2vw,32px) var(--font-display);text-align:center;line-height:1.05;word-break:break-word}
.mem-card.matched .front{background:#d9f7e8;border-color:var(--mint-d)}
.mem-card.matched{animation:bump .6s}

/* Big picture, answers */
.bigpic{width:clamp(150px,30vh,260px);aspect-ratio:1;margin:0 auto;background:radial-gradient(circle,#fff 40%,#fff1c2);border:5px solid var(--ink);border-radius:32px;display:grid;place-items:center;padding:6%;box-shadow:0 6px 0 rgba(27,42,82,.25)}
.bigpic.sm{width:clamp(130px,24vh,210px);margin:0}
.q{text-align:center;font-size:clamp(28px,4.4vw,44px);margin:14px 0 4px}
.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:820px;margin:10px auto 0}
.answers.wide{margin-top:12px}
.ans{display:flex;align-items:center;gap:12px;padding:12px 16px;font:700 clamp(20px,3vw,30px) var(--font-display);text-align:left;background:#fff;border:4px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);transition:transform .08s,background .15s}
.ans:hover:not(:disabled){background:#fff6cf;transform:translateY(-2px)}
.ans .al{flex:none;width:1.7em;height:1.7em;border-radius:50%;background:var(--taxi);border:3px solid var(--ink);display:grid;place-items:center;font-size:.8em}
.ans.right{background:#c9f6df;border-color:var(--mint-d);box-shadow:0 6px 0 var(--mint-d);opacity:1}
.ans.wrong{background:#ffe4dc;opacity:.55}

/* Basket */
.ask-banner{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;text-align:center;font:600 clamp(20px,3vw,30px) var(--font-display);background:#fff3c4;border:4px solid var(--ink);border-radius:20px;padding:10px 16px;margin-bottom:14px}
.ask-who{font-size:.6em;letter-spacing:.1em;text-transform:uppercase;color:#d6559a}
.basket-layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px;align-items:start}
.shelf{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;background:linear-gradient(#e9c895,#cf9a58);padding:14px;border-radius:22px;border:4px solid var(--ink)}
.item,.sitem,.mp{display:flex;flex-direction:column;align-items:center;gap:2px;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:6px 4px 4px;font:700 clamp(12px,1.6vw,15px) var(--font-display);cursor:grab;box-shadow:0 4px 0 rgba(27,42,82,.3);transition:transform .1s}
.item:hover:not(.gone),.sitem:hover,.mp:hover{transform:translateY(-3px);background:#fff6cf}
.item svg,.sitem svg,.mp svg{width:100%;max-width:74px;aspect-ratio:1;pointer-events:none}
.item.gone{visibility:hidden}
.basket{position:relative;height:210px;border-radius:20px;transition:background .2s}
.basket .b-art{position:absolute;left:0;right:0;bottom:0;width:100%;height:auto;pointer-events:none}
.b-items{position:absolute;left:10%;right:10%;bottom:46px;top:0;display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-end;gap:0;z-index:2;pointer-events:none}
.mini-item{width:clamp(36px,5vw,50px);aspect-ratio:1;display:block;animation:pop .35s}
.need{margin-top:8px}
.need-row{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:5px 12px;margin-top:8px;font:700 20px var(--font-display)}
.need-row svg{width:44px;height:44px;flex:none}.need-row b{flex:1}
.need-row .cnt{background:var(--taxi);border:3px solid var(--ink);border-radius:999px;padding:0 12px}
.need-row.ok{background:#d9f7e8}.need-row.ok .cnt{background:var(--mint);color:#fff}

/* Match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:clamp(14px,4vw,40px);max-width:760px;margin:0 auto}
.mcol{display:flex;flex-direction:column;gap:8px;justify-content:center}
.mslot{display:flex;align-items:center;gap:12px;padding:3px 14px 3px 8px;background:#fff;border:4px dashed var(--ink2);border-radius:18px;text-align:left}
.mpic{flex:none;width:clamp(46px,8.5vh,76px);aspect-ratio:1;pointer-events:none}
.mlabel{flex:1;min-height:1.6em;font:700 clamp(18px,2.8vw,26px) var(--font-display);color:var(--ink2);border-bottom:4px dotted #aab6d6;padding:0 4px}
.mslot.ok{border-style:solid;border-color:var(--mint-d);background:#e5fbef}.mslot.ok .mlabel{color:var(--ink);border-color:transparent}
.mslot.sel,.mchip.sel,.sitem.sel{outline:5px solid var(--blue);outline-offset:2px}
.mchip{padding:11px 12px;font:700 clamp(20px,3vw,28px) var(--font-display);background:var(--taxi);border:4px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);cursor:grab}
.mchip.used{visibility:hidden}

/* Sort */
.bins{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.bin{background:color-mix(in srgb,var(--bc) 14%,#fff);border:4px solid var(--bc);border-radius:22px;min-height:150px;padding:8px;box-shadow:0 5px 0 rgba(27,42,82,.18);cursor:pointer;transition:transform .15s}
.bin-h{display:flex;align-items:center;gap:8px;font:700 clamp(15px,2vw,21px) var(--font-display);color:var(--ink)}
.bin-h svg{width:38px;height:38px;flex:none}
.bin-in{display:flex;flex-wrap:wrap;gap:2px;margin-top:6px}
.bin.hint{animation:btnpulse .8s ease-in-out infinite;outline:5px solid var(--taxi)}
.tray{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:16px;padding:12px;border:4px dashed var(--ink2);border-radius:22px;background:rgba(255,255,255,.7)}
.sitem{width:clamp(78px,11vw,108px)}.sitem.gone{display:none}

/* Word */
.word-stage{display:flex;align-items:center;justify-content:center;gap:clamp(14px,4vw,40px);flex-wrap:wrap}
.word-col{display:flex;flex-direction:column;align-items:center;gap:14px}
.word{display:flex;gap:clamp(4px,1vw,8px);flex-wrap:wrap;justify-content:center}
.lt{width:clamp(34px,7vw,64px);height:clamp(46px,9vw,80px);display:grid;place-items:center;font:700 clamp(26px,5.4vw,52px) var(--font-display);background:#fff;border:4px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 rgba(27,42,82,.25)}
.lt.blank{background:#fff7d1;border-style:dashed}
.lt.ok{background:#d9f7e8;border:4px solid var(--mint-d)}
.tiles{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.tile{width:clamp(52px,9vw,72px);height:clamp(52px,9vw,72px);font:700 clamp(26px,4.4vw,38px) var(--font-display);background:var(--taxi);border:4px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);cursor:grab}
.tile:hover:not(:disabled){background:#ffd95a}
.tile.used{visibility:hidden}

/* Menu */
.menu-count{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:12px;font:700 19px var(--font-display);flex-wrap:wrap}
.menu-board{background:#1f3d36;color:#fff;border:7px solid #a9743d;border-radius:22px;padding:clamp(10px,2vw,20px);box-shadow:inset 0 0 0 3px rgba(255,255,255,.18)}
.menu-title{text-align:center;font:700 clamp(26px,4.6vw,44px) var(--font-display);color:#ffd95a;letter-spacing:.04em}
.menu-title small{display:block;font-size:.42em;color:#bdeee0;letter-spacing:.2em;text-transform:uppercase}
.menu-sec{margin-top:12px}.menu-sec h3{font-size:clamp(18px,2.6vw,24px);color:#9be7ff;border-bottom:3px dashed rgba(255,255,255,.4);padding-bottom:4px;letter-spacing:.12em}
.dishes{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:10px;margin-top:10px}
.dish{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 6px 8px;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:16px;font:700 clamp(14px,1.9vw,18px) var(--font-display);box-shadow:0 4px 0 rgba(0,0,0,.35)}
.dish svg{width:min(100%,82px);aspect-ratio:1;pointer-events:none}
.dish:hover{background:#fff6cf}
.dp{background:var(--taxi);border:2px solid var(--ink);border-radius:999px;padding:0 12px;font-weight:700}
.seen-b{position:absolute;top:-10px;right:-8px;width:30px;height:30px;background:var(--mint);color:#fff;border:3px solid var(--ink);border-radius:50%;display:none;place-items:center;padding:4px}
.dish.seen .seen-b{display:grid}
.quiz{margin-top:16px;background:#fff7d6;border:4px solid var(--ink);border-radius:22px;padding:16px;text-align:center}
.quiz-h{font:700 15px var(--font-display);letter-spacing:.14em;color:#d6559a}
.qtext{font:700 clamp(22px,3.2vw,32px) var(--font-display);margin:6px 0}

/* Chat */
.scene-title{text-align:center;margin-bottom:10px}
.chat-scene{display:flex;gap:12px;align-items:flex-end}
.waiter{flex:none;width:clamp(86px,15vw,150px);text-align:center}
.waiter svg{width:100%;display:block}
.w-name{font:700 14px var(--font-display);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.chat{flex:1;min-width:0;min-height:170px;max-height:min(300px,38vh);overflow:auto;display:flex;flex-direction:column;gap:8px;padding:12px;background:#fff7e8;border:4px solid var(--ink);border-radius:20px}
.chat-scene.compact .chat{min-height:110px;max-height:min(190px,26vh)}
.cb{max-width:84%;padding:9px 14px;border-radius:18px;border:3px solid var(--ink);font:700 clamp(17px,2.3vw,22px)/1.25 var(--font-body);animation:pop .3s}
.cb.w{align-self:flex-start;background:#fff;border-bottom-left-radius:4px}
.cb.p{align-self:flex-end;background:var(--taxi);border-bottom-right-radius:4px}
.cb.typing i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ink);margin:0 2px;animation:dot 1s infinite}
.cb.typing i:nth-child(2){animation-delay:.15s}.cb.typing i:nth-child(3){animation-delay:.3s}
.reply{margin-top:12px;min-height:20px}
.reply-h{font:700 clamp(16px,2vw,20px) var(--font-display);margin-bottom:8px;color:var(--ink2);text-align:center}
.phrases{display:grid;gap:10px;max-width:760px;margin:0 auto}
.phr{display:flex;align-items:center;gap:12px;padding:12px 16px;font:700 clamp(18px,2.6vw,26px) var(--font-display);text-align:left;background:#fff;border:4px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink)}
.phr .al{flex:none;width:1.7em;height:1.7em;border-radius:50%;background:var(--taxi);border:3px solid var(--ink);display:grid;place-items:center;font-size:.8em}
.phr:hover:not(:disabled){background:#fff6cf}
.phr.right{background:#c9f6df;border-color:var(--mint-d)}.phr.wrong{background:#ffe4dc;opacity:.55}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;max-width:860px;margin:0 auto}
.pick{display:flex;flex-direction:column;align-items:center;padding:6px;background:#fff;border:4px solid var(--ink);border-radius:18px;font:700 clamp(14px,1.9vw,18px) var(--font-display);box-shadow:0 5px 0 var(--ink)}
.pick svg{width:min(100%,76px);aspect-ratio:1}.pick b{background:var(--taxi);border:2px solid var(--ink);border-radius:99px;padding:0 10px}
.pick:hover:not(:disabled){background:#fff6cf}.pick.right{background:#c9f6df}

/* Final order */
.order-layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(250px,1fr);gap:16px;align-items:start;margin-top:10px}
.mp-sec h3{font-size:18px;letter-spacing:.1em;color:var(--ink2);margin:8px 0 6px}
.mp-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.mp b{background:var(--taxi);border:2px solid var(--ink);border-radius:99px;padding:0 9px;font-size:.95em}
.mp.picked{background:#d9f7e8;border-color:var(--mint-d)}
.order-pad{position:sticky;top:84px;background:#fffdf0;border:4px solid var(--ink);border-radius:20px;padding:12px;box-shadow:0 6px 0 rgba(27,42,82,.25)}
.pad-h{text-align:center;font:700 22px var(--font-display);letter-spacing:.12em;border-bottom:3px dashed var(--ink2);padding-bottom:6px}
.oslot{display:flex;align-items:center;gap:10px;margin-top:10px;min-height:72px;padding:6px 10px;border:3px dashed var(--ink2);border-radius:14px;background:#fff}
.oslot.filled{border-style:solid;border-color:var(--mint-d);background:#effcf5}
.olabel{flex:none;width:78px;font:700 13px var(--font-display);letter-spacing:.06em;color:var(--ink2)}
.oc{flex:1;min-width:0}.oc em{color:#9aa6c6;font-style:normal;font-weight:700}
.ofill{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;width:100%;font:700 17px var(--font-display);text-align:left}
.ofill svg{width:48px;height:48px;flex:none}.ofill span{flex:1}.ofill b{background:var(--taxi);border:2px solid var(--ink);border-radius:99px;padding:0 8px}.ofill i{width:22px;color:var(--coral)}
.pad-total{text-align:center;margin:12px 0 8px;font:700 24px var(--font-display)}
.order-pad .btn{width:100%}
.order-sum{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-bottom:6px}
.osum{display:inline-flex;align-items:center;gap:6px;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:3px 14px 3px 6px;font:700 17px var(--font-display)}
.osum svg{width:36px;height:36px}.osum.tot{background:var(--taxi)}
.sentence{min-height:84px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px;background:#fff;border:4px dashed var(--ink);border-radius:18px}
.sentence em{color:#9aa6c6;font-style:normal;font-weight:700}
.preview{min-height:2em;margin:8px 0;text-align:center;font:600 clamp(18px,2.6vw,26px) var(--font-display);color:#d6559a}
.chipbank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:56px}
.wchip2{padding:10px 16px;font:700 clamp(18px,2.6vw,26px) var(--font-display);background:var(--taxi);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);cursor:grab}
.wchip2.in{background:#d9f7e8;cursor:pointer}
.served{text-align:center;margin-top:10px}.served-row{display:flex;justify-content:center;gap:clamp(10px,3vw,30px)}.served-row svg{width:clamp(70px,14vw,130px)}
.served p{font:700 26px var(--font-display);margin:6px 0 0}

/* ---------- Reward screens ---------- */
.win-card,.unlock-card{max-width:820px;margin:auto;text-align:center}
.win-chars{display:flex;justify-content:center;gap:clamp(10px,4vw,40px)}
.wc{width:clamp(90px,17vw,160px)}.wc svg{width:100%;display:block}
.win-card h1,.unlock-card h1{font-size:clamp(30px,5.6vw,56px)}
.win-stars{margin:6px 0}
.stars{display:inline-flex;gap:6px}
.star{width:34px;height:34px;fill:var(--taxi);stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round}.star.off{fill:#d8dff0}
.stars.big .star{width:clamp(48px,9vw,70px);height:clamp(48px,9vw,70px)}
.pop3 .star,.pop3.star{animation:pop .6s both}.pop3 .star:nth-child(2){animation-delay:.2s}.pop3 .star:nth-child(3){animation-delay:.4s}
.reward{margin:10px 0}
.reward-card{display:inline-flex;flex-direction:column;align-items:center;gap:2px;padding:14px 34px 12px;background:linear-gradient(#fff,#fff0b8);border:5px solid var(--ink);border-radius:28px;font:700 clamp(24px,3.6vw,34px) var(--font-display);letter-spacing:.08em;transition:opacity .3s}
.reward-card svg{width:clamp(90px,15vw,130px);height:clamp(90px,15vw,130px)}
.reward-card.glow{animation:glow 1.4s ease-in-out infinite}.reward-card.taken{opacity:.25}
.reward-msg{margin:10px 0 0;font:700 clamp(18px,2.4vw,24px) var(--font-body)}
.lockwrap{width:90px;margin:0 auto}.padlock{width:100%;display:block}
.shackle{transform-box:view-box;transform-origin:84px 58px;transition:transform .7s cubic-bezier(.3,1.6,.5,1)}
.opened .shackle{transform:rotate(-38deg) translate(-4px,-8px)}
.orbit{display:flex;justify-content:center;gap:clamp(10px,4vw,40px);margin:10px 0}
.orb{width:clamp(76px,16vw,130px);background:#fff;border:5px solid var(--ink);border-radius:26px;padding:10px;animation:float 2s ease-in-out infinite}
.orb.o2{animation-delay:-.6s}.orb.o3{animation-delay:-1.2s}
.unlock-card p{font-size:clamp(18px,2.6vw,24px);margin:8px 0}

/* ---------- Final recipe ---------- */
.recipe-wrap{width:100%}
.recipe-head{text-align:center;margin-bottom:10px}
.recipe-head h1{font-size:clamp(24px,4.6vw,46px);text-shadow:0 3px 0 #fff,0 0 14px #fff}
.rsteps{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;list-style:none;margin:10px 0 0;padding:0}
.rsteps li{display:flex;align-items:center;gap:6px;padding:3px 14px 3px 4px;border:3px solid var(--ink);border-radius:999px;background:#fff;font:700 clamp(14px,1.8vw,18px) var(--font-display);opacity:.7}
.rsteps li b{width:28px;height:28px;display:grid;place-items:center;border-radius:50%;background:#dfe5f4;border:2px solid var(--ink)}
.rsteps li.now{opacity:1;background:#fff3c4}.rsteps li.now b{background:var(--taxi)}
.rsteps li.done{opacity:1;background:#d9f7e8}.rsteps li.done b{background:var(--mint);color:#fff}
.recipe-main{display:grid;grid-template-columns:minmax(200px,250px) 1fr;gap:18px;align-items:center}
.ingredients{display:flex;flex-direction:column;gap:12px}
.ing-h{font:700 15px var(--font-display);letter-spacing:.14em;color:var(--ink2)}
.ing{display:flex;align-items:center;gap:12px;padding:8px 14px;background:#fff;border:4px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);font:700 clamp(20px,2.6vw,26px) var(--font-display);cursor:grab}
.ing svg{width:64px;height:64px;flex:none;pointer-events:none}
.ing.next{animation:btnpulse 1s ease-in-out infinite;background:#fff6cf}
.ing.used{opacity:.3;box-shadow:none}
.plate-zone{position:relative;border-radius:22px;padding:8px}
.ribbon{display:block;text-align:center;font:700 clamp(22px,3.6vw,38px) var(--font-display);background:var(--taxi);border:4px solid var(--ink);border-radius:18px;padding:8px 14px;box-shadow:0 5px 0 var(--ink);margin-bottom:8px}
.ribbon.gold{background:linear-gradient(#ffe27a,#ffc61a)}.ribbon.pop{animation:pop .4s}
.plate-svg{display:block;width:100%;max-height:50vh}
.drop-hint{position:absolute;left:0;right:0;bottom:34%;text-align:center;font:700 clamp(16px,2.2vw,22px) var(--font-display);color:var(--ink2);pointer-events:none;animation:float 2s ease-in-out infinite}
.plate-zone.over{outline:5px dashed var(--mint)}
.layer.drop{animation:dropIn .65s cubic-bezier(.3,1.4,.5,1) both}
#layers.squash{transform-box:view-box;transform-origin:150px 190px;animation:squash .4s}
.half{transition:transform .55s cubic-bezier(.3,1.4,.5,1);transform-box:view-box;transform-origin:150px 150px}
.half.hl.apart{transform:translate(-18px,-6px) rotate(-3deg)}.half.hr.apart{transform:translate(18px,6px) rotate(3deg)}
.knife{animation:knife .65s ease-in forwards}
#extra.pop{animation:pop .5s}
.sparkles i{position:absolute;width:16px;height:16px;background:var(--taxi);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:sparkle 1.4s ease-in-out infinite}

/* ---------- Final celebration ---------- */
.final-wrap{margin:auto;max-width:860px;text-align:center;width:100%}
.fin-chars{display:flex;justify-content:center;gap:clamp(10px,5vw,50px)}
.fc{width:clamp(110px,20vw,190px)}.fc svg{width:100%;display:block}
.fin-h{font-size:clamp(30px,6.4vw,64px);color:var(--taxi);-webkit-text-stroke:clamp(5px,1vw,10px) var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);margin:6px 0 4px}
.fin-p{font:700 clamp(19px,2.8vw,28px)/1.3 var(--font-display);color:var(--ink);text-shadow:0 0 8px #fff,0 0 8px #fff;margin:0 0 10px}
.diploma{display:flex;align-items:center;gap:clamp(12px,3vw,28px);background:#fffdf3;border:6px double var(--taxi-d);outline:4px solid var(--ink);outline-offset:0;border-radius:22px;padding:clamp(14px,2.4vw,24px);max-width:720px;margin:12px auto;text-align:center;box-shadow:0 10px 0 rgba(27,42,82,.25)}
.medal{flex:none;width:clamp(86px,16vw,140px);animation:float 2.4s ease-in-out infinite}.medal svg{width:100%;display:block}
.dip-body{flex:1;min-width:0}
.dip-top{font:700 clamp(26px,4.4vw,42px) var(--font-display);color:#d7384a;letter-spacing:.06em;line-height:1}
.dip-sub{font:700 clamp(12px,1.6vw,15px) var(--font-display);letter-spacing:.3em;color:var(--ink2);margin-bottom:8px}
.dip-line{font:700 clamp(14px,1.8vw,18px) var(--font-body);color:var(--ink2)}
.dip-name{font:700 clamp(28px,5vw,48px) var(--font-display);color:var(--ink);border-bottom:4px dotted var(--taxi-d);margin:4px auto 6px;max-width:100%;overflow-wrap:anywhere;line-height:1.1}
.dip-stars{display:flex;align-items:center;justify-content:center;gap:10px;margin:6px 0}.dip-stars span{font:700 17px var(--font-display)}.dip-stars .star{width:30px;height:30px}
.dip-sign{display:flex;justify-content:space-between;gap:10px;font:600 15px var(--font-display);color:var(--ink2);border-top:2px solid #e8dca8;padding-top:6px}
.namebox{display:block;margin-top:14px;font:700 20px var(--font-display);text-shadow:0 0 8px #fff,0 0 8px #fff}
.nameinput{margin-top:6px;width:min(420px,100%);font:700 24px var(--font-display);padding:10px 16px;border:4px solid var(--ink);border-radius:16px;background:#fff;color:var(--ink);text-align:center}

/* ---------- Animations ---------- */
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes dot{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}
@keyframes btnpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes ringpulse{0%,100%{transform:scale(.96);opacity:1}50%{transform:scale(1.14);opacity:.35}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,198,26,.9)}50%{box-shadow:0 0 0 20px rgba(255,198,26,0)}}
@keyframes drive{from{left:-200px}to{left:calc(100% + 40px)}}
@keyframes dropIn{from{transform:translateY(-90px);opacity:0}to{transform:none;opacity:1}}
@keyframes squash{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.93)}}
@keyframes knife{from{transform:translate(70px,-50px);opacity:0}30%{opacity:1}to{transform:translate(-60px,40px);opacity:1}}
@keyframes sparkle{0%,100%{transform:scale(0) rotate(0);opacity:0}50%{transform:scale(1.5) rotate(90deg);opacity:1}}

/* ---------- Responsive ---------- */
@media (max-width:820px){
  .basket-layout,.order-layout{grid-template-columns:1fr}

  .ingredients{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.ing-h{grid-column:1/-1;text-align:center}
  .ing{flex-direction:column;gap:2px;padding:6px 4px;font-size:clamp(15px,3.6vw,20px);text-align:center}.ing svg{width:clamp(40px,10vw,58px);height:clamp(40px,10vw,58px)}

  .rsteps li{font-size:13px;padding-right:10px}.rsteps li b{width:22px;height:22px;font-size:12px}
  .bins{grid-template-columns:repeat(2,1fr)}
  .answers{grid-template-columns:1fr}
  .diploma{flex-direction:column}
}
@media (max-width:700px){
  .title-stage{grid-template-columns:1fr 1fr;row-gap:62px}

  .shelf{grid-template-columns:repeat(4,1fr);padding:8px;gap:6px}
  .bins{grid-template-columns:repeat(4,1fr);gap:6px}
  .bin{min-height:104px;padding:6px 4px;border-width:3px;border-radius:16px}
  .bin-h{flex-direction:column;gap:2px;font-size:11px;text-align:center;letter-spacing:0}
  .bin-h svg{width:34px;height:34px}.bin .mini-item{width:30px}
  .sitem{width:76px}
}
@media (max-width:560px){
  body{font-size:16px}
  .mem-grid{grid-template-columns:repeat(3,1fr)}
  .dishes{grid-template-columns:repeat(3,1fr);gap:8px}.dish{font-size:13px;padding:6px 3px}.dish svg{width:min(100%,64px)}
  .bigpic.sm{width:clamp(96px,17vh,210px)}.q-top{margin-bottom:6px}
  .match{gap:10px}
  .act-head{align-items:flex-start}
  .btn{padding:10px 16px}
  .char{width:64px}
  .bubble{padding:6px 12px 8px;border-radius:18px}
  #btext{padding-right:42px}
  .slot{width:34px;height:34px;padding:3px}
  .packbtn{padding:3px 6px}.pk-ico{width:26px}
  #hud{gap:6px}
  .hud-title{display:none}.packbtn{margin-left:auto}
  #dock{gap:6px}.char{width:52px}
  .bubble{padding:4px 10px 6px;margin-bottom:8px;border-width:3px}
  #btext{font-size:14.5px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;padding-right:36px}
  .bwho{font-size:11px}#bspeak{width:32px;height:32px;right:6px}
  .chat-scene{flex-direction:column;align-items:stretch}.waiter{width:80px;align-self:flex-start}
  .waiter{display:flex;align-items:flex-end;gap:8px;width:auto}.waiter svg{width:78px}
}
@media (max-height:560px) and (orientation:landscape){
  .char{width:64px}
  #btext{font-size:15px}
  .bubble{margin-bottom:6px}
  .toast{top:70px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .taxi.drive{left:30%}
}

  const nose=`<path d="M97 109Q100 112 103 109" fill="none" stroke="${SKIN_D}" stroke-width="2.6" stroke-linecap="round"/>`;

}

/* tapered limb with round ends (organic, not a stroked line) */
function tube(x1,y1,x2,y2,w1,w2,fill,bend=0,sw=1.5){
  const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L,r1=w1/2,r2=w2/2,m=(r1+r2)/2;
  const mx=(x1+x2)/2+nx*bend,my=(y1+y2)/2+ny*bend, f=v=>v.toFixed(1);
  return `<path d="M${f(x1+nx*r1)} ${f(y1+ny*r1)} Q${f(mx+nx*m)} ${f(my+ny*m)} ${f(x2+nx*r2)} ${f(y2+ny*r2)} A${r2} ${r2} 0 0 0 ${f(x2-nx*r2)} ${f(y2-ny*r2)} Q${f(mx-nx*m)} ${f(my-ny*m)} ${f(x1-nx*r1)} ${f(y1-ny*r1)} A${r1} ${r1} 0 0 0 ${f(x1+nx*r1)} ${f(y1+ny*r1)}Z" fill="${fill}" ${ol(sw)}/>`;
}

function arm(x1,y1,x2,y2,w1,w2,sleeve,skin,bend=0,thumb=1,cuff=""){
  const ang=Math.atan2(y2-y1,x2-x1)*180/Math.PI-90;
  return `<g transform="translate(${x2} ${y2}) rotate(${ang.toFixed(1)}) scale(${thumb} 1)"><path d="${THUMB}" fill="${skin}" ${ol(1.3)}/><path d="${HAND}" fill="${skin}" ${ol(1.4)}/><path d="M-3.5 5 Q0 7.4 3.5 5" fill="none" stroke="#E2A27E" stroke-width="1.1" stroke-linecap="round"/></g>`+tube(x1,y1,x2,y2,w1,w2,sleeve,bend)+cuff;
}
function bow(x,y,rot,s=1){

}function faceJ(o){
  const {iris="irisG",expr="happy",brow="#9A4A1E",lash="#3A2218",ey=120,gap=28,mouth="#B6404A",k=1,lashes=true}=o;
  const L=120-gap,R=120+gap;
  const flick=(cx,s)=>!lashes?"":`<path d="M${cx+s*13.2*k} ${ey-4} q${s*4.5} -1.5 ${s*6} -7" fill="none" stroke="${lash}" stroke-width="2.4" stroke-linecap="round"/>`;
  const shut=(cx,s)=>`<path d="M${cx-12.5} ${ey+3} Q${cx} ${ey-14} ${cx+12.5} ${ey+3}" fill="none" stroke="${lash}" stroke-width="3.4" stroke-linecap="round"/>`+flick(cx,s);
  const open=(cx,s,kk=1,lx=0,ly=0)=>eyeOpen(cx,ey,iris,kk*k,lx,ly,lash)+flick(cx,s);
  const bw=(cx,s,dy=0,tilt=0)=>`<path d="M${cx-12} ${ey-27+dy+(s<0?tilt:-tilt)} Q${cx} ${ey-33+dy} ${cx+12} ${ey-27+dy+(s<0?-tilt:tilt)}" fill="none" stroke="${brow}" stroke-width="2.8" stroke-linecap="round"/>`;
  const my=ey+24;
  const M={
    smile:`<path d="M111 ${my-1} Q120 ${my+14} 129 ${my-1} Q120 ${my+3} 111 ${my-1}Z" fill="${mouth}" ${ol(1.2)}/><path d="M115 ${my+7} Q120 ${my+11} 125 ${my+7} Q120 ${my+5} 115 ${my+7}Z" fill="#F7909E"/>`,
    big:`<path d="M103 ${my-5} Q120 ${my+30} 137 ${my-5} Q120 ${my+1} 103 ${my-5}Z" fill="${mouth}" ${ol(1.3)}/><path d="M106 ${my-3} Q120 ${my+2} 134 ${my-3} L132 ${my+3} Q120 ${my+6} 108 ${my+3}Z" fill="#fff"/><path d="M111 ${my+15} Q120 ${my+22} 129 ${my+15} Q120 ${my+10} 111 ${my+15}Z" fill="#F7909E"/>`,
    o:`<ellipse cx="120" cy="${my+4}" rx="6.5" ry="8.5" fill="${mouth}" ${ol(1.2)}/><ellipse cx="120" cy="${my+8}" rx="3.4" ry="3" fill="#F7909E"/>`,
    wavy:`<path d="M108 ${my+5} Q114 ${my-3} 120 ${my+3} Q126 ${my+9} 132 ${my+1}" fill="none" stroke="${mouth}" stroke-width="2.8" stroke-linecap="round"/>`,
    flat:`<path d="M110 ${my+3} Q120 ${my-1} 131 ${my+4}" fill="none" stroke="${mouth}" stroke-width="2.8" stroke-linecap="round"/>`,
    tiny:`<path d="M111 ${my} Q120 ${my+9} 129 ${my}" fill="none" stroke="${mouth}" stroke-width="2.8" stroke-linecap="round"/>`
  };
  let eyes,mo,br;
  switch(expr){
    case "cheer": eyes=shut(L,-1)+shut(R,1); mo=M.big; br=bw(L,-1,-3)+bw(R,1,-3); break;
    case "wow": eyes=open(L,-1,1.1)+open(R,1,1.1); mo=M.o; br=bw(L,-1,-5)+bw(R,1,-5); break;
    case "oops": eyes=open(L,-1,1,-1.6,2)+open(R,1,1,-1.6,2); mo=M.wavy; br=bw(L,-1,0,5)+bw(R,1,0,5); break;
    case "think": eyes=open(L,-1,1,2.6,-2)+open(R,1,1,2.6,-2); mo=M.flat; br=bw(L,-1,0)+bw(R,1,-6,-1); break;
    case "wink": eyes=shut(L,-1)+open(R,1); mo=M.smile; br=bw(L,-1,-2)+bw(R,1,0); break;
    case "soft": eyes=open(L,-1)+open(R,1); mo=M.tiny; br=bw(L,-1,0)+bw(R,1,0); break;
    default: eyes=open(L,-1)+open(R,1); mo=M.smile; br=bw(L,-1,0)+bw(R,1,0);
  }
  return `<g>${eyes}${br}<path d="M117.4 ${ey+14} q2.6 3.2 5.2 0" fill="none" stroke="#DE9A78" stroke-width="1.8" stroke-linecap="round"/>${mo}</g>`;
}

}

/* wrappers used by the game: mood names -> expressions, optional bust crop for the dock */
const EXPR={happy:'happy',joy:'cheer',wow:'wow',oops:'oops',think:'think'};
const BUSTVB=s=>s.replace('viewBox="0 0 240 340"','viewBox="30 14 180 180" preserveAspectRatio="xMidYMid slice"');

let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,t0,dur,type='sine',vol=.16){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;const t=a.currentTime+t0;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.05)}
const SFX={
  good(){[660,880,1175].forEach((f,i)=>tone(f,i*.09,.2,'triangle'))},
  bad(){tone(260,0,.18,'sine',.13);tone(200,.13,.26,'sine',.13)},
  flip(){tone(520,0,.08,'square',.05)},
  pop(){tone(780,0,.08,'sine',.12)},
  drop(){tone(330,0,.09,'triangle',.14);tone(440,.06,.09,'triangle',.1)},
  win(){[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,i*.13,.28,'triangle',.15))},
  tap(){tone(600,0,.05,'sine',.08)},
  stamp(){tone(130,0,.22,'sine',.38);tone(70,.02,.3,'triangle',.32);tone(900,.03,.05,'square',.05)}
};
const sfx=n=>{if(!P.sound)return;try{if(ac())SFX[n]()}catch(e){}};
let VF=null,VM=null;   // female voice (Emma, girls) and male voice (Max, waiter, boys)
const FEM=/female|zira|samantha|jenny|aria|susan|hazel|karen|moira|tessa|victoria|fiona|libby|sonia|emma/i;
const MAL=/\bmale\b|david|mark|guy|daniel|alex|fred|george|ryan|james|thomas|oliver|christopher|eric|brian|roger|steffan/i;
function pickVoice(){try{
  const all=speechSynthesis.getVoices(),en=all.filter(x=>/^en/i.test(x.lang)),us=en.filter(x=>/en[-_](US|GB)/i.test(x.lang));
  const pool=us.length?us:en;
  VM=pool.find(x=>MAL.test(x.name)&&!/female/i.test(x.name))||null;
  VF=pool.find(x=>FEM.test(x.name))||pool.find(x=>x!==VM)||pool[0]||null;
}catch(e){}}
if('speechSynthesis' in window){pickVoice();try{speechSynthesis.onvoiceschanged=pickVoice}catch(e){}}
/* who: 'emma' = girl's voice, 'max' = boy's/man's voice. If the device has no male voice, the pitch is lowered. */
function speak(text,force,who='emma'){
  if(!('speechSynthesis' in window)||(!force&&!P.sound))return;
  try{
    speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(text).replace(/\$(\d+)/g,'$1 dollars'));u.lang='en-US';u.rate=.88;
    const male=who==='max';const v=male?VM:VF;
    if(v){u.voice=v;u.lang=v.lang}
    u.pitch=male?(VM?.95:.55):(VF?1.1:1.25);
    speechSynthesis.speak(u);
  }catch(e){}
}

async function flyClone(src,dest,ms=480){
  if(!src||!dest||reduceMotion())return;
  const a=rect(src),b=rect(dest);
  const g=src.cloneNode(true);g.classList.add('fly');g.style.cssText=`left:${a.left}px;top:${a.top}px;width:${a.width}px;height:${a.height}px`;
  document.body.appendChild(g);
  const dx=b.left+b.width/2-(a.left+a.width/2),dy=b.top+b.height/2-(a.top+a.height/2),s=Math.max(.3,Math.min(1,b.width/a.width));
  const an=g.animate([{transform:'translate(0,0) scale(1)'},{transform:`translate(${dx*.5}px,${dy*.5-40}px) scale(1.1)`,offset:.5},{transform:`translate(${dx}px,${dy}px) scale(${s})`}],{duration:ms,easing:'cubic-bezier(.3,.7,.4,1)'});

}

/* ---------- Activity controller (cancels timers/async flows when you leave or restart) ---------- */
let ctl=null;
function newCtl(){
  killCtl();
  const c={alive:true,timers:new Set()};
  c.after=(ms,fn)=>{const t=setTimeout(()=>{c.timers.delete(t);if(c.alive)fn()},ms);c.timers.add(t);return t};
  c.sleep=ms=>new Promise(res=>{c.after(ms,res)});         // never resolves once the activity is dead
  c.wait=p=>new Promise(res=>{p.then(v=>{if(c.alive)res(v)})});
  ctl=c;return c;
}
function killCtl(){if(ctl){ctl.alive=false;ctl.timers.forEach(clearTimeout)}ctl=null;try{speechSynthesis.cancel()}catch(e){}}

/* ---------- Pointer-based drag & drop (mouse + touch) with tap fallback ---------- */
function dropAt(x,y){for(const e of document.elementsFromPoint(x,y)){const d=e.closest&&e.closest('[data-drop]');if(d)return d}return null}
function makeDrag(node,o){
  node.style.touchAction='none';
  node.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&o.tap){e.preventDefault();o.tap(node)}});
  node.addEventListener('pointerdown',e=>{
    if(e.button!==undefined&&e.button>0)return;
    if(o.can&&!o.can(node))return;
    const sx=e.clientX,sy=e.clientY,r=rect(node),ox=sx-r.left,oy=sy-r.top;
    let ghost=null,moved=false,over=null,raf=0,lx=sx,ly=sy;
    const hit=()=>{const t=dropAt(lx,ly);if(t!==over){over&&over.classList.remove('over');over=t;over&&over.classList.add('over')}};
    const tick=()=>{ /* scroll the page when the finger or mouse is near the top/bottom edge, so far-away targets can be reached */
      const top=72,bottom=innerHeight-96;let dy=0;
      if(ly<top)dy=-Math.ceil((top-ly)/5);else if(ly>bottom)dy=Math.ceil((ly-bottom)/5);
      if(dy){window.scrollBy(0,dy);hit()}
      raf=requestAnimationFrame(tick);
    };
    const move=ev=>{
      lx=ev.clientX;ly=ev.clientY;
      if(!moved&&Math.hypot(lx-sx,ly-sy)>8){
        moved=true;ghost=node.cloneNode(true);ghost.classList.add('ghost');ghost.style.width=r.width+'px';ghost.style.height=r.height+'px';
        document.body.appendChild(ghost);node.classList.add('dragging');sfx('pop');raf=requestAnimationFrame(tick);
      }
      if(moved){ghost.style.left=(lx-ox)+'px';ghost.style.top=(ly-oy)+'px';hit()}
    };
    const end=ev=>{
      cancelAnimationFrame(raf);
      window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',end);window.removeEventListener('pointercancel',end);
      over&&over.classList.remove('over');
      if(ghost)ghost.remove();node.classList.remove('dragging');
      if(!moved){o.tap&&o.tap(node)}
      else if(ev.type==='pointerup'){const t=dropAt(ev.clientX,ev.clientY);o.drop&&o.drop(t,node)}
    };
    window.addEventListener('pointermove',move);window.addEventListener('pointerup',end);window.addEventListener('pointercancel',end);
  });
}

let toastTimer=null;
function toast(text,kind='good',ms=1150){
  const t=$('#toast');t.className='toast';void t.offsetWidth;
  t.innerHTML=(kind==='good'?starSVG('t-star'):'')+`<span>${text}</span>`;
  t.className='toast show '+kind;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),ms);
}
function confetti(count=150,dur=3200){
  const c=$('#fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  if(reduceMotion())count=24;
  const cols=['#ffc61a','#ff5d5d','#2dbf86','#2f80ed','#ff86b6','#9a78f4','#ff9a1f'];
  const ps=Array.from({length:count},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.6,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,s:7+Math.random()*9,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:one(cols),star:Math.random()<.3}));
  const t0=performance.now();
  (function frame(t){
    x.clearRect(0,0,c.width,c.height);
    for(const p of ps){p.x+=p.vx;p.y+=p.vy;p.vy+=.035;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;
      if(p.star){x.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?p.s*.45:p.s;x.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}x.closePath();x.fill()}
      else x.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);x.restore()}
    if(t-t0<dur)requestAnimationFrame(frame);else x.clearRect(0,0,c.width,c.height);
  })(t0);
}

/* ---------- Modal (no alert/confirm: built into the page) ---------- */
function modal({title='',html='',buttons=[],cls='',dismiss=true}){
  const root=$('#modalRoot');
  const m=h(`<div class="overlay"><div class="dialog ${cls}" role="dialog" aria-modal="true" aria-label="${title.replace(/<[^>]+>/g,'')}">${title?`<h2>${title}</h2>`:''}<div class="dlg-body">${html}</div><div class="dlg-btns"></div></div></div>`);
  const close=()=>{m.remove();document.removeEventListener('keydown',esc)};
  const esc=e=>{if(e.key==='Escape'&&dismiss)close()};
  buttons.forEach(b=>{const x=h(`<button class="btn ${b.cls||''}">${b.label}</button>`);x.onclick=()=>{if(b.close!==false)close();b.onClick&&b.onClick()};$('.dlg-btns',m).appendChild(x)});
  if(!buttons.length)$('.dlg-btns',m).remove();
  if(dismiss)m.addEventListener('pointerdown',e=>{if(e.target===m)close()});
  document.addEventListener('keydown',esc);root.appendChild(m);
  const f=$('.btn',m);f&&f.focus({preventScroll:true});
  return {el:m,close};
}
const closeModals=()=>{$('#modalRoot').innerHTML=''};

  ${[[.2,.3],[.5,.6],[.78,.3],[.35,.75],[.7,.74]].map(([a,b])=>`<circle cx="${L.park[0]+a*L.park[2]}" cy="${L.park[1]+b*L.park[3]}" r="10" fill="#4fae52" stroke="#1b2a52" stroke-width="2.6"/>`).join('')}

  <text transform="translate(${L.wt[0]} ${L.wt[1]}) rotate(${L.wt[2]})" text-anchor="middle" class="maplbl w">${L.water}</text>`;
  /* route */
  const nd=L.nodes;
  for(let i=0;i<3;i++){
    const [ax,ay]=nd[i],[bx,by]=nd[i+1],sg=i%2?1:-1,cx=(ax+bx)/2+(by-ay)*.22*sg,cy=(ay+by)/2-(bx-ax)*.22*sg;

      <g transform="translate(0 134)">${[0,1,2].map(k=>`<path class="st ${k<stars?'on':''}" d="${starPath((k-1)*34,0,15,6.6)}"/>`).join('')}</g>

  });
  if(cur>0){const [x,y]=nd[cur-1];s+=`<g transform="translate(${x-128} ${y-66})"><g class="taxiwrap">${taxiSVG('maptaxi').replace('<svg ','<svg width="104" height="51" ')}</g></g>`}

  root.innerHTML=`<div class="phase-card panel">

    <div class="act-list">${ph.acts.map((a,i)=>`<button class="act-item ${doneI(i)?'done':unlocked(i)?'next':'locked'}" data-i="${i}" ${unlocked(i)?'':'disabled'}><span class="ai-n">${doneI(i)?ic('check'):unlocked(i)?i+1:ic('lock')}</span><span class="ai-t"><b>${a.title}</b><small>${a.blurb}</small></span></button>`).join('')}</div>
    <div class="phase-words">${ph.words.slice(0,10).map(w=>`<span class="wchip">${foodSVG(w)}<b>${fname(w)}</b></span>`).join('')}</div>

  const start=i=>{ac();sfx('good');if(i===0||P.done[n])P.mist[n]=P.done[n]&&i>0?P.mist[n]:0;save();playAct(n,i)};
  $('#pGo',root).onclick=()=>start(P.done[n]?0:P.act[n]);
  $$('.act-item',root).forEach(b=>b.onclick=()=>start(+b.dataset.i));
  $$('.wchip',root).forEach((c,i)=>c.onclick=()=>{speak(fname(ph.words[i]),true);bounce(c)});

SCREENS.activity=(root,{n,idx})=>{
  const ph=PHASES[n-1],act=ph.acts[idx];setBg(ph.scene);
  setHudTitle(`<span class="chip lv${n}">${ph.lvl}</span><span class="hudact">Activity ${idx+1} of ${ph.acts.length}</span>${dots(ph.acts.length,idx)}`);

  const c=newCtl();
  const api={ctl:c,body:$('#actBody',root),n,idx,done:()=>actDone(n,idx)};
  $('#aRestart',root).onclick=()=>{sfx('tap');P.mist[n]=Math.max(0,(P.mist[n]||0));playAct(n,idx)};

function actDone(n,idx){
  const ph=PHASES[n-1],last=idx===ph.acts.length-1;
  P.act[n]=Math.max(P.act[n],idx+1);save();
  sfx('win');confetti(60,1800);say(other(),'Fantastic! Activity complete!','joy');
  modal({title:last?'Level complete!':'Activity complete!',cls:'done-dlg',dismiss:false,
    html:`<div class="dd-chars">${emmaSVG('joy','cheer',true)}${maxSVG('joy','cheer',true)}</div><p>${last?'You finished every activity. Let\'s see your reward!':'Great job, explorer! Ready for the next one?'}</p>`,
    buttons:[{label:last?'See my reward '+ic('arrow'):'Next activity '+ic('arrow'),cls:'primary',onClick:()=>last?finishPhase(n):playAct(n,idx+1)},{label:ic('replay')+' Play it again',onClick:()=>playAct(n,idx)}]});
}
function finishPhase(n){
  const first=!P.done[n],st=starsFor(P.mist[n]||0);
  P.stars[n]=Math.max(P.stars[n],st);P.done[n]=true;P.act[n]=0;save();

}

/* Shared mini chat engine: the waiter speaks, the player chooses what to say */
function chatKit(api,host){
  const {ctl}=api,chat=$('.chat',host),reply=$('.reply',host);
  const down=()=>{chat.scrollTop=chat.scrollHeight};
  const waiterMood=m=>{const a=$('.w-av',host);if(a)a.innerHTML=waiterSVG(m)};
  async function wSay(text){
    const b=h('<div class="cb w typing"><i></i><i></i><i></i></div>');chat.appendChild(b);down();
    await ctl.sleep(520);b.className='cb w';b.textContent=text;speak(text,false,'max');down();
    await ctl.sleep(650+Math.min(1500,text.length*24));
  }
  function pSay(text){const b=h('<div class="cb p"></div>');b.textContent=text;chat.appendChild(b);down();speak(text)}
  function phrase(correct,wrongs,tip){
    return new Promise(res=>{
      const opts=shuffle([{t:correct,ok:1},...wrongs.map(t=>({t,ok:0}))]);
      reply.innerHTML=`<div class="reply-h">What do you say?</div><div class="phrases">${opts.map((o,i)=>`<button class="phr" data-i="${i}"><span class="al">${'ABC'[i]}</span><span>${o.t}</span></button>`).join('')}</div>`;
      $$('.phr',reply).forEach(b=>b.onclick=()=>{
        const o=opts[+b.dataset.i];
        if(o.ok){$$('.phr',reply).forEach(x=>x.disabled=true);b.classList.add('right');good();waiterMood('joy');setTimeout(()=>{reply.innerHTML='';pSay(o.t);waiterMood('happy');res()},650)}
        else{b.disabled=true;b.classList.add('wrong');shake(b);waiterMood('think');bad(tip||'Think about what is polite and natural.')}
      });
    });
  }
  function choose(cat,tpl,label){
    return new Promise(res=>{
      const items=MENU.filter(m=>m.cat===cat);
      reply.innerHTML=`<div class="reply-h">${label}</div><div class="picks">${items.map(m=>`<button class="pick" data-id="${m.id}">${foodSVG(m.id)}<span>${fname(m.id)}</span><b>$${m.price}</b></button>`).join('')}</div>`;
      $$('.pick',reply).forEach(b=>b.onclick=()=>{
        const m=M(b.dataset.id);$$('.pick',reply).forEach(x=>x.disabled=true);b.classList.add('right');sfx('good');
        setTimeout(()=>{reply.innerHTML='';pSay(tpl(m.ask));res(m)},550);
      });
    });
  }
  return {wSay,pSay,phrase,choose,waiterMood,clear:()=>{chat.innerHTML='';reply.innerHTML=''}};
}

PHASES[2].acts.push({title:'THE FINAL RESTAURANT CHALLENGE',blurb:'Choose, order and pay like a real customer',start(api){

      const fin=h('<button class="btn big primary pulse">FINISH THE ADVENTURE!</button>');fin.onclick=()=>go('final');
      const again=h(`<button class="btn">${ic('replay')} Make it again</button>`);again.onclick=()=>go('recipe');
      $('#rBtns',root).append(fin,again);busy=false;done=true;
    };
    $('#rBtns',root).appendChild(b);
  };
  let done=false;
  const place=id=>{
    if(busy||done||step>=3)return;
    const card=$(`.ing[data-id="${id}"]`,root);
    if(id!==order[step]){
      shake(card);bad(`Not yet! ${RECIPE_LINES[step]}`,.1);
      const nx=$(`.ing[data-id="${order[step]}"]`,root);nx&&nx.classList.add('next');return;
    }
    const svg=SW[id];
    layers.appendChild(hs(`<g class="layer drop l-${id}">${svg}</g>`));
    card.classList.add('used');card.disabled=true;sfx('drop');speak(fname(id));good();
    $('#dropHint',root).style.display='none';
    setStep(step+1);
    if(step<3){later(()=>say(lines[step][0],lines[step][1],lines[step][2]),1300)}
    else{later(()=>say(lines[3][0],lines[3][1],lines[3][2]),1300);together()}
  };
  $$('.ing',root).forEach(b=>makeDrag(b,{can:n=>!n.disabled,tap:()=>place(b.dataset.id),drop:t=>{if(t&&t.dataset.drop==='plate')place(b.dataset.id)}}));
};

/* ---------- Celebration + diploma ---------- */
const medalSVG=()=>`<svg viewBox="0 0 160 200" class="medal-svg" aria-hidden="true"><path d="M40 0L72 82L96 70L66 0Z" fill="#e5484d" stroke="#1b2a52" stroke-width="3.5" stroke-linejoin="round"/><path d="M120 0L88 82L64 70L94 0Z" fill="#2f80ed" stroke="#1b2a52" stroke-width="3.5" stroke-linejoin="round"/><circle cx="80" cy="124" r="62" fill="#ffc61a" stroke="#1b2a52" stroke-width="5"/><circle cx="80" cy="124" r="48" fill="#ffd95a" stroke="#d99a00" stroke-width="4"/><path d="${starPath(80,124,34,15)}" fill="#fff" stroke="#d99a00" stroke-width="4" stroke-linejoin="round"/><g fill="#d99a00"><circle cx="80" cy="66" r="3"/><circle cx="80" cy="182" r="3"/><circle cx="22" cy="124" r="3"/><circle cx="138" cy="124" r="3"/></g></svg>`;
SCREENS.final=root=>{
  setBg('title');setHudTitle('<span class="chip lv4">YOU DID IT!</span>');
  const tot=(P.stars[1]||0)+(P.stars[2]||0)+(P.stars[3]||0);
  const date=new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
  root.innerHTML=`<div class="final-wrap">
    <div class="fin-chars"><div class="fc">${emmaSVG('joy','cheer')}</div><div class="fc">${maxSVG('joy','cheer')}</div></div>
    <h1 class="fin-h">CONGRATULATIONS, FOOD EXPLORER!</h1>
    <p class="fin-p">You have completed all three levels!<br><b>Now you are a true English Explorer!</b></p>
    <div class="diploma"><div class="medal">${medalSVG()}</div><div class="dip-body">
      <div class="dip-top">FOOD EXPLORER</div><div class="dip-sub">DIPLOMA &middot; NEW YORK</div>
      <div class="dip-line">This medal is awarded to</div><div class="dip-name" id="dipName"></div>
      <div class="dip-line">for finishing the Food Adventure in New York!</div>
      <div class="dip-stars">${starsRow(Math.round(tot/3),3,'big')}<span>${tot} of 9 stars</span></div>
      <div class="dip-sign"><span>Emma &amp; Max</span><span>${date}</span></div></div></div>
    <label class="namebox" for="nameIn">Write your name for the diploma:</label>
    <input id="nameIn" class="nameinput" maxlength="22" autocomplete="off" placeholder="Your name" value="">
    <div class="row"><button class="btn big primary pulse" id="fPass">GET MY PASSPORT STAMP!</button><button class="btn" id="fMap">Back to the map</button><button class="btn" id="fNew">${ic('replay')} Play again</button></div></div>`;
  const nm=$('#nameIn',root),dn=$('#dipName',root);nm.value=P.name||'';
  const upd=()=>{dn.textContent=nm.value.trim()||'Food Explorer'};upd();
  nm.oninput=()=>{P.name=nm.value.slice(0,22);save();upd()};
  $('#fMap',root).onclick=()=>go('map');$('#fPass',root).onclick=()=>{ac();go('passport')};
  $('#fNew',root).onclick=()=>modal({title:'Play the whole adventure again?',html:'<p>Your ingredients and stars will be erased, but your name stays.</p>',buttons:[
    {label:'Yes, play again',cls:'primary',onClick:()=>{const snd=P.sound,name=P.name;P=DEF();P.sound=snd;P.name=name;P.seenIntro=true;save();go('map')}},{label:'No, stay here'}]});
  sfx('win');confetti(260,5200);
  say('emma','CONGRATULATIONS, FOOD EXPLORER!','joy',{speak:true});
  later(()=>say('max','You have completed all three levels!','joy'),3200);
  later(()=>say('emma','Now you are a true English Explorer!','joy'),6400);
};

/* ---------- Passport: 5 destinations. Circle 1 = United Kingdom (City Adventure, already stamped), circle 2 = New York (stamped now), the rest are a surprise ---------- */
const PASS_NAMES=['United Kingdom','New York','?','?','?'];
function ukStamp(){
  const flag=`<g clip-path="url(#ukClip)"><rect x="40" y="40" width="120" height="120" fill="#2B3F9A"/><path d="M40 40L160 160M160 40L40 160" stroke="#fff" stroke-width="18"/><path d="M40 40L160 160M160 40L40 160" stroke="#C8283C" stroke-width="7"/><path d="M100 40V160M40 100H160" stroke="#fff" stroke-width="30"/><path d="M100 40V160M40 100H160" stroke="#C8283C" stroke-width="17"/></g>`;
  return stampFrame('uk','UNITED KINGDOM','ENGLISH EXPLORERS ★ 1',flag,'#2B3F9A','#C8283C');
}
function nyStamp(){
  const lib=`<g transform="translate(100 150) scale(.5)" fill="#1F7A6A" stroke="#1F7A6A" stroke-width="3" stroke-linejoin="round"><path d="M-30 0L30 0L24 -40L-24 -40Z" opacity=".55"/><path d="M-16 -40L16 -40L24 -96L10 -140L-10 -140L-24 -96Z"/><circle cx="0" cy="-156" r="14"/><path d="M-12 -164L-28 -178M-6 -168L-14 -188M0 -170L0 -192M6 -168L14 -188M12 -164L28 -178" stroke-width="6" stroke-linecap="round"/><path d="M12 -128C30 -146 36 -180 32 -208" fill="none" stroke-width="14" stroke-linecap="round"/><path d="M32 -208C22 -220 30 -234 34 -240C42 -232 48 -220 40 -208Z" fill="#C8283C" stroke="#C8283C"/></g>`;
  return stampFrame('ny','NEW YORK','ENGLISH EXPLORERS ★ 2',lib,'#C8283C','#2B3F9A');
}
function stampFrame(id,top,bottom,center,c1,c2){
  return `<svg viewBox="0 0 200 200" aria-hidden="true"><defs><filter id="ink${id}" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3.4"/></filter><clipPath id="${id}Clip"><circle cx="100" cy="100" r="52"/></clipPath><path id="${id}Top" d="M26 100A74 74 0 0 1 174 100"/><path id="${id}Bot" d="M16 100A84 84 0 0 0 184 100"/></defs>
  <g filter="url(#ink${id})" opacity=".92"><circle cx="100" cy="100" r="94" fill="none" stroke="${c1}" stroke-width="6"/><circle cx="100" cy="100" r="86" fill="none" stroke="${c1}" stroke-width="2.4"/><circle cx="100" cy="100" r="58" fill="none" stroke="${c2}" stroke-width="4"/>${center}
  <text font-family="Fredoka,Trebuchet MS,sans-serif" font-weight="700" font-size="18" letter-spacing="3" fill="${c1}"><textPath href="#${id}Top" startOffset="50%" text-anchor="middle">${top}</textPath></text>
  <text font-family="Fredoka,Trebuchet MS,sans-serif" font-weight="700" font-size="12.5" letter-spacing="2.2" fill="${c2}"><textPath href="#${id}Bot" startOffset="50%" text-anchor="middle">${bottom}</textPath></text></g></svg>`;
}
SCREENS.passport=root=>{
  setBg('title');setHudTitle('<span class="chip lv4">PASSPORT</span>');CUR=null;
  root.innerHTML=`<div class="pp-wrap"><h1 class="pp-title">Passport</h1><div class="pp-book" id="ppBook"><div class="pp-head"><span class="face">${emmaSVG('happy','idle',true)}</span><span>EMMA &amp; MAX &middot; PASSPORT</span><span class="face">${maxSVG('happy','idle',true)}</span></div>
   <div class="pp-grid">${PASS_NAMES.map((n,i)=>`<div class="pp-slot ${i===0?'pre done':''}" id="ppSlot${i}"><div class="pp-circle"><span class="q">?</span><span class="pp-ring"></span>${i===0?`<div class="pp-stamp">${ukStamp()}</div>`:i===1?`<div class="pp-stamp">${nyStamp()}</div>`:''}</div><div class="pp-name" id="ppName${i}">${i===0?n:'?'}</div><div class="pp-num">Destination ${i+1}</div></div>`).join('')}</div></div>
   <p class="pp-msg" id="ppMsg">Emma and Max are ready to travel!</p>
   <div class="row" id="ppBtns" hidden><button class="btn big primary" id="ppMap">BACK TO THE MAP</button><button class="btn" id="ppDip">Back to my diploma</button></div></div>`;
  $('#ppMap',root).onclick=()=>go('map');$('#ppDip',root).onclick=()=>go('final');
  speak('Congratulations! Here is your passport.',false,'emma');
  const slot=$('#ppSlot1',root);
  later(()=>{
    slot.classList.add('stamped','done');
    later(()=>{
      sfx('stamp');const b=$('#ppBook',root);b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');
      confetti(80,2200);const nm=$('#ppName1',root);nm.textContent=PASS_NAMES[1];nm.classList.add('new');
    },520);
    later(()=>{
      P.stamped=true;save();sfx('win');
      $('#ppMsg',root).textContent='Second stamp collected! Where will Emma and Max travel next?';
      speak('Where will Emma and Max travel next?',false,'emma');$('#ppBtns',root).hidden=false;
    },1800);
  },900);
};
