<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Emma and Max - The Australian Adventure</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap">
<style>
/* Australia: sand paper, ocean navy ink, coral orange and eucalyptus green. Soft shadows, thin warm lines. */
:root{
  --ink:#1F3A5C; --paper:#FFF7E6; --paper2:#FBEBC8; --edge:#7A5545; --verm:#EE5A2C; --verm2:#CF4219; --sakura:#FFB38A; --gold:#F5B327;
  --matcha:#3FA58C; --sky:#BFE7F2; --good:#2E9E5B; --bad:#D6402C; --indigo:#2E5C8A;
  --display:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",ui-rounded,system-ui,sans-serif;
  --body:"Nunito","Trebuchet MS",ui-rounded,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:#F4DDB9;color:var(--ink);font-family:var(--body);font-weight:700}
button{font-family:inherit;color:inherit}
#app{position:fixed;inset:0;overflow:hidden;background:#F4DDB9}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));animation:fadein .5s ease both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
[hidden]{display:none!important}
:focus-visible{outline:4px solid #fff;outline-offset:2px;box-shadow:0 0 0 7px var(--verm)}
svg{display:block}
.bg{position:absolute;inset:0;z-index:-2;overflow:hidden}.bg>svg{width:100%;height:100%}
.shade{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(255,248,234,0) 30%,rgba(255,236,214,.55) 100%)}

/* buttons */
.btn{appearance:none;border:0;border-radius:999px;font-family:var(--display);font-weight:800;font-size:clamp(19px,2.6vw,26px);line-height:1;padding:14px 30px;min-height:56px;cursor:pointer;color:#fff;background:linear-gradient(#FF7B45,#EE5A2C);box-shadow:0 5px 0 #B63E17,0 10px 18px rgba(120,40,20,.25);transition:transform .1s,box-shadow .1s,filter .15s;display:inline-flex;align-items:center;justify-content:center;gap:10px;white-space:nowrap;touch-action:manipulation}
.btn:hover{transform:translateY(-2px);filter:brightness(1.05)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #B63E17}
.btn svg{width:24px;height:24px;flex:none}
.btn.gold{background:linear-gradient(#FFD45C,#F5B327);color:var(--ink);box-shadow:0 5px 0 #C58A12,0 10px 18px rgba(120,80,10,.22)}
.btn.green{background:linear-gradient(#6CC48C,#3E9A64);box-shadow:0 5px 0 #2B7449,0 10px 18px rgba(30,90,50,.22)}
.btn.paper{background:linear-gradient(#FFFDF6,#F7EAD0);color:var(--ink);box-shadow:0 5px 0 #CDB58E,0 10px 18px rgba(90,60,20,.18)}
.btn.sm{font-size:18px;min-height:46px;padding:9px 20px}
.btn.big{font-size:clamp(30px,5vw,52px);padding:16px clamp(34px,6vw,76px);min-height:76px;animation:throb 1.8s ease-in-out infinite}
@keyframes throb{50%{transform:scale(1.05)}}
.btn[disabled]{opacity:.5;cursor:default;animation:none}
.iconbtn{width:50px;height:50px;min-height:0;padding:0;font-size:0}.iconbtn svg{width:26px;height:26px}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,250,238,.95);border-radius:99px;padding:5px 14px 5px 10px;font-family:var(--display);font-weight:800;font-size:20px;height:46px;box-shadow:0 3px 10px rgba(90,50,20,.22)}
.pill .star{width:28px;height:28px}
.star{width:34px;height:34px}

/* characters */
.ch{display:block;animation:bob 3s ease-in-out infinite;transform-origin:50% 100%}
.ch svg{width:100%;height:auto;overflow:visible;filter:drop-shadow(0 6px 8px rgba(70,40,20,.2))}
.ch.b2{animation-delay:-1.5s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.face{width:100%;height:100%;border-radius:50%;overflow:hidden;background:#CDEBF7}.face svg{width:100%;height:100%}

/* HUD */
.hud{display:flex;align-items:center;gap:10px;padding-block:max(10px,env(safe-area-inset-top,0px)) 6px;min-height:66px;flex:none}
.hud .mid{flex:1;min-width:0;text-align:center}
.hud .ttl{font-family:var(--display);font-weight:800;font-size:clamp(17px,2.8vw,26px);line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 0 rgba(255,255,255,.7)}
.pbar{height:12px;border-radius:99px;background:rgba(45,49,86,.16);overflow:hidden;margin:5px auto 0;max-width:380px}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#FFB38A,#EE5A2C);border-radius:99px;transition:width .6s cubic-bezier(.3,1.4,.5,1)}

/* start */
#s-start{align-items:center;justify-content:space-between;text-align:center;padding-block:max(16px,env(safe-area-inset-top,0px)) 0}
#s-start .snd{position:absolute;top:max(12px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px))}
.titlebox{margin-top:clamp(0px,2vh,20px)}
.kicker{display:inline-block;background:var(--ink);color:#FFE9A8;font-family:var(--display);font-weight:800;font-size:clamp(15px,2.4vw,24px);letter-spacing:.22em;padding:4px 22px 4px 26px;border-radius:99px;box-shadow:0 4px 10px rgba(45,49,86,.3)}
.title{margin:8px 0 0;font-family:var(--display);font-weight:800;font-size:clamp(44px,10vw,116px);line-height:.88;color:#fff;text-shadow:0 3px 0 #EE5A2C,0 6px 0 #A83412,0 12px 22px rgba(80,20,10,.35);letter-spacing:.01em}
.title em{font-style:normal;color:#FFE27A;text-shadow:0 3px 0 #EE5A2C,0 6px 0 #A83412,0 12px 22px rgba(80,20,10,.35)}
.ribbon{display:inline-block;margin-top:14px;background:linear-gradient(#FFFDF6,#F7EAD0);font-family:var(--display);font-weight:800;font-size:clamp(17px,3vw,30px);padding:4px 26px 6px;border-radius:12px;box-shadow:0 5px 0 #CDB58E,0 10px 16px rgba(90,60,20,.2);transform:rotate(-1.5deg);color:var(--ink)}
.heroes{display:flex;align-items:flex-end;justify-content:center;gap:clamp(12px,5vw,70px);width:100%;padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
.heroes .ch{height:clamp(190px,40vh,420px);aspect-ratio:240/340}
.heroes .btn{margin-bottom:clamp(12px,5vh,50px)}

/* speech bubble / coach */
.coach{display:flex;align-items:center;gap:12px;flex:none;padding:6px 0 max(10px,env(safe-area-inset-bottom,0px))}
.coach .av{flex:none;width:clamp(58px,9vw,84px);aspect-ratio:1;border-radius:50%;border:3px solid #fff;box-shadow:0 4px 12px rgba(70,40,20,.3);overflow:hidden;background:#CDEBF7}
.coach .av svg{width:100%;height:100%}
.say{position:relative;flex:1;min-width:0;background:linear-gradient(#FFFFFF,#FFF7E6);border-radius:22px;padding:10px 16px 12px;font-size:clamp(16px,2.4vw,23px);line-height:1.25;box-shadow:0 6px 16px rgba(70,40,20,.22);cursor:pointer;display:flex;align-items:center;gap:10px}
.say::before{content:"";position:absolute;left:-9px;top:50%;width:20px;height:20px;background:#FFFCF3;transform:translateY(-50%) rotate(45deg);border-radius:4px}
.say .nm{display:block;font-family:var(--display);font-size:.8em;line-height:1;color:var(--verm)}
.say .tx{flex:1;min-width:0}
.say .rep{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:linear-gradient(#FFD45C,#F5B327);display:grid;place-items:center;box-shadow:0 3px 0 #C58A12;cursor:pointer;color:var(--ink);padding:0}
.say .rep svg{width:24px;height:24px}
.say.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.94)}to{transform:none}}
.say.ok .nm{color:var(--good)}.say.no .nm{color:var(--bad)}

/* map */
#s-map{padding-bottom:0}
.mapwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.mapbox{position:relative;width:min(100%,calc((100dvh - 190px)*1.6667));aspect-ratio:5/3;border-radius:28px;overflow:hidden;box-shadow:0 0 0 5px #fff,0 12px 28px rgba(60,40,20,.32);background:#9ED4E8}
.mapbox>svg{position:absolute;inset:0;width:100%;height:100%}
.stop{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0;cursor:pointer;width:30%}
.stop .disc{width:clamp(60px,10.5vw,104px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFFFFF,#FFF0CF);display:grid;place-items:center;box-shadow:0 0 0 4px #fff,0 0 0 7px var(--verm),0 8px 16px rgba(70,30,20,.35);animation:pulse 2s ease-in-out infinite;position:relative}
.stop:nth-of-type(2) .disc{animation-delay:-.7s}.stop:nth-of-type(3) .disc{animation-delay:-1.4s}
@keyframes pulse{50%{transform:scale(1.07)}}
.stop .disc svg{width:64%;height:64%}
.stop .lbl{font-family:var(--display);font-weight:800;font-size:clamp(12px,1.9vw,20px);line-height:1.05;background:#fff;border-radius:12px;padding:4px 12px 5px;box-shadow:0 3px 8px rgba(70,40,20,.28);white-space:nowrap}
.stop .lbl small{display:block;font-size:.62em;letter-spacing:.14em;color:var(--verm);font-weight:800}
.stop .st{display:flex;gap:1px;background:rgba(255,255,255,.92);border-radius:99px;padding:1px 6px;box-shadow:0 2px 6px rgba(70,40,20,.25)}.stop .st .star{width:clamp(16px,2.4vw,24px);height:clamp(16px,2.4vw,24px)}
.stop:hover .disc{animation-play-state:paused;transform:scale(1.1)}
.mapfig{position:absolute;pointer-events:none;width:clamp(36px,6vw,66px);transition:left .7s ease,top .7s ease;transform:translate(-50%,-92%)}
.guide{display:flex;align-items:center;gap:12px;flex:none;padding:10px 0 max(12px,env(safe-area-inset-bottom,0px))}
.scene.objscene{background:radial-gradient(circle at 50% 40%,#FFFFFF,#FBEBC8)}.bigicon{position:absolute;inset:6%;display:grid;place-items:center}.bigicon svg{height:100%;width:auto;max-width:100%}
.devbar{position:absolute;right:12px;bottom:calc(max(12px,env(safe-area-inset-bottom,0px)) + 4px);display:flex;gap:8px;z-index:5}
.devbar button{font:inherit;font-size:13px;font-weight:800;border:2px dashed rgba(45,49,86,.45);background:rgba(255,255,255,.7);color:var(--ink);border-radius:10px;padding:5px 10px;cursor:pointer}

/* world screen */
#s-world{align-items:center}
.wcard{margin:auto;width:min(920px,100%);background:rgba(255,250,238,.94);border-radius:30px;padding:clamp(14px,3vh,28px) clamp(14px,3vw,30px) clamp(16px,3vh,28px);box-shadow:0 16px 40px rgba(60,30,20,.35);text-align:center;display:flex;flex-direction:column;gap:clamp(8px,1.6vh,16px)}
.wk{font-family:var(--display);font-weight:800;letter-spacing:.2em;color:var(--verm);font-size:clamp(14px,2vw,20px)}
.wcard h2{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(28px,5.4vw,56px);line-height:.95}
.wsub{margin:0;font-size:clamp(14px,2vw,19px);color:#4F6585}
.levels{display:flex;gap:clamp(8px,2vw,18px);justify-content:center;flex-wrap:wrap}
.lvl{position:relative;flex:1 1 190px;max-width:270px;border:0;border-radius:24px;padding:14px 12px 16px;cursor:pointer;background:linear-gradient(#FFFFFF,#FBEBC8);box-shadow:0 6px 0 #D9BF93,0 12px 20px rgba(90,60,20,.2);transition:transform .12s;display:flex;flex-direction:column;align-items:center;gap:4px}
.lvl:hover:not(.locked){transform:translateY(-4px)}
.lvl .lk{font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.16em;color:var(--verm)}
.lvl b{font-family:var(--display);font-size:clamp(26px,4vw,38px);line-height:1}
.lvl small{font-size:14px;color:#587089}
.lvl .st{margin-top:4px}.lvl .st .star{width:46px;height:46px}
.lvl.locked{cursor:default;background:linear-gradient(#EFEAE0,#DDD5C4);box-shadow:0 6px 0 #BDB39C}
.lvl.locked b,.lvl.locked .lk{color:#8E8A7E}
.lvl .lk2{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.2)}.lvl .lk2 svg{width:20px;height:20px}
.soon{display:inline-block;margin-top:2px;font-size:12.5px;background:#fff;border-radius:8px;padding:2px 8px;color:#587089;font-weight:800}

/* story */
#s-story{justify-content:flex-end}
.cast{position:absolute;left:0;right:0;bottom:max(112px,16vh);display:flex;align-items:flex-end;justify-content:center;gap:clamp(8px,4vw,60px);pointer-events:none;top:6%}
.cast .ch{height:100%;max-height:min(70vh,520px);aspect-ratio:240/340;transition:transform .25s,filter .25s}
.cast .ch.hiro{aspect-ratio:240/270;height:80%}
.cast .ch.dim{filter:brightness(.9) saturate(.9);transform:scale(.94)}
.cast .ch.talk{transform:scale(1.04)}
.storybar{display:flex;align-items:center;gap:12px;padding:10px 0 max(14px,env(safe-area-inset-bottom,0px))}
.storybar .say{font-size:clamp(17px,2.6vw,26px)}
.skip{position:absolute;top:max(12px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));z-index:3}

/* play */
#s-play{gap:0}
.main{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding-bottom:4px}
.scene{position:relative;flex:1 1 0;min-height:96px;border-radius:24px;overflow:hidden;box-shadow:0 0 0 4px #fff,0 8px 20px rgba(60,40,20,.28);background:#BFE7F2}
.scene>svg,.scene .lay>svg{position:absolute;inset:0;width:100%;height:100%}
.scene .lay{position:absolute;inset:0}
.qprompt{flex:none;text-align:center;font-family:var(--display);font-weight:800;font-size:clamp(22px,3.8vw,38px);line-height:1.05;color:var(--ink);text-shadow:0 2px 0 rgba(255,255,255,.7)}
.qprompt small{display:block;font-family:var(--body);font-weight:800;font-size:clamp(13px,1.9vw,17px);color:#4F6585;margin-top:3px;text-shadow:none}
.blank{display:inline-block;min-width:3.4em;border-bottom:4px solid var(--verm);text-align:center}
.opts{flex:none;display:flex;gap:clamp(8px,1.6vw,16px);justify-content:center;align-items:stretch;flex-wrap:wrap}
.opt{position:relative;flex:1 1 0;min-width:0;max-width:260px;border:0;border-radius:22px;background:linear-gradient(#FFFFFF,#FBEBC8);box-shadow:0 5px 0 #D9BF93,0 10px 16px rgba(90,60,20,.2);cursor:pointer;padding:10px 8px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:transform .1s;touch-action:manipulation}
.opt:hover:not([disabled]){transform:translateY(-3px)}
.opt:active:not([disabled]){transform:translateY(3px);box-shadow:0 1px 0 #D9BF93}
.opt .w{font-family:var(--display);font-weight:800;font-size:clamp(20px,3.4vw,32px);line-height:1}
.opt .ico{width:clamp(44px,8vw,76px);aspect-ratio:1}.opt .ico svg{width:100%;height:100%}
.opt .thumb{width:100%;aspect-ratio:5/3;border-radius:14px;overflow:hidden;position:relative}.opt .thumb>svg{position:absolute;inset:0;width:100%;height:100%}
.opt.item .ico{width:clamp(64px,13vw,132px)}
.opt .tag{font-family:var(--display);font-weight:800;font-size:clamp(16px,2.4vw,24px);line-height:1;min-height:1em;color:var(--verm);animation:pop .3s}
.opt.right{background:linear-gradient(#C8F2CF,#98DDA6);box-shadow:0 5px 0 #5DB06E;animation:pop .4s}
.opt.wrong{background:linear-gradient(#FFE0DA,#FBC1B8);box-shadow:0 5px 0 #D98E83;opacity:.82}
.opt[disabled]{cursor:default}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.nextrow{flex:none;display:flex;justify-content:center}
.listen{position:relative;flex:1 1 0;min-height:96px;display:flex;align-items:center;justify-content:center;border-radius:24px;background:radial-gradient(circle at 50% 40%,#FFFFFF,#FBEBC8);box-shadow:0 0 0 4px #fff,0 8px 20px rgba(60,40,20,.2)}
.bigsound{width:clamp(96px,22vh,150px);aspect-ratio:1;border-radius:50%;border:0;background:linear-gradient(#FFD45C,#F5B327);box-shadow:0 8px 0 #C58A12,0 14px 24px rgba(120,80,10,.3);display:grid;place-items:center;cursor:pointer;color:var(--ink);animation:throb 1.6s ease-in-out infinite;padding:0}
.bigsound svg{width:52%;height:52%}.bigsound:active{transform:translateY(6px);box-shadow:0 2px 0 #C58A12}
.badge{position:absolute;right:14px;top:12px;background:rgba(255,255,255,.94);border-radius:14px;padding:5px 14px;font-family:var(--display);font-weight:800;font-size:clamp(20px,3.4vw,32px);box-shadow:0 3px 10px rgba(60,30,20,.25);animation:pop .35s}

/* sort / match */
.bins{flex:1 1 0;min-height:0;display:flex;gap:clamp(8px,2vw,18px);justify-content:center;align-items:stretch}
.bin{flex:1 1 0;max-width:340px;border-radius:24px;background:rgba(255,255,255,.78);box-shadow:inset 0 0 0 4px rgba(255,255,255,.9),0 8px 18px rgba(60,40,20,.22);display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px;position:relative;overflow:hidden;transition:background .15s}
.bin .binthumb{width:100%;flex:1 1 0;min-height:56px;border-radius:16px;overflow:hidden;position:relative}.bin .binthumb>svg{position:absolute;inset:0;width:100%;height:100%}
.bin .bw{font-family:var(--display);font-weight:800;font-size:clamp(20px,3.2vw,30px);line-height:1}
.bin.hot,.slot.hot{background:#FFF2BE}
.bin .got{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;min-height:40px}
.bin .got .piece{width:clamp(36px,6vw,54px);aspect-ratio:1}
.tray{flex:none;display:flex;gap:clamp(8px,1.6vw,16px);justify-content:center;flex-wrap:wrap;min-height:70px;padding:4px}
.piece{width:clamp(62px,11vw,96px);aspect-ratio:1;border:0;border-radius:20px;background:linear-gradient(#FFFFFF,#FBEBC8);box-shadow:0 5px 0 #D9BF93,0 8px 14px rgba(90,60,20,.2);cursor:grab;display:grid;place-items:center;padding:6px;touch-action:none;user-select:none}
.piece svg{width:100%;height:100%;pointer-events:none}
.piece.sel{outline:4px solid var(--verm);outline-offset:2px;transform:translateY(-4px)}
.piece.lifted{opacity:.3}
.piece.ghost{position:fixed;z-index:500;pointer-events:none;margin:0;transform:rotate(-5deg) scale(1.08);box-shadow:0 14px 24px rgba(0,0,0,.35)}
.piece.wordp{width:auto;aspect-ratio:auto;min-width:clamp(90px,16vw,150px);height:clamp(52px,8vh,66px);font-family:var(--display);font-weight:800;font-size:clamp(20px,3.2vw,30px);padding:0 16px}
.slot{width:100%;min-height:46px;border-radius:14px;border:3px dashed #C9AE82;background:rgba(255,255,255,.7);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:clamp(18px,3vw,28px);color:var(--ink);transition:background .15s}
.slot.ok{border-style:solid;border-color:#5DB06E;background:#C8F2CF;animation:pop .35s}

/* judge */
.say2{flex:none;display:flex;align-items:center;gap:12px;justify-content:center}

/* shop */
.shopst{position:relative;flex:1 1 0;min-height:140px;border-radius:24px;overflow:hidden;box-shadow:0 0 0 4px #fff,0 8px 20px rgba(60,40,20,.28);background:#E8C9A0;container-type:size}
.shopst>.lay{position:absolute;inset:0}.shopst>.lay>svg{width:100%;height:100%}
.shopst .ch{position:absolute}
.shopst .hiro{left:33%;bottom:21%;height:62%;aspect-ratio:240/270;z-index:1}
.shopst .cust{right:3%;bottom:-8%;height:66%;aspect-ratio:240/270;z-index:3;transition:transform .5s cubic-bezier(.3,1.3,.5,1)}
.shopst .cust.enter{animation:enter .6s cubic-bezier(.3,1.3,.5,1) both}
@keyframes enter{from{transform:translateX(60%);opacity:0}to{transform:none;opacity:1}}
.shopst .kidE{left:2%;bottom:-3%;height:58%;aspect-ratio:240/340;z-index:3}
.shopst .kidM{left:16%;bottom:-3%;height:58%;aspect-ratio:240/340;z-index:3}
.shopst .front{z-index:2}
.cbub{position:absolute;z-index:5;right:4%;top:5%;max-width:min(56%,380px);background:#fff;border-radius:20px;padding:9px 14px 11px;font-family:var(--display);font-weight:800;font-size:clamp(17px,2.9vw,30px);line-height:1.1;box-shadow:0 6px 16px rgba(60,30,20,.3);display:flex;gap:10px;align-items:center}

/* scene animations */

.ch.celebrate.c2{animation-delay:.22s}.ch.celebrate.c3{animation-delay:.44s}
@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}10%{transform:translateY(0) scale(1.05,.95)}42%{transform:translateY(-36px) scale(.97,1.04)}74%{transform:translateY(0) scale(1.05,.95)}88%{transform:translateY(-7px) scale(1,1)}}
.mapfig.celebrate{animation:hopm .9s ease-out 4}
@keyframes hopm{0%,100%{transform:translate(-50%,-100%)}42%{transform:translate(-50%,calc(-100% - 22px))}}
.rhero{align-items:flex-end}

.rcross{width:clamp(100px,24vh,170px);aspect-ratio:1;border-radius:50%;background:radial-gradient(rgba(12,44,92,.62),rgba(12,44,92,0) 72%);padding:6px}

/* walk Emma: one short instruction on top, big buttons at the bottom */
.walkq{font-size:clamp(20px,3.2vw,32px)}

.howto b{display:inline-grid;place-items:center;width:1.45em;height:1.45em;border-radius:50%;background:var(--gold);color:#7A4B10;font-family:var(--display);margin:0 2px}
.pad{flex:none;display:flex;gap:clamp(8px,1.6vw,14px);justify-content:center;align-items:stretch;flex-wrap:wrap}
.padb{appearance:none;border:0;border-radius:18px;min-height:52px;padding:6px clamp(12px,2vw,22px);display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(#fff,#FBEBC8);box-shadow:0 5px 0 #D9BF93,0 8px 14px rgba(90,60,20,.18);font-family:var(--display);font-weight:800;font-size:clamp(15px,2vw,21px);line-height:1.05;color:var(--ink);cursor:pointer;touch-action:manipulation;transition:transform .1s}

.padb.fwd{background:linear-gradient(#7BCF9A,#3E9A64);color:#fff;box-shadow:0 5px 0 #2B7449,0 8px 14px rgba(30,90,50,.22);padding-inline:clamp(16px,3vw,30px)}
.padb.reset{background:linear-gradient(#FFFDF6,#F7EAD0);font-size:clamp(13px,1.6vw,17px);padding-inline:12px}
.padb.reset svg{width:22px;height:22px;color:var(--ink)}
.padb:active:not([disabled]){transform:translateY(4px);box-shadow:0 1px 0 #D9BF93}
.padb[disabled]{opacity:.55;cursor:default}
@media (max-height:600px){.howto{font-size:13px;padding:3px 12px}.padb{min-height:44px}}
/* the door of the destination: a gold ring on the street, and the door lights up when Emma arrives */
.doorring{animation:ringp 1.2s ease-in-out infinite}@keyframes ringp{50%{opacity:.35}}
.doorglow{opacity:0;transition:opacity .3s}
.doorglow.on{opacity:.85;animation:dglow .9s ease-in-out infinite alternate}@keyframes dglow{to{opacity:.35}}
/* ===== Phase 2: Bondi Beach cafe ===== */
.task{overflow-y:auto;overflow-x:hidden}
.custbox{flex:none;display:flex;align-items:center;gap:12px;max-width:820px;width:100%;margin:0 auto}
.cf.big{width:clamp(52px,9vh,74px);height:clamp(52px,9vh,74px)}

.obub::before{content:"";position:absolute;left:-8px;top:50%;width:16px;height:16px;background:#fff;transform:translateY(-50%) rotate(45deg);border-radius:3px}
.obub small{display:block;font-family:var(--body);font-size:.55em;color:#B0603E;letter-spacing:.08em;margin-bottom:1px}

@keyframes patience{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.trayrow{flex:none;display:flex;align-items:center;gap:8px;max-width:820px;width:100%;margin:0 auto;background:rgba(255,255,255,.7);border-radius:16px;padding:4px 10px;min-height:52px}
.tlab{font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.14em;color:#B0603E}
.tray2{display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-height:42px}
.thint{font-weight:800;font-size:14px;color:#8AA0B8}
.tchip{display:inline-flex;align-items:center;gap:4px;background:#fff;border-radius:12px;padding:2px 8px 2px 3px;font-weight:800;font-size:clamp(12px,1.6vw,16px);box-shadow:0 2px 6px rgba(60,40,20,.18)}
.tchip svg{width:clamp(30px,4.6vw,42px);height:clamp(30px,4.6vw,42px)}
.tchip.q{padding:2px 14px;background:#E9DFC9;color:#8A7A5A;font-size:26px}
.ticket{flex:1;min-width:0;background:#FFFBEA;border:2px dashed #C9AE82;border-radius:14px;padding:6px 8px}
.tl{display:flex;flex-wrap:wrap;gap:6px}
.cdbar{flex:none;height:10px;max-width:820px;width:100%;margin:0 auto;border-radius:99px;background:rgba(31,58,92,.16);overflow:hidden}
.cdbar i{display:block;height:100%;background:linear-gradient(90deg,#F6B52C,#EE5A2C);transform-origin:left;animation:patience linear forwards}
.shelf2{flex:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;max-width:820px;width:100%;margin:0 auto}
.fitem{position:relative;appearance:none;border:0;border-radius:16px;background:linear-gradient(#fff,#FBEBC8);box-shadow:0 4px 0 #D9BF93,0 6px 10px rgba(90,60,20,.14);display:flex;flex-direction:column;align-items:center;gap:0;padding:4px 4px 6px;cursor:pointer;color:var(--ink);font-weight:800;font-size:clamp(11px,1.5vw,15px);line-height:1.05;touch-action:manipulation;transition:transform .1s}
.fitem svg{width:clamp(34px,6.2vh,58px);height:clamp(34px,6.2vh,58px)}

.fitem.sel{background:linear-gradient(#C8F2CF,#98DDA6);box-shadow:0 4px 0 #5DB06E;transform:translateY(-2px)}
.shelf2.tk .fitem.sel{background:linear-gradient(#FFE0DA,#FBC1B8);box-shadow:0 4px 0 #D98E83}
.fitem.gone{opacity:.25;transform:scale(.9)}
.arena{position:relative;flex:1 1 0;min-height:150px;overflow:hidden;border-radius:22px;background:linear-gradient(#BFE7F2,#FFF1C9);box-shadow:0 0 0 4px #fff,0 8px 20px rgba(60,40,20,.25);touch-action:none;cursor:ew-resize}
.fall{position:absolute;left:0;top:0;pointer-events:none;will-change:transform}.fall svg{width:100%;height:100%}

.basket svg{width:100%;height:auto;display:block}
.basket.good{filter:drop-shadow(0 0 10px #6CC48C) brightness(1.1)}.basket.bad{filter:drop-shadow(0 0 10px #EE5A2C) saturate(1.3)}
.abar{position:absolute;right:10px;top:8px;background:rgba(255,255,255,.92);border-radius:99px;padding:3px 14px;font-family:var(--display);font-weight:800;font-size:clamp(18px,3vw,28px);box-shadow:0 3px 8px rgba(60,40,20,.2);z-index:2}
.wctl .row,.row .wide{min-width:0}
input.wide{flex:1 1 200px;font-family:var(--display);font-weight:800;font-size:clamp(17px,2.4vw,24px);height:52px;border:0;border-radius:16px;padding:0 14px;background:#fff;color:var(--ink);box-shadow:inset 0 3px 6px rgba(0,0,0,.15)}
input.wide:focus{outline:4px solid var(--gold)}
.chips.cc{justify-content:center}
.pat i,.cdbar i{animation-name:patience}
@media (max-width:700px){.shelf2{grid-template-columns:repeat(4,minmax(0,1fr))}}
.shelf2:has(.fitem:nth-child(10)){grid-template-columns:repeat(5,minmax(0,1fr))}

/* big timer, bingo card, belt */
.bigtimer{position:relative;flex:none;width:clamp(64px,11vh,92px);aspect-ratio:1}
.bigtimer svg{width:100%;height:100%;transform:rotate(-90deg)}
.tbg{fill:#fff;stroke:rgba(31,58,92,.18);stroke-width:5}
.tfg{fill:none;stroke:#3FA58C;stroke-width:5;stroke-linecap:round;stroke-dasharray:119.4;stroke-dashoffset:0;transition:stroke-dashoffset .2s linear,stroke .3s}
.bigtimer b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:clamp(26px,5vh,40px);color:var(--ink)}
.bigtimer.low .tfg{stroke:#EE5A2C}.bigtimer.low b{color:#EE5A2C;animation:throb .6s ease-in-out infinite}
.card3{flex:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:420px;width:100%;margin:0 auto}
.card3 .fitem{position:relative;min-height:clamp(56px,10vh,84px)}
.card3 .fitem svg{width:clamp(40px,8vh,64px);height:clamp(40px,8vh,64px)}
.stamp{display:none;position:absolute;inset:0;place-items:center;font-style:normal;font-size:clamp(34px,7vh,56px);color:#2E9E5B;background:rgba(200,242,207,.82);border-radius:16px;font-weight:800}
.fitem.done .stamp{display:grid}.fitem.bad{animation:shake .4s;background:linear-gradient(#FFE0DA,#FBC1B8)}
.belt{position:relative;flex:1 1 0;min-height:90px;max-height:150px;overflow:hidden;border-radius:18px;background:repeating-linear-gradient(90deg,#8A8DA6 0 18px,#7B7E98 18px 20px);box-shadow:inset 0 0 0 5px #5B5E78,0 6px 14px rgba(60,40,20,.25)}
.bitem{appearance:none;border:0;position:absolute;left:0;top:50%;margin-top:-34px;background:#fff;border-radius:50%;padding:6px;box-shadow:0 4px 8px rgba(0,0,0,.3);cursor:pointer;touch-action:manipulation;will-change:transform}
.bitem svg{width:100%;height:100%;pointer-events:none}
.bitem.took{opacity:.2;pointer-events:none}
.oslots.mid{margin:0 auto}
/* ===== Phase 3: Wildlife Park ===== */
.belt.sav{background:linear-gradient(#CFEFFF 0 55%,#9FD96A 55%);box-shadow:0 0 0 4px #fff,0 8px 20px rgba(60,40,20,.25);max-height:none;min-height:150px;flex:1 1 0;cursor:crosshair}
.wk{position:absolute;left:0;bottom:6px;will-change:transform;pointer-events:none}.wk svg{width:100%;height:100%}
.wk.flash{animation:hop .7s ease}
.aslot{position:relative;width:clamp(66px,12vh,104px);height:clamp(66px,12vh,104px);min-width:0;padding:0}
.aslot::before{content:attr(data-n);position:absolute;left:-6px;top:-10px;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#FFE9A8;display:grid;place-items:center;font:800 14px/1 var(--display);z-index:2}
.atile{width:clamp(66px,12vh,104px);height:clamp(66px,12vh,104px);aspect-ratio:auto;padding:2px}
.oslot .atile{width:100%;height:100%}
.tchip.big{padding:2px 6px}.tchip.big svg{width:clamp(56px,10vh,84px);height:clamp(56px,10vh,84px)}
.tl.pics{flex:none;gap:10px}
.obub.word{flex:none;font-size:clamp(20px,3.2vw,32px);color:var(--verm)}
.cluebox.riddle{max-width:700px;width:100%;margin:0 auto}
.cluebox.riddle .clue{align-items:center;font-size:clamp(17px,2.3vw,24px);padding:6px 12px}
.clue span{flex:1;min-width:0}
.clue .cpic{flex:none;width:clamp(40px,6.6vh,54px);height:clamp(40px,6.6vh,54px);font-style:normal}.clue .cpic svg{width:100%;height:100%;display:block}
.clue.fail{background:#FFE0DA;box-shadow:0 0 0 3px #EE5A2C,0 3px 10px rgba(60,40,20,.15);animation:shake .4s}
.fitem:disabled{cursor:default}
/* photo safari: a soft landscape behind the animals */
.belt.sav{background:#BFE7F2}
.savbg{position:absolute;inset:0;pointer-events:none}.savbg svg{width:100%;height:100%;display:block}
.wk{z-index:1}
/* the people stand on the ground line of the scene: --gb = scene units between that line and the bottom of the picture,
   --sc = pixels per scene unit (set by the script). The feet are at 96% of the drawing, so it is moved down a little. */
.cast{bottom:max(112px,calc(var(--sc,1.4)*var(--gb,0)*1px))}
.cast .ch svg{transform:translateY(3.8%)}
@media (max-width:560px){.cast{bottom:max(calc(var(--sc,1.4)*var(--gb,0)*1px),188px)}}   /* phones: the story bar is taller, keep the feet above it */
.shelf2.five{grid-template-columns:repeat(5,minmax(0,1fr))}
.shelf2.five .fitem svg{width:clamp(44px,9vh,76px);height:clamp(44px,9vh,76px)}
.fitem.done{background:linear-gradient(#C8F2CF,#98DDA6)}
.track{flex:1 1 0;min-height:150px;display:flex;flex-direction:column;gap:8px;justify-content:center}
/* race lanes: sandy tracks with round ends (the runner sits at 5% from the top: a percentage margin would be measured on the width) */
.lane{position:relative;flex:1 1 0;min-height:56px;max-height:110px;border-radius:99px;background:radial-gradient(ellipse at 18% 55%,rgba(255,255,255,.4),transparent 55%),linear-gradient(#F3D8A4,#DDB574);box-shadow:inset 0 0 0 3px #fff,0 3px 8px rgba(120,80,30,.18);overflow:hidden}
.lane.win{box-shadow:inset 0 0 0 4px #F5B327,0 3px 8px rgba(120,80,30,.18);background:radial-gradient(ellipse at 18% 55%,rgba(255,255,255,.55),transparent 55%),linear-gradient(#FFEDB5,#F3CF7A)}
.runner{appearance:none;border:0;background:none;position:absolute;left:10px;top:5%;height:90%;aspect-ratio:1;margin:0;padding:0;cursor:pointer;will-change:transform}
.runner svg{width:100%;height:100%;pointer-events:none}
.fin{position:absolute;right:0;top:0;bottom:0;width:16px;border-radius:0 99px 99px 0;background:repeating-linear-gradient(#111 0 8px,#fff 8px 16px)}
/* shorter windows: sentence tasks (7 words on two rows) must still show the Check button without scrolling */
@media (max-height:700px){.nextrow{min-height:50px}.task{gap:8px}.oslots{padding:9px;gap:8px}.oslots>.oslot:not(.aslot){height:46px}.obank{gap:9px;padding:3px;min-height:0}.orow .btn{min-height:46px}}
/* ===== Phase 4: The Outback ===== */
.shelf2.cl .fitem svg{width:clamp(46px,10vh,84px);height:clamp(46px,10vh,84px)}
.shelf2.cl .fitem span{font-family:var(--display);font-weight:800;font-size:clamp(11px,1.6vw,15px);letter-spacing:.04em}

.oddbox{position:relative;flex:1 1 0;min-height:170px;border-radius:22px;overflow:hidden;box-shadow:0 0 0 4px #fff,0 8px 20px rgba(60,40,20,.25);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;padding:10px}

.oddtag{position:relative;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.92);border-radius:99px;padding:3px 16px 3px 8px;font-family:var(--display);font-weight:800;font-size:clamp(16px,2.6vw,24px);box-shadow:0 3px 8px rgba(60,40,20,.2)}
.oddtag svg{width:34px;height:34px}
.stile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:2px}.stile svg{width:62%;height:62%}.stile b{font:800 clamp(10px,1.4vw,13px)/1 var(--display);letter-spacing:.04em}
/* ===== Phase 5: Great Barrier Reef ===== */
.ivbox{display:flex;flex-direction:column;gap:10px;max-width:820px;width:100%;margin:0 auto}
.ivrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.ivrow .obub{flex:1 1 170px}.ivrow input.wide{flex:2 1 220px}
.fitbox>.wsgrid{position:absolute;inset:0}

.wsc{appearance:none;border:0;border-radius:30%;background:rgba(255,255,255,.9);font:800 clamp(14px,3.6cqmin,26px)/1 var(--display);color:var(--ink);cursor:pointer;padding:0;touch-action:manipulation;container-type:normal}
.wsc.sel{background:#FFD45C;box-shadow:0 0 0 3px #F5B327}.wsc.fnd{background:linear-gradient(#C8F2CF,#98DDA6);color:#1E6B3A}.wsc.hintc{animation:ringp 1s ease-in-out infinite;background:#FFE9A8}
.wsfoods{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.wsf{position:relative;appearance:none;border:0;border-radius:16px;background:linear-gradient(#fff,#FBEBC8);box-shadow:0 4px 0 #D9BF93;padding:4px;cursor:pointer}.wsf svg{width:clamp(48px,8vh,70px);height:clamp(48px,8vh,70px)}
.wsf i{display:none;position:absolute;inset:0;place-items:center;font-style:normal;font-size:34px;color:#2E9E5B;background:rgba(200,242,207,.85);border-radius:16px}.wsf.got i{display:grid}
.hintl{text-align:center;font-weight:800;font-size:clamp(13px,1.8vw,17px);color:#2B4A6E;background:rgba(255,255,255,.8);border-radius:14px;padding:6px 10px}
.fbox{flex:1 1 0;min-height:0;display:flex;flex-direction:column;gap:8px;justify-content:center;max-width:780px;width:100%;margin:0 auto;overflow:auto}
.frow{appearance:none;border:0;border-radius:18px;padding:6px 14px 6px 8px;display:flex;align-items:center;gap:12px;cursor:pointer;background:linear-gradient(#fff,#FBEBC8);box-shadow:0 4px 0 #D9BF93;font-family:var(--body);font-weight:800;font-size:clamp(15px,2.2vw,22px);color:var(--ink);text-align:left;touch-action:manipulation}
.fps{display:flex;gap:4px;flex:none}.fps i{display:block;width:clamp(40px,7vh,60px);height:clamp(40px,7vh,60px)}.fps svg{width:100%;height:100%}
.frow.right{background:linear-gradient(#C8F2CF,#98DDA6);box-shadow:0 4px 0 #5DB06E}.frow.wrong{background:linear-gradient(#FFE0DA,#FBC1B8);box-shadow:0 4px 0 #D98E83;opacity:.85}
.simstage{flex:1 1 0;min-height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:24px;background:radial-gradient(circle at 50% 40%,#fff,#BDEAF5);box-shadow:0 0 0 4px #fff,0 8px 20px rgba(60,40,20,.2)}
.simimg svg{width:clamp(80px,18vh,150px);height:clamp(80px,18vh,150px);animation:pop .35s}.simstage b{font:800 clamp(20px,3.4vw,32px)/1 var(--display)}.simq{font:800 clamp(50px,10vh,90px)/1 var(--display);color:#6FA8C8}
.simdots{flex:none;display:flex;gap:8px;justify-content:center}.simdots i{width:14px;height:14px;border-radius:50%;background:rgba(31,58,92,.2)}.simdots i.on{background:#3FA58C}
/* Passport (same book as City / Food / Safari adventures) */
#s-passport{align-items:center;justify-content:center;overflow:auto;padding-top:10px;padding-bottom:14px}
#s-passport .bg{background:linear-gradient(#FDE6D6,#F6CFD0)}
.pulse{animation:ppPulse 1.6s ease-in-out infinite}@keyframes ppPulse{50%{transform:scale(1.05)}}
.pp-wrap{margin:auto;width:100%;max-width:940px;text-align:center}
.pp-title{margin:0 0 10px;font-family:var(--display);font-weight:800;font-size:clamp(30px,5vw,48px);color:#F5B327;-webkit-text-stroke:8px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
.pp-book{background:linear-gradient(#f9f1dc,#efe2bd);border:5px solid var(--ink);border-radius:30px;box-shadow:0 10px 0 rgba(45,49,86,.4);padding:clamp(14px,2.6vw,24px);position:relative}
.pp-book.shake{animation:bookShake .45s ease}
.pp-head{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:14px;font-family:var(--display);font-weight:800;font-size:clamp(17px,2.8vw,26px);letter-spacing:.06em;color:#2B3F9A}
.pp-head .face{width:66px;height:66px;border-radius:50%;border:3px solid var(--ink);background:#ffe27a;overflow:hidden;flex:none}.pp-head .face svg{width:100%;height:100%;display:block}
.pp-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(6px,2vw,20px)}.pp-name{overflow-wrap:anywhere;text-align:center}
.pp-slot{display:flex;flex-direction:column;align-items:center;gap:6px}
.pp-circle{position:relative;width:100%;max-width:160px;aspect-ratio:1;border-radius:50%;border:4px dashed #b9a98a;background:rgba(255,255,255,.55);display:grid;place-items:center}
.pp-circle .q{font-family:var(--display);font-weight:800;font-size:clamp(40px,7vw,62px);color:#b9a98a;animation:ppFloat 3s ease-in-out infinite}
.pp-slot.done .pp-circle{border-style:solid;border-color:#2B3F9A;background:rgba(255,255,255,.85)}.pp-slot.done .q{display:none}
.pp-stamp{position:absolute;inset:-6%;opacity:0;pointer-events:none}.pp-stamp svg{width:100%;height:100%;overflow:visible}
.pp-slot.pre .pp-stamp{opacity:1;transform:rotate(-8deg)}
.pp-slot.stamped .pp-stamp{animation:stampDrop .95s cubic-bezier(.3,.1,.5,1) both}
.pp-ring{position:absolute;inset:0;border-radius:50%;border:6px solid #C8283C;opacity:0;pointer-events:none}
.pp-slot.stamped .pp-ring{animation:inkRing .95s ease-out both}
.pp-name{font-family:var(--display);font-weight:800;font-size:clamp(15px,2.4vw,21px);min-height:1.4em}.pp-name.new{animation:pop .5s}
.pp-num{font-weight:800;font-size:12px;color:#6B6E92;letter-spacing:.08em;text-transform:uppercase}
.pp-msg{margin:14px 0 10px;font-family:var(--display);font-weight:800;font-size:clamp(18px,2.6vw,26px);text-shadow:0 0 8px #fff,0 0 8px #fff}
@keyframes ppFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes stampDrop{0%{opacity:0;transform:translateY(-170px) scale(2.6) rotate(-28deg)}52%{opacity:1;transform:translateY(0) scale(1) rotate(-8deg)}60%{opacity:1;transform:scale(.86) rotate(-8deg)}76%{transform:scale(1.07) rotate(-8deg)}100%{opacity:1;transform:scale(1) rotate(-8deg)}}
@keyframes inkRing{0%,52%{opacity:0;transform:scale(.7)}58%{opacity:.65}100%{opacity:0;transform:scale(1.5)}}
@keyframes bookShake{0%,100%{transform:none}30%{transform:translateY(6px)}60%{transform:translateY(-2px)}}

/* ===== phones and tablets: comfortable touch targets, word search never shrinks, inputs never squash ===== */
.wctl>*{flex:none;max-width:100%}
.wctl>.chips,.wctl>input{flex:1 1 100%;min-width:0}
.wctl input,input.wide{min-height:46px}
.spk{width:40px;height:40px}
.fit:has(.wsgrid){min-height:calc(var(--n,7)*38px + 18px)}
@media (max-height:600px){
  .say .rep,.cbub .rep{width:44px;height:44px}
  .fit:has(.wsgrid){min-height:calc(var(--n,7)*34px + 18px)}
}
@media (hover:none) and (pointer:coarse){
  .chip{min-height:44px}
  .say .rep,.cbub .rep,.spk{min-width:44px;min-height:44px}
}</style>

const LG=(id,s,x1=0,y1=0,x2=0,y2=1)=>DEFS.push(`<linearGradient id="${id}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}">${stops(s)}</linearGradient>`);
const RG=(id,s,cx=.5,cy=.5,r=.5)=>DEFS.push(`<radialGradient id="${id}" cx="${cx}" cy="${cy}" r="${r}">${stops(s)}</radialGradient>`);
const OL="#6B4433";

LG("skE",["#FFEBDC","#FFD3B6"]); LG("skM",["#FFE0C6","#F7C29E"]); LG("skS",["#FBDDBE","#EDBB92"]); LG("skK",["#FFE6D2","#F6C8A6"]); LG("skD",["#F2CBA5","#DDA87C"]);

LG("indigo",["#4F63A6","#2B3A74"]); LG("white",["#FFFFFF","#EFEAF2"]);

/* tapered limb with round ends (organic, not a stroked line) */
function tube(x1,y1,x2,y2,w1,w2,fill,bend=0,sw=1.5){
  const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L,r1=w1/2,r2=w2/2,m=(r1+r2)/2;
  const mx=(x1+x2)/2+nx*bend,my=(y1+y2)/2+ny*bend, f=v=>v.toFixed(1);
  return `<path d="M${f(x1+nx*r1)} ${f(y1+ny*r1)} Q${f(mx+nx*m)} ${f(my+ny*m)} ${f(x2+nx*r2)} ${f(y2+ny*r2)} A${r2} ${r2} 0 0 0 ${f(x2-nx*r2)} ${f(y2-ny*r2)} Q${f(mx-nx*m)} ${f(my-ny*m)} ${f(x1-nx*r1)} ${f(y1-ny*r1)} A${r1} ${r1} 0 0 0 ${f(x1+nx*r1)} ${f(y1+ny*r1)}Z" fill="${fill}" ${ol(sw)}/>`;
}
const HAND="M-7.4 -3 C-9 4 -8 11 -3 14 C1 16.4 6 14.6 8 9.4 C10 4 9 -2 7.4 -4Z", THUMB="M6.6 -1.6 C12 -3 15.4 3.6 10.8 9 C9.2 6.4 7.4 4.4 5.8 3Z";
function arm(x1,y1,x2,y2,w1,w2,sleeve,skin,bend=0,thumb=1,cuff=""){
  const ang=Math.atan2(y2-y1,x2-x1)*180/Math.PI-90;
  return `<g transform="translate(${x2} ${y2}) rotate(${ang.toFixed(1)}) scale(${thumb} 1)"><path d="${THUMB}" fill="${skin}" ${ol(1.3)}/><path d="${HAND}" fill="${skin}" ${ol(1.4)}/><path d="M-3.5 5 Q0 7.4 3.5 5" fill="none" stroke="#E2A27E" stroke-width="1.1" stroke-linecap="round"/></g>`+tube(x1,y1,x2,y2,w1,w2,sleeve,bend)+cuff;
}
function bow(x,y,rot,s=1){
  return `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${s})"><path d="M0 0 C-5 -14 -24 -16 -26 -4 C-27 8 -9 12 0 0Z" fill="url(#lilac)" ${ol(1.3)}/><path d="M0 0 C5 -14 24 -16 26 -4 C27 8 9 12 0 0Z" fill="url(#lilac)" ${ol(1.3)}/><path d="M-6 -3 Q-15 -9 -21 -3 M6 -3 Q15 -9 21 -3" fill="none" stroke="#8E6BCF" stroke-width="1" opacity=".7"/><path d="M-3 4 C-6 12 -10 17 -14 21 L-6 19 L-2 8Z M3 4 C6 12 10 17 14 21 L6 19 L2 8Z" fill="url(#lilac)" ${ol(1)}/><ellipse cx="0" cy="0" rx="5" ry="5.6" fill="#B79BEE" ${ol(1.2)}/></g>`;
}
function shoe(x,y,dir,grad,sole,cap,accent){
  return `<g transform="translate(${x} ${y}) scale(${dir} 1)"><path d="M-17 -8 C-17 -17 -8 -21 0 -20 C9 -19 18 -11 20.5 -2 C22 4 17.5 8.5 10 8.5 L-14 8.5 C-18.5 8.5 -19 2 -17 -8Z" fill="url(#${grad})" ${ol(1.4)}/><path d="M8 -15 C14 -11 19 -5 20.5 -1 C15.5 1.5 11 -2.5 8 -15Z" fill="${cap}" ${ol(1)}/><path d="M-6 -17 L-1 -12 M-1 -19 L4 -14" stroke="${cap}" stroke-width="2.2" stroke-linecap="round"/><path d="M-17 -4 C-14 -2 -10 -2 -8 -3" fill="none" stroke="${accent}" stroke-width="2.4" stroke-linecap="round"/><path d="M-18.5 5.6 C-18.5 11.4 -12 13 -4 13 L12 13 C19.5 13 23 10 22 3.6 C18.5 7.4 14 7.6 8 7.6 L-14 7.6 C-16 7.6 -17.6 6.8 -18.5 5.6Z" fill="${sole}" ${ol(1.3)}/></g>`;
}

/* ---------- face: shared geometry for Emma, Max and the villagers ---------- */
const FACE="M52 106C52 62 82 42 120 42C158 42 188 62 188 106C188 136 164 162 120 164C76 162 52 136 52 106Z";
function eyeOpen(cx,cy,iris,k,lx,ly,lash){
  return `<ellipse cx="${cx}" cy="${cy}" rx="${14.2*k}" ry="${18*k}" fill="#fff" ${ol(1.1)}/><ellipse cx="${cx+lx}" cy="${cy+1.2+ly}" rx="${11.8*k}" ry="${16*k}" fill="url(#${iris})"/><ellipse cx="${cx+lx}" cy="${cy+1.2+ly}" rx="${11.8*k}" ry="${16*k}" fill="none" stroke="rgba(30,15,10,.3)" stroke-width="1.3"/><ellipse cx="${cx+lx}" cy="${cy+2+ly}" rx="${5.8*k}" ry="${8.6*k}" fill="#24150F"/><ellipse cx="${cx+lx+4.6*k}" cy="${cy+ly-5.6*k}" rx="${4.6*k}" ry="${5.2*k}" fill="#fff"/><circle cx="${cx+lx-4.2*k}" cy="${cy+ly+8*k}" r="${2.2*k}" fill="#fff" opacity=".9"/><circle cx="${cx+lx+6*k}" cy="${cy+ly+4*k}" r="${1.2*k}" fill="#fff" opacity=".8"/><path d="M${cx-12.5*k} ${cy-8*k} Q${cx} ${cy-30*k} ${cx+12.5*k} ${cy-8*k}" fill="none" stroke="rgba(150,80,50,.35)" stroke-width="1.5" stroke-linecap="round"/><path d="M${cx-9*k} ${cy+15.5*k} Q${cx} ${cy+19.5*k} ${cx+9*k} ${cy+15.5*k}" fill="none" stroke="rgba(120,60,40,.3)" stroke-width="1.3" stroke-linecap="round"/><path d="M${cx-14.2*k} ${cy-3*k} Q${cx} ${cy-30*k} ${cx+14.2*k} ${cy-3*k}" fill="none" stroke="${lash}" stroke-width="3" stroke-linecap="round"/>`;
}function faceSVG(o){
  const {iris="irisG",expr="happy",brow="#9A4A1E",lash="#3A2218",ey=120,gap=28,mouth="#B6404A",k=1,lashes=true}=o;
  const L=120-gap,R=120+gap;
  const flick=(cx,s)=>!lashes?"":`<path d="M${cx+s*13.2*k} ${ey-4} q${s*4.5} -1.5 ${s*6} -7" fill="none" stroke="${lash}" stroke-width="2.4" stroke-linecap="round"/>`;
  const shut=(cx,s)=>`<path d="M${cx-12.5} ${ey+3} Q${cx} ${ey-14} ${cx+12.5} ${ey+3}" fill="none" stroke="${lash}" stroke-width="3.4" stroke-linecap="round"/>`+flick(cx,s);
  const open=(cx,s,kk=1,lx=0,ly=0)=>eyeOpen(cx,ey,iris,kk*k,lx,ly,lash)+flick(cx,s);
  const bw=(cx,s,dy=0,tilt=0)=>`<path d="M${cx-12} ${ey-27+dy+(s<0?tilt:-tilt)} Q${cx} ${ey-33+dy} ${cx+12} ${ey-27+dy+(s<0?-tilt:tilt)}" fill="none" stroke="${brow}" stroke-width="2.8" stroke-linecap="round"/>`;
  const my=ey+24;

    smile:`<path d="M111 ${my-1} Q120 ${my+14} 129 ${my-1} Q120 ${my+3} 111 ${my-1}Z" fill="${mouth}" ${ol(1.2)}/><path d="M115 ${my+7} Q120 ${my+11} 125 ${my+7} Q120 ${my+5} 115 ${my+7}Z" fill="#F7909E"/>`,
    big:`<path d="M103 ${my-5} Q120 ${my+30} 137 ${my-5} Q120 ${my+1} 103 ${my-5}Z" fill="${mouth}" ${ol(1.3)}/><path d="M106 ${my-3} Q120 ${my+2} 134 ${my-3} L132 ${my+3} Q120 ${my+6} 108 ${my+3}Z" fill="#fff"/><path d="M111 ${my+15} Q120 ${my+22} 129 ${my+15} Q120 ${my+10} 111 ${my+15}Z" fill="#F7909E"/>`,
    o:`<ellipse cx="120" cy="${my+4}" rx="6.5" ry="8.5" fill="${mouth}" ${ol(1.2)}/><ellipse cx="120" cy="${my+8}" rx="3.4" ry="3" fill="#F7909E"/>`,
    wavy:`<path d="M108 ${my+5} Q114 ${my-3} 120 ${my+3} Q126 ${my+9} 132 ${my+1}" fill="none" stroke="${mouth}" stroke-width="2.8" stroke-linecap="round"/>`,
    flat:`<path d="M110 ${my+3} Q120 ${my-1} 131 ${my+4}" fill="none" stroke="${mouth}" stroke-width="2.8" stroke-linecap="round"/>`,
    tiny:`<path d="M111 ${my} Q120 ${my+9} 129 ${my}" fill="none" stroke="${mouth}" stroke-width="2.8" stroke-linecap="round"/>`
  };
  let eyes,mo,br;
  switch(expr){
    case "cheer": eyes=shut(L,-1)+shut(R,1); mo=M.big; br=bw(L,-1,-3)+bw(R,1,-3); break;
    case "wow": eyes=open(L,-1,1.1)+open(R,1,1.1); mo=M.o; br=bw(L,-1,-5)+bw(R,1,-5); break;
    case "oops": eyes=open(L,-1,1,-1.6,2)+open(R,1,1,-1.6,2); mo=M.wavy; br=bw(L,-1,0,5)+bw(R,1,0,5); break;
    case "think": eyes=open(L,-1,1,2.6,-2)+open(R,1,1,2.6,-2); mo=M.flat; br=bw(L,-1,0)+bw(R,1,-6,-1); break;
    case "wink": eyes=shut(L,-1)+open(R,1); mo=M.smile; br=bw(L,-1,-2)+bw(R,1,0); break;
    case "soft": eyes=open(L,-1)+open(R,1); mo=M.tiny; br=bw(L,-1,0)+bw(R,1,0); break;
    default: eyes=open(L,-1)+open(R,1); mo=M.smile; br=bw(L,-1,0)+bw(R,1,0);
  }
  return `<g>${eyes}${br}<path d="M117.4 ${ey+14} q2.6 3.2 5.2 0" fill="none" stroke="#DE9A78" stroke-width="1.8" stroke-linecap="round"/><g class="mouth">${mo}</g></g>`;
}
RG("faceShade",["rgba(255,255,255,0)@58","rgba(190,100,70,.22)@100"],.5,.45,.62);

/* ---------- EMMA ---------- */
const PT_L=`<path d="M66 62C44 60 26 80 24 110C22 134 26 156 38 170C42 176 49 180 46 188C60 184 67 174 65 162C61 148 59 134 63 116C65 100 71 84 75 70Z" fill="url(#hairE)" ${ol()}/><path d="M38 98C32 118 34 146 43 166M50 112C48 130 50 150 55 168" fill="none" stroke="#F6B778" stroke-width="2" stroke-linecap="round" opacity=".75"/><path d="M60 84C56 110 58 136 62 156" fill="none" stroke="#A74B1E" stroke-width="1.4" stroke-linecap="round" opacity=".5"/>`;
function emma(expr="happy",pose="idle"){
  const SK="url(#skE)", W="url(#white)";

  <path d="M84 178C92 164 148 164 156 178L154 222L86 222Z" fill="${W}" ${ol()}/>

  <path d="M98 168C97 182 95 198 90 214C80 234 70 252 62 268C80 277 100 274 120 276C140 274 160 277 178 268C170 252 160 234 150 214C145 198 143 182 142 168L132 168C132 178 132 184 129 188C124 192 116 192 111 188C108 184 108 178 108 168Z" fill="url(#pinkP)" ${ol()}/>
  <path d="M106 222Q100 248 91 272M120 224L120 277M134 222Q140 248 149 272" fill="none" stroke="#E5689B" stroke-width="1.3" opacity=".45"/><path d="M96 232Q86 252 80 270" fill="none" stroke="#FFD2E3" stroke-width="2" stroke-linecap="round" opacity=".7"/>

  ${blushSVG(144)}<g fill="#E4A07C"><circle cx="70" cy="136" r="1.5"/><circle cx="76" cy="139" r="1.5"/><circle cx="82" cy="136" r="1.5"/><circle cx="158" cy="136" r="1.5"/><circle cx="164" cy="139" r="1.5"/><circle cx="170" cy="136" r="1.5"/></g>
  ${faceSVG({iris:"irisG",expr,brow:"#A34E1E"})}

  <path d="M120 26C112 42 100 58 88 72M134 28C136 46 142 60 152 74M100 28C86 40 76 54 70 66M158 40C168 52 176 70 178 86" fill="none" stroke="#A74B1E" stroke-width="1.4" stroke-linecap="round" opacity=".4"/><path d="M64 48C80 32 104 28 126 30" fill="none" stroke="#F8C48A" stroke-width="3" stroke-linecap="round" opacity=".85"/><path d="M96 56C108 44 126 42 140 50" fill="none" stroke="#A74B1E" stroke-width="1.3" stroke-linecap="round" opacity=".4"/>
  ${bow(63,62,-22,1.05)}${bow(177,62,22,1.05)}

}

function star5(cx,cy,R,r,fill){
  let d=""; for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rad=i%2?r:R;d+=(i?"L":"M")+(cx+rad*Math.cos(a)).toFixed(1)+" "+(cy+rad*Math.sin(a)).toFixed(1)}

function max(expr="happy",pose="idle"){

  return `<svg viewBox="0 0 240 340" role="img" aria-label="Max" xmlns="http://www.w3.org/2000/svg">

  <path d="M94 300C98 303 108 303 112 300L111.6 308 94.4 308Z" fill="#fff" opacity="0"/>
  ${shoe(100,314,-1,"blueSh","#fff","#F2F7FF","#F59BB8")}${shoe(140,314,1,"blueSh","#fff","#F2F7FF","#F59BB8")}
  <path d="M80 246C98 252 142 252 160 246L167 292C151 298 139 296 127 292L120 274L113 292C101 296 89 298 73 292Z" fill="url(#khaki)" ${ol()}/>
  <path d="M120 274L120 250M95 262Q101 275 98 288M145 262Q139 275 142 288" fill="none" stroke="#A98A55" stroke-width="1.2" opacity=".6"/><path d="M73 286C89 292 101 290 113 286M127 286C139 290 151 292 167 286" fill="none" stroke="#A98A55" stroke-width="1.2" opacity=".55"/>

const MENU=[{id:"rice",t:"rice",c:"other"},{id:"hamburger",t:"a hamburger",c:"other"},{id:"hotdog",t:"a hot dog",c:"other"},{id:"cheese",t:"cheese",c:"other"},{id:"bread",t:"bread",c:"other"},{id:"fish",t:"fish",c:"other"},{id:"cookies",t:"cookies",c:"other"},{id:"cake",t:"chocolate cake",c:"other"},
  {id:"water",t:"water",c:"drink"},{id:"milk",t:"milk",c:"drink"},{id:"oj",t:"orange juice",c:"drink"},{id:"lemonade",t:"lemonade",c:"drink"},
  {id:"potato",t:"a potato",c:"veg"},{id:"lettuce",t:"lettuce",c:"veg"},{id:"tomato",t:"a tomato",c:"veg"},{id:"apple",t:"an apple",c:"fruit"},{id:"banana",t:"a banana",c:"fruit"},{id:"strawberry",t:"a strawberry",c:"fruit"}];
const MID=MENU.map(m=>m.id), askOf=id=>MENU.find(m=>m.id===id).t, catOf=id=>MENU.find(m=>m.id===id).c;
const CATNAME={drink:"DRINKS",fruit:"FRUIT",veg:"VEGETABLES",sweet:"SWEETS",fast:"FAST FOOD"};
/* the basket game always names a clear group; foods like rice or bread are never the target */
const CATEX={drink:"water, milk, orange juice, lemonade",fruit:"apple, banana, strawberry",veg:"potato, lettuce, tomato",sweet:"cookies, chocolate cake",fast:"hamburger, hot dog"};
const catchCat=id=>{const c=catOf(id);return c!=="other"?c:(id==="cookies"||id==="cake")?"sweet":(id==="hamburger"||id==="hotdog")?"fast":"none"};
const listText=ids=>{const a=ids.map(askOf);return a.length<2?a[0]:a.slice(0,-1).join(", ")+" and "+a[a.length-1]};

    const mv=ev=>{ if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>7){moved=true;ghost=it.cloneNode(true);ghost.classList.add("ghost");ghost.style.width=r.width+"px";ghost.style.height=r.height+"px";document.body.appendChild(ghost);it.classList.add("lifted")}
      if(moved){ghost.style.left=ev.clientX-ox+"px";ghost.style.top=ev.clientY-oy+"px";const t=document.elementFromPoint(ev.clientX,ev.clientY),tg=t&&t.closest(targetSel);if(hot&&hot!==tg)hot.classList.remove("hot");if(tg){tg.classList.add("hot");hot=tg}} };
    const end=ev=>{ window.removeEventListener("pointermove",mv);window.removeEventListener("pointerup",end);window.removeEventListener("pointercancel",end);if(hot)hot.classList.remove("hot");
      if(moved){ghost.remove();it.classList.remove("lifted");if(ev.type==="pointerup"){const t=document.elementFromPoint(ev.clientX,ev.clientY),tg=t&&t.closest(targetSel);if(tg)drop(it,tg)}} else if(ev.type==="pointerup")click(it) };

function mkFindClue(rn){const ids=pickPlaces(rn,8),i=1+Math.floor(rn()*6),a=ids[i-1],b=ids[i+1],text=`the place between the ${PLACEN[a]} and the ${PLACEN[b]}`;

function mkOrder(rn){const [text,extra]=pick(rn,ORD);return {kind:"order",text,extra,coach:"Put the words in order. One word is extra!",hint:"One word does not belong. Look at the red words."}}
function mkMap(rn){const ids=pickPlaces(rn,8);return {top:ids.slice(0,4),bot:ids.slice(4,8)}}
function mkDetect(rn,n){
  for(let a=0;a<500;a++){const M=mkMap(rn),p=pick(rn,ALLPOS),T=trueClues(M,p);if(T.length<n)continue;
    for(let k=0;k<40;k++){const clues=shuf(rn,T).slice(0,n);if(ALLPOS.filter(q=>clues.every(c=>holds(M,q,c))).length!==1)continue;   /* the clues together point to exactly one place */
      return {kind:"detect",M,pos:p,target:posId(M,p),clues,coach:"Read the clues. Which is the secret place?",hint:"The secret place must match every clue."}}}
}
function mkWrite(rn){const M=mkMap(rn),p=pick(rn,ALLPOS);return {kind:"write",M,pos:p,target:posId(M,p),coach:`Write where the ${PLACEN[posId(M,p)]} is.`,hint:"Use: It's next to / opposite / between the ..."}}
function mkCells(rn){const ids=pickPlaces(rn,6);return [ids.slice(0,3),ids.slice(3,6)]}
function mkFollow(rn,nS){
  for(let a=0;a<600;a++){const cmds=[];if(rn()<.3)cmds.push("R");for(let i=0;i<nS;i++){if(i>0)cmds.push(rn()<.5?"L":"R");cmds.push("S")}
    const sim=simulate(cmds);if(sim.bump)continue;const side=rn()<.5?"left":"right",tc=sideCell(sim.last.x,sim.last.y,sim.last.d,side);if(!cellOk(tc))continue;
    const cells=mkCells(rn),steps=cmds.map(c=>c==="S"?["up","Go straight ahead."]:c==="L"?["left","Turn left."]:["right","Turn right."]);steps.push([side,`It's on the ${side}.`]);
    return {kind:"follow",cells,cmds,side,path:sim.path,tcell:tc,target:cells[tc[1]][tc[0]],steps,text:steps.map(s=>s[1]).join(" "),coach:"Follow the directions. Which place is it?",hint:"Walk with your finger from the start. Left and right change when you turn!"}}}
function mkWalk(rn){const cells=mkCells(rn),tc=pick(rn,[[0,0],[1,0],[2,0],[0,1],[1,1],[2,1]]);
  return {kind:"walk",cells,tcell:tc,target:cells[tc[1]][tc[0]],coach:"Take Emma to the door. Press the buttons.",hint:"Press Go straight ahead to walk. Press Turn left or Turn right to turn Emma. Stop at the door of the ? place."}}

BUILD.p1[0]=seed=>{const rn=R(seed),ci=Math.floor(rn()*4);
  return [mkChat(rn,ci),mkFindClue(rn),mkGaps(rn),mkUnscr(rn),mkMistake(rn),mkWalk(rn)]};
BUILD.p1[1]=seed=>{const rn=R(seed);
  return [mkOrder(rn),mkChat(rn,3+Math.floor(rn()*2)),mkDetect(rn,2),mkWalk(rn),mkWrite(rn),mkWalk(rn)]};

/* ---------- helpers shared by the renderers ---------- */
const fitBox=(svg,ar,id="")=>`<div class="fit"><div class="fitbox" ${id?`id="${id}"`:""} style="--ar:${ar}">${svg}</div></div>`;
function sparkle(el){
  const box=$(".fitbox"); if(!box||!el)return; const r=el.getBoundingClientRect(), b=box.getBoundingClientRect();
  for(let i=0;i<7;i++){const s=document.createElement("div");s.className="sparkle";s.style.left=(r.left-b.left+r.width/2+(Math.random()-.5)*r.width)+"px";s.style.top=(r.top-b.top+r.height/2+(Math.random()-.5)*r.height*.8)+"px";s.style.animationDelay=(i*.07)+"s";s.innerHTML=starIcon(true);box.appendChild(s);setTimeout(()=>s.remove(),1900)}
}
const nextBtn=()=>{const last=G.i>=G.tasks.length-1,r=$("#nextrow");if(r)r.innerHTML=`<button class="btn green" data-act="nx" id="nxb">${last?"Finish":"Next"} ${UI_I.next}</button>`};
const icoArrow=k=>svgI("0 0 100 100",AI[k]());
/* tap or drag tiles into slots (.oslot). expected[k] is the text each slot needs. */
function setupTiles(host,expected,o={}){
  const slots=$$(".oslot"), bankEl=$("#obank");
  const refresh=()=>{const c=$("#chk");if(c)c.disabled=G.cur.done||slots.some(s=>!s.firstElementChild)};
  const toSlot=(tile,slot)=>{if(slot.firstElementChild)return;slot.appendChild(tile);tile.classList.remove("bad");refresh()};
  const toBank=tile=>{bankEl.appendChild(tile);tile.classList.remove("bad");refresh()};
  dragify(host,".otile",".oslot",(it,tg)=>{if(!G.cur.done){toSlot(it,tg);UI.tap()}},it=>{
    if(G.cur.done)return; const d=window.LASTDOWN; if(d&&d.closest&&d.closest(".spk"))return; UI.tap();
    if(it.parentElement.classList.contains("oslot"))toBank(it); else{const f=slots.find(s=>!s.firstElementChild);if(f)toSlot(it,f)}});
  G.chk=()=>{if(G.cur.done)return; const got=slots.map(s=>s.firstElementChild?s.firstElementChild.dataset.t:"");
    const okw=(w,k)=>w===expected[k]||(o.alt&&o.alt[k]&&o.alt[k].includes(w));const flags=o.valid?o.valid(got):got.map(okw);
    if(flags.every(Boolean)){slots.forEach(s=>s.firstElementChild.classList.add("ok"));$("#chk").disabled=true;rightAns(typeof o.ok==="function"?o.ok(got):o.ok)}
    else{slots.forEach((s,k)=>{const el=s.firstElementChild;if(el)el.classList.toggle("bad",!flags[k])});wrongAns(o.hint)}};
}
const chkBtn=`<div class="orow"><button class="btn gold" data-act="chk" id="chk" disabled>Check ${UI_I.check}</button></div>`;

/* ---------- 1. build the chat ---------- */
TR.chat=(t,host)=>{
  const rn=R(G.seed+G.i*13+1); let sh=shuf(rn,t.lines.map((_,i)=>i)); if(sh.every((v,k)=>v===k))sh.reverse();
  const tile=i=>{const l=t.lines[i];return `<div class="piece otile ctile" data-t="${esc(l.t)}"><span class="cf">${face(l.who)}</span><span class="ct">${l.t}</span><button class="spk" data-act="say" data-who="${l.who}" data-say="${esc(l.t)}" aria-label="Listen">${UI_I.sound}</button></div>`};
  host.innerHTML=`<div class="qprompt">Build the chat!<small>Put the speech bubbles in order. Tap the speaker to listen.</small></div>
   <div class="chatgrid"><div class="chatslots">${t.lines.map((_,k)=>`<div class="srow"><b>${k+1}</b><div class="oslot cslot"></div></div>`).join("")}</div><div class="obank cbank" id="obank">${sh.map(tile).join("")}</div></div>`+chkBtn;
  setupTiles(host,t.lines.map(l=>l.t),{ok:"Great chat!",hint:t.hint});
  G.rep=()=>speak("kylie","Build the chat! Put the speech bubbles in order.");
  say("kylie",t.coach,"happy");
};

   <div class="convo">${t.lines.map((l,k)=>`<button class="cline ${k%2?"r":"l"}" data-act="cl" data-k="${k}"><span class="cf">${face(l.who)}</span><span class="ct">${l.t}</span></button>`).join("")}</div>

   <div class="wctl"><ol class="steps">${t.steps.map(s=>`<li>${icoArrow(s[0])}<span>${s[1]}</span></li>`).join("")}</ol><button class="btn paper sm" data-act="rep">${UI_I.sound} Listen</button></div></div>`;
