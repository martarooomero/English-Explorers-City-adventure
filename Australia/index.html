/* ---------- 9. write where it is (free writing, checked against the map) ---------- */
const squash=s=>s.replace(/ /g,"");
function normSentence(s){return s.toLowerCase().replace(/[‘’`]/g,"'").replace(/\bit's\b|\bits\b|\bit is\b/g," ").replace(/[^a-z ]/g," ").replace(/\bthe\b/g," ").replace(/\s+/g," ").trim()}
function checkWrite(M,p,text){
  const s=normSentence(text); let m;
  if((m=s.match(/^next to (.+)$/)))return adjIds(M,p).some(a=>squash(PLACEN[a])===squash(m[1]))?"ok":"names";
  if((m=s.match(/^opposite (.+)$/)))return squash(PLACEN[oppId(M,p)])===squash(m[1])?"ok":"names";
  if((m=s.match(/^between (.+) and (.+)$/))){const b=betIds(M,p);if(!b)return "names";const x=squash(m[1]),y=squash(m[2]),a=squash(PLACEN[b[0]]),c=squash(PLACEN[b[1]]);return (x===a&&y===c)||(x===c&&y===a)?"ok":"names"}
  return "shape";
}
TR.write=(t,host)=>{
  host.innerHTML=`<div class="qprompt">Write where the <span class="hl">${PLACEN[t.target]}</span> is.<small>Use the map. Write a sentence.</small></div><div class="splitwrap"><div class="fit"><div class="fitbox" style="--ar:2.0408">${stripMapSVG(t.M,{mark:t.pos})}</div></div>
   <div class="wctl"><div class="chips">${["It's","next to","opposite","between","and","the"].map(w=>`<button class="chip" data-act="chip" data-w="${esc(w)}">${w}</button>`).join("")}</div>
   <input id="wi" type="text" autocomplete="off" autocapitalize="sentences" spellcheck="false" maxlength="70" placeholder="It's ..." aria-label="Write a sentence"><button class="btn green" data-act="tsub">Check ${UI_I.check}</button></div></div>`;
  G.rep=()=>speak("kylie",`Write where the ${PLACEN[t.target]} is.`);
  say("kylie",t.coach,"happy");
  G.chip=w=>{const i=$("#wi");if(!i||G.cur.done)return;i.value=(i.value&&!/\s$/.test(i.value)?i.value+" ":i.value)+w+" ";i.focus()};
  G.sub=()=>{if(G.cur.done)return;const i=$("#wi"),v=i.value.trim();if(!v)return;const r=checkWrite(t.M,t.pos,v);
    if(r==="ok"){i.disabled=true;rightAns(`Yes! ${ucf(v.replace(/\s+/g," "))}${/[.!?]$/.test(v)?"":"."}`)}
    else wrongAns(r==="shape"?"Start with: It's next to / opposite / between the ...":"Look at the map again. Check the names of the places.")};
};

/* ---------- 10. walk Emma to the DOOR: the buttons move her on the map at once ---------- */
/* Emma walks in half blocks: crossings are even positions, the spot in front of a door is the odd position in the middle of a block. */
TR.walk=(t,host)=>{
  const name=PLACEN[t.target], sleep=ms=>new Promise(r=>setTimeout(r,ms)), doorH=[2*t.tcell[0]+1,2*t.tcell[1]];
  host.innerHTML=`<div class="qprompt walkq">Take Emma to the door of the <span class="hl">${name}</span>!</div>
   <div class="howto">Press the buttons. Walk Emma to the door of the <b>?</b> place.</div>${fitBox(gridMapSVG(t.cells,{walker:true,mark:t.tcell}),"1.4783","gmap")}
   <div class="pad"><button class="padb" data-act="gc" data-c="L">${icoArrow("left")}<span>Turn left</span></button><button class="padb fwd" data-act="gc" data-c="S">${icoArrow("up")}<span>Go straight ahead</span></button><button class="padb" data-act="gc" data-c="R">${icoArrow("right")}<span>Turn right</span></button><button class="padb reset" data-act="gclr" aria-label="Start again">${UI_I.replay}<span>Start again</span></button></div>`;
  const hpx=h=>GX[0]+h*90, hpy=h=>GY[0]-h*80;
  let hx=0,hy=0,d=0,ang=0,trail=[[0,0]];
  const moveTo=(a,b,dy=0)=>{const w=$("#walker");if(w)w.style.transform=`translate(${hpx(a)}px,${hpy(b)+dy}px)`};
  const setAng=a=>{ang=a;const w=$("#warrow");if(w)w.style.transform=`rotate(${ang}deg)`};
  const drawTrail=()=>{const g=$("#trail");if(g)g.innerHTML=trail.length>1?`<path d="M${trail.map(n=>hpx(n[0])+" "+hpy(n[1])).join("L")}" fill="none" stroke="#EE5A2C" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 13" opacity=".9"/>`:""};
  const lock=on=>{G.cur.running=on;$$("[data-act=gc],[data-act=gclr]").forEach(b=>b.disabled=on)};
  G.rep=()=>speak("kylie",`Take Emma to the door of the ${name}. Press the buttons. Emma walks to the question mark place.`);
  say("kylie",`Take Emma to the door of the ${name}! Press the buttons. Emma walks.`,"happy");
  G.gc=async c=>{ if(G.cur.running||G.cur.done)return; lock(true); const my=G.rt;
    if(c==="L"){d=(d+3)%4;setAng(ang-90);UI.tap();await sleep(380)}
    else if(c==="R"){d=(d+1)%4;setAng(ang+90);UI.tap();await sleep(380)}
    else{const nx=hx+DX[d],ny=hy+DY[d],onStreet=nx>=0&&nx<=6&&ny>=0&&ny<=4&&(nx%2===0||ny%2===0);
      if(!onStreet){wrongAns("There is no street there! Emma can only walk on the streets.");await sleep(500)}
      else{hx=nx;hy=ny;trail.push([hx,hy]);drawTrail();moveTo(hx,hy);UI.tap();await sleep(560)}}
    if(G.rt!==my||!$("#walker"))return;
    if(hx===doorH[0]&&hy===doorH[1]){   /* Emma is in front of the door: she turns to it, steps up, the door shines */
      setAng(Math.round(ang/360)*360); moveTo(hx,hy,-16); const dg=$("#doorglow"); if(dg)dg.classList.add("on");
      const b=$(`#gmap .hs[data-p="${t.target}"]`); if(b){b.classList.add("good");sparkle(b)}
      rightAns(`Yes! Emma is at the door of the ${name}!`); return }
    lock(false);
  };
  G.gclr=()=>{if(G.cur.running||G.cur.done)return;hx=0;hy=0;d=0;trail=[[0,0]];drawTrail();moveTo(0,0);setAng(Math.round(ang/360)*360)};
};

/* ====================================================================
   RUN ENGINE
   ==================================================================== */
function startRun(p,c){
  let seed,i=0,err=0,res=[]; const r=P.resume;
  if(r&&r.p===p&&r.c===c&&r.i<BUILD[p][c](r.seed).length){seed=r.seed;i=r.i;err=r.err;res=r.res||[]} else seed=Math.floor(Math.random()*900000)+1000;
  G={p,c,seed,tasks:BUILD[p][c](seed),i,err,res,cur:{wrong:false,done:false}};
  show("play"); runTask();
}
const dotsHTML=()=>G.tasks.map((_,k)=>`<i class="${G.res[k]||""} ${k===G.i?"cur":""}"></i>`).join("");
const updateDots=()=>{const e=$("#pd");if(e)e.innerHTML=dotsHTML()};
function runTask(){
  const t=G.tasks[G.i]; G.cur={wrong:false,done:false}; G.rep=G.pick=G.hs=G.sub=G.chk=G.cl=G.gc=G.gundo=G.gclr=G.ggo=G.gdemo=G.chip=G.fi=G.srv=G.pk=G.ck=G.bc=G.bn=G.bi=null;clearInterval(G.tint); G.rt=(G.rt||0)+1; updateDots();
  $("#nextrow").innerHTML=""; const host=$("#task"); host.innerHTML=""; host.onpointerdown=null; TR[t.kind](t,host);
}
function wrongAns(extra){
  const t=G.tasks[G.i]; if(!G.cur.wrong){G.cur.wrong=true;G.err++;G.res[G.i]="err";updateDots()}
  UI.no(); say("kylie","Not quite. "+(extra||t.hint)+(G.err===MAXERR?" Careful! One more mistake and you will have to try again.":G.err>MAXERR?" Keep going - you can try again!":""),"soft");
}
function rightAns(text,mute){
  if(G.cur.done)return; G.cur.done=true; if(!G.cur.wrong)G.res[G.i]="ok"; updateDots(); UI.ok();
  say(Math.random()<.5?"emma":"max",text||PRAISE[Math.floor(Math.random()*PRAISE.length)],"cheer",{mute});
  P.resume={p:G.p,c:G.c,seed:G.seed,i:G.i+1,err:G.err,res:G.res}; save(); nextBtn();
}
function next(){ G.i++; if(G.i>=G.tasks.length)finish(); else runTask(); }
function finish(){
  const win=G.err<=MAXERR; P.resume=null; G.win=win; G.first=win&&!P.stars[G.p][G.c]; if(win)P.stars[G.p][G.c]=1; save();
  window.CELEB=win&&G.first; show("result"); if(win){UI.win();confetti()} else UI.no();
  const phaseDone=win&&G.first&&G.c===1;
  setTimeout(()=>speak(win?"emma":"max",win?(phaseDone?"Phase complete! The star is shining!":"Great job! You won a star!"):"Almost! Let's try again!"),600);
}


/* ====================================================================
   PHASE 2 - BONDI BEACH CAFE. Only food from the New York game vocabulary. No names under the food pictures.
   New kinds of games: serve (customers + big timer), memory (the ticket hides), catch (falling food, 8+ foods),
   bingo (the waiter calls the food), belt (grab the food from a moving belt, then say the order).
   ==================================================================== */
BUILD.p2=[null,null];
const WHOS=["kylie","bruce","mia","emma","max"];
function itemsFor(rn,n){const g=c=>shuf(rn,MENU.filter(m=>m.c===c).map(m=>m.id)),O=g("other"),D=g("drink"),V=g("veg"),F=g("fruit");
  if(n===2)return shuf(rn,[O[0],D[0]]); if(n===3)return shuf(rn,[O[0],D[0],rn()<.5?F[0]:V[0]]); if(n===4)return shuf(rn,[O[0],O[1],D[0],F[0]]); return shuf(rn,[O[0],O[1],D[0],V[0],F[0]])}
const shelfFor=(rn,items,n=8)=>shuf(rn,[...items,...shuf(rn,MID.filter(x=>!items.includes(x))).slice(0,n-items.length)]);
const orderLine=(rn,ids)=>rn()<.5?`I'd like ${listText(ids)}, please.`:`Can I have ${listText(ids)}, please?`;
function mkServe(rn,nC,nI,pat){const ws=shuf(rn,WHOS);return {kind:"serve",pat,cust:Array.from({length:nC},(_,i)=>{const items=itemsFor(rn,nI);return {who:ws[i],items,line:orderLine(rn,items),shelf:shelfFor(rn,items)}}),coach:"Read the order. Tap the food. Press Serve!",say:"Serve the customers! Listen to the order. Tap the food and press Serve!",hint:"Listen to the order again. Count the things the customer wants."}}
function mkMemory(rn,n,secs){const items=itemsFor(rn,n);return {kind:"memory",who:pick(rn,WHOS),items,secs,line:orderLine(rn,items),shelf:shelfFor(rn,items,n>3?10:8),coach:"Remember the order! The ticket will hide.",say:"Remember the order! Look at the ticket. Soon it will hide.",hint:"Remember what the customer asked for. You can peek once."}}
function mkCatch(rn,hard){return {kind:"catch",hard,phases:hard?shuf(rn,["fruit","veg","drink","sweet","fast"]).slice(0,3).map(cat=>({cat,n:8})):[{cat:pick(rn,["drink","fruit","veg","sweet"]),n:8}],coach:"Move the basket. Catch only the food group in the question!",hint:"Catch only the food group named at the top."}}
function mkBingo(rn,nOn,nOff,secs){const card=shuf(rn,MID).slice(0,9),off=shuf(rn,MID.filter(x=>!card.includes(x))).slice(0,nOff),calls=shuf(rn,[...shuf(rn,card).slice(0,nOn),...off]);
  return {kind:"bingo",card,calls,secs,coach:"Bingo! Listen to the waiter. Tap the food on your card.",say:"Bingo! Listen to the waiter. If the food is on your card, tap it. If not, press Not on my card.",hint:"Look at your card. Is that food on it?"}}
function mkBelt(rn,n,secs){const items=itemsFor(rn,n),extra=shuf(rn,MID.filter(x=>!items.includes(x)));return {kind:"belt",who:pick(rn,["emma","max"]),items,secs,belt:shuf(rn,[...items,...extra.slice(0,7-n)]),extraTile:extra[extra.length-1],coach:"Grab the food from the belt!",say:"Grab the food from the belt! Then say your order to the waiter.",hint:"Grab only the food in the bubble."}}
BUILD.p2[0]=seed=>{const rn=R(seed);return [mkServe(rn,2,2,25),mkMemory(rn,3,6),mkCatch(rn,false),mkBingo(rn,4,2,8),mkBelt(rn,2,30),mkServe(rn,2,3,22)]};
BUILD.p2[1]=seed=>{const rn=R(seed);return [mkCatch(rn,true),mkMemory(rn,4,7),mkBingo(rn,6,3,6),mkBelt(rn,3,26),mkServe(rn,3,3,16),mkMemory(rn,5,8)]};

/* ---------- shared pieces: pictures only (no names), big timer, tray ---------- */
const shelfHTML=ids=>`<div class="shelf2">${ids.map(id=>`<button class="fitem" data-act="fi" data-id="${id}" aria-label="${fname(id)}">${foodSVG(id)}</button>`).join("")}</div>`;
const chip=id=>`<span class="tchip">${foodSVG(id)}</span>`;
const timerHTML=`<div class="bigtimer" id="bt"><svg viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="19" class="tbg"/><circle cx="22" cy="22" r="19" class="tfg" id="tfg"/></svg><b id="tn">0</b></div>`;
function runTimer(secs,onEnd){const my=G.rt;clearInterval(G.tint);const t0=Date.now();
  const tick=()=>{if(G.rt!==my||!$("#bt")){clearInterval(G.tint);return}const left=Math.max(0,secs-(Date.now()-t0)/1000);$("#tn").textContent=Math.ceil(left);$("#tfg").style.strokeDashoffset=119.4*(1-left/secs);$("#bt").classList.toggle("low",left<=5);if(left<=0){clearInterval(G.tint);if(onEnd)onEnd()}};
  tick();G.tint=setInterval(tick,200)}
const stopTimer=()=>clearInterval(G.tint);
function trayLogic(maxN){G.sel=[];
  const draw=()=>{$$(".fitem").forEach(b=>b.classList.toggle("sel",G.sel.includes(b.dataset.id)));const tr=$("#tray");if(tr)tr.innerHTML=G.sel.length?G.sel.map(chip).join(""):`<span class="thint">Your tray is empty</span>`};
  G.fi=id=>{if(G.cur.done||G.cur.lock)return;const i=G.sel.indexOf(id);if(i>=0)G.sel.splice(i,1);else if(G.sel.length<maxN)G.sel.push(id);UI.tap();draw()};
  draw();return draw}
const trayRow=`<div class="trayrow"><span class="tlab">TRAY</span><div class="tray2" id="tray"></div></div>`;
const serveBtn=`<div class="orow"><button class="btn green" data-act="srv" id="srv">Serve! ${UI_I.check}</button></div>`;
const sameSet=(a,b)=>a.length===b.length&&a.every(x=>b.includes(x));

/* ---------- 1. serve the customers ---------- */
TR.serve=(t,host)=>{const my=G.rt;let ci=0;
  host.innerHTML=`<div class="qprompt">Serve the customers!<small>Listen to the order. Tap the food. Then press Serve!</small></div><div class="custbox" id="cust"></div>${trayRow}<div id="shelfwrap"></div>${serveBtn}`;
  const draw=trayLogic(Math.max(...t.cust.map(c=>c.items.length)));
  const show=first=>{const c=t.cust[ci];G.sel=[];
    $("#cust").innerHTML=`<span class="cf big" data-who="${c.who}">${face(c.who,"happy")}</span><div class="obub"><small>${NAMEOF[c.who]} · customer ${ci+1} of ${t.cust.length}</small>${c.line}</div>${timerHTML}`;
    $("#shelfwrap").innerHTML=shelfHTML(c.shelf);draw();
    runTimer(t.pat,()=>{if(G.rt===my&&!G.cur.done){say("kylie","Hurry up! The customer is hungry!","oops",{mute:true});show(false)}});
    G.rep=()=>speak(VOICE_OF[c.who],c.line);
    setTimeout(()=>{if(G.rt!==my||G.cur.done)return;if(first)speakSeq([["kylie",t.say],[VOICE_OF[c.who],c.line]]);else G.rep()},300)};
  show(true);say("kylie",t.coach,"happy",{mute:true});
  G.srv=()=>{if(G.cur.done||G.cur.lock)return;const c=t.cust[ci];
    if(sameSet(G.sel,c.items)){ci++;UI.ok();const f=$("#cust .cf");if(f)f.innerHTML=face(c.who,"cheer");
      if(ci>=t.cust.length){stopTimer();rightAns("All the customers are happy!");return}
      G.cur.lock=true;stopTimer();say(Math.random()<.5?"emma":"max","Thank you! Next customer!","cheer",{mute:true});setTimeout(()=>{if(G.rt===my&&!G.cur.done){G.cur.lock=false;show(false)}},1100)}
    else{G.sel=[];draw();wrongAns(t.hint)}};
};

/* ---------- 2. remember the order (the ticket hides) ---------- */
TR.memory=(t,host)=>{const my=G.rt;let peeks=1,hidden=false;
  host.innerHTML=`<div class="qprompt">Remember the order!<small>Look at the ticket. Soon it will hide!</small></div><div class="custbox"><span class="cf big" data-who="${t.who}">${face(t.who,"happy")}</span><div class="ticket" id="tk"></div>${timerHTML}</div>${trayRow}<div id="shelfwrap"></div>
   <div class="orow"><button class="btn paper sm" data-act="pk" id="pk">Peek again (1)</button><button class="btn green" data-act="srv" id="srv" disabled>Serve! ${UI_I.check}</button></div>`;
  const draw=trayLogic(t.items.length);
  const showT=()=>{$("#tk").innerHTML=`<div class="tl">${t.items.map(chip).join("")}</div>`};
  const hideT=()=>{hidden=true;stopTimer();const bt=$("#bt");if(bt)bt.style.visibility="hidden";$("#tk").innerHTML=`<div class="tl">${t.items.map(()=>`<span class="tchip q"><b>?</b></span>`).join("")}</div>`;$("#shelfwrap").innerHTML=shelfHTML(t.shelf);draw();const s=$("#srv");if(s)s.disabled=false;say("kylie","Now tap the food you remember!","happy",{mute:true})};
  showT();G.rep=()=>speak(VOICE_OF[t.who],t.line);setTimeout(()=>{if(G.rt===my&&!G.cur.done)speakSeq([["kylie",t.say],[VOICE_OF[t.who],t.line]])},300);say("kylie",t.coach,"happy",{mute:true});
  runTimer(t.secs,()=>{if(G.rt===my&&!G.cur.done)hideT()});
  G.pk=()=>{if(!hidden||peeks<1||G.cur.done)return;peeks--;$("#pk").textContent="Peek again (0)";$("#pk").disabled=true;showT();G.cur.lock=true;setTimeout(()=>{if(G.rt===my&&!G.cur.done){G.cur.lock=false;$("#tk").innerHTML=`<div class="tl">${t.items.map(()=>`<span class="tchip q"><b>?</b></span>`).join("")}</div>`}},2500)};
  G.srv=()=>{if(G.cur.done||G.cur.lock)return;if(sameSet(G.sel,t.items)){$("#tk").innerHTML=`<div class="tl">${t.items.map(chip).join("")}</div>`;rightAns("Great memory!")}else{G.sel=[];draw();wrongAns(t.hint)}};
};

/* ---------- 3. catch the food (moving game, 8 or more foods) ---------- */
const BASKET=`<svg viewBox="0 0 120 64" aria-hidden="true"><path d="M6 14L114 14L100 60L20 60Z" fill="#D9A36A" stroke="#7A5545" stroke-width="3" stroke-linejoin="round"/><path d="M14 28L106 28M18 42L102 42M36 14L40 60M60 14L60 60M84 14L80 60" stroke="#B9783E" stroke-width="2.4" fill="none"/><path d="M4 14C4 6 116 6 116 14" fill="none" stroke="#7A5545" stroke-width="5" stroke-linecap="round"/></svg>`;
TR.catch=(t,host)=>{const my=G.rt;let pi=0,got=0,bx=0;
  host.innerHTML=`<div class="qprompt" id="cq"></div><div class="arena" id="arena"><div class="abar" id="abar"></div><div class="basket" id="bsk">${BASKET}</div></div>`;
  const arena=$("#arena"),bsk=$("#bsk"),W=()=>arena.clientWidth,H=()=>arena.clientHeight,bw=()=>Math.min(160,W()*.24);
  const label=()=>{const p=t.phases[pi];$("#cq").innerHTML=`Catch the <span class="hl">${CATNAME[p.cat]}</span>!<small>Move the basket. Catch ONLY ${CATNAME[p.cat].toLowerCase()} (${CATEX[p.cat]}).</small>`;$("#abar").textContent=`${got} / ${p.n}`;say("kylie",`Catch the ${CATNAME[p.cat].toLowerCase()}!`,"happy")};
  const setB=x=>{bx=Math.max(bw()/2,Math.min(W()-bw()/2,x));bsk.style.width=bw()+"px";bsk.style.transform=`translateX(${bx-bw()/2}px)`};
  host.addEventListener("pointermove",e=>setB(e.clientX-arena.getBoundingClientRect().left));host.addEventListener("pointerdown",e=>setB(e.clientX-arena.getBoundingClientRect().left));
  arena.addEventListener("pointerdown",e=>setB(e.clientX-arena.getBoundingClientRect().left));
  G.ck=d=>setB(bx+d*70);
  const items=[];let last=0,acc=0,over=false;const speed=()=>H()/(t.hard?2.3:3.2),gap=t.hard?600:760;
  G.rep=()=>speak("kylie",`Catch the ${CATNAME[t.phases[Math.min(pi,t.phases.length-1)].cat].toLowerCase()}!`);
  const spawn=()=>{const p=t.phases[pi],pool=Math.random()<.5?MENU.filter(m=>catchCat(m.id)===p.cat):MENU,id=pool[Math.floor(Math.random()*pool.length)].id,sz=Math.max(46,Math.min(72,W()*.1)),el=document.createElement("div");
    el.className="fall";el.style.width=el.style.height=sz+"px";el.innerHTML=foodSVG(id);arena.appendChild(el);items.push({el,id,sz,x:Math.random()*(W()-sz),y:-sz})};
  const flash=c=>{bsk.classList.add(c);setTimeout(()=>bsk.classList.remove(c),350)};
  const loop=ts=>{if(over||G.rt!==my||!document.body.contains(arena)||G.cur.done)return;if(!last)last=ts;const dt=Math.min(.2,(ts-last)/1000);last=ts;acc+=dt*1000;
    if(acc>gap){acc=0;spawn()}
    for(let i=items.length-1;i>=0;i--){const it=items[i];it.y+=speed()*dt;it.el.style.transform=`translate(${it.x}px,${it.y}px)`;
      const top=H()-64*bw()/120-4;
      if(it.y+it.sz>top+6&&it.y<H()&&Math.abs(it.x+it.sz/2-bx)<bw()/2+it.sz*.1){
        items.splice(i,1);it.el.remove();const p=t.phases[pi];
        if(catchCat(it.id)===p.cat){got++;UI.tap();flash("good");$("#abar").textContent=`${got} / ${p.n}`;
          if(got>=p.n){pi++;got=0;if(pi>=t.phases.length){over=true;items.forEach(x=>x.el.remove());rightAns("You caught them all!");return}items.splice(0).forEach(x=>x.el.remove());label();break}}
        else{flash("bad");wrongAns(`That's ${askOf(it.id)}. Catch the ${CATNAME[p.cat].toLowerCase()}!`)}}
      else if(it.y>H()){items.splice(i,1);it.el.remove()}}
    requestAnimationFrame(loop)};
  setB(W()/2);label();requestAnimationFrame(loop);
};

/* ---------- 4. bingo: the waiter calls the food ---------- */
TR.bingo=(t,host)=>{const my=G.rt;let queue=t.calls.slice(),marked=[],cur=null;
  host.innerHTML=`<div class="qprompt">Bingo!<small>Listen to the waiter. Tap the food on your card!</small></div><div class="custbox"><span class="cf big" data-who="mia">${face("mia","happy")}</span><div class="obub" id="call"></div>${timerHTML}</div>
   <div class="card3">${t.card.map(id=>`<button class="fitem" data-act="bc" data-id="${id}" aria-label="${fname(id)}">${foodSVG(id)}<i class="stamp">✓</i></button>`).join("")}</div><div class="orow"><button class="btn paper" data-act="bn" id="bn">Not on my card</button></div>`;
  const next=first=>{if(G.rt!==my||G.cur.done||!host.isConnected)return;if(!queue.length){stopTimer();rightAns("BINGO! You did it!");return}cur=queue.shift();
    $("#call").innerHTML=`<small>Call ${t.calls.length-queue.length} of ${t.calls.length}</small>Bingo! ${ucf(fname(cur))}!`;
    const line=`Bingo! ${fname(cur)}!`;G.rep=()=>speak("mia",line);
    if(first)speakSeq([["kylie",t.say],["mia",line]]);else G.rep();
    runTimer(t.secs,()=>{if(G.rt===my&&!G.cur.done){queue.push(cur);say("kylie","Hurry up! Mia will call it again.","oops",{mute:true});next(false)}})};
  const good=()=>{UI.ok();G.cur.lock=true;stopTimer();setTimeout(()=>{if(G.rt===my){G.cur.lock=false;next(false)}},700)};
  G.bc=(id,b)=>{if(G.cur.done||G.cur.lock)return;if(id===cur){b.classList.add("done");marked.push(id);good()}else{b.classList.add("bad");setTimeout(()=>b.classList.remove("bad"),400);wrongAns(id!==cur&&t.card.includes(cur)?"That is not the food Mia called. Listen again.":"That food was not called. Listen again.")}};
  G.bn=()=>{if(G.cur.done||G.cur.lock)return;if(!t.card.includes(cur))good();else wrongAns("That food IS on your card. Find it!")};
  say("kylie",t.coach,"happy",{mute:true});setTimeout(()=>next(true),300);
};

/* ---------- 5. the belt: grab the food, then say the order ---------- */
TR.belt=(t,host)=>{const my=G.rt;let got=[],over=false;
  host.innerHTML=`<div class="qprompt">Order at the beach cafe!<small>Grab the food in the bubble from the belt!</small></div><div class="custbox"><span class="cf big" data-who="${t.who}">${face(t.who,"happy")}</span><div class="obub"><small>${NAMEOF[t.who]} wants</small><div class="tl">${t.items.map(chip).join("")}</div></div>${timerHTML}</div>${trayRow}<div class="belt" id="belt"></div>`;
  const belt=$("#belt");G.sel=[];const draw=()=>{$("#tray").innerHTML=got.length?got.map(chip).join(""):`<span class="thint">Your tray is empty</span>`};draw();
  const sz=()=>Math.max(54,Math.min(84,belt.clientWidth*.13)),L=()=>belt.clientWidth+sz()*1.4;
  const els=t.belt.map((id,i)=>{const el=document.createElement("button");el.className="bitem";el.dataset.id=id;el.setAttribute("aria-label",fname(id));el.innerHTML=foodSVG(id);belt.appendChild(el);return {el,id,x:i*(belt.clientWidth+sz()*1.4)/t.belt.length}});
  G.rep=()=>speak("kylie","Grab the food in the bubble from the belt!");setTimeout(()=>{if(G.rt===my&&!G.cur.done)speakSeq([["kylie",t.say]])},300);say("kylie",t.coach,"happy",{mute:true});
  runTimer(t.secs,()=>{if(G.rt===my&&!G.cur.done){say("kylie","Hurry up! The belt is fast!","oops",{mute:true});}});
  let last=0;const loop=ts=>{if(over||G.rt!==my||!document.body.contains(belt))return;if(!last)last=ts;const dt=Math.min(.2,(ts-last)/1000);last=ts;
    els.forEach(o=>{o.x-=dt*belt.clientWidth*.11;if(o.x<-sz())o.x+=L();o.el.style.width=o.el.style.height=sz()+"px";o.el.style.transform=`translateX(${o.x}px)`});requestAnimationFrame(loop)};requestAnimationFrame(loop);
  belt.addEventListener("pointerdown",e=>{const px=e.clientX,py=e.clientY;const hit=els.find(o=>{const r=o.el.getBoundingClientRect();return px>=r.left-10&&px<=r.right+10&&py>=r.top-10&&py<=r.bottom+10});if(hit)G.bi(hit.id)});
  G.bi=id=>{if(G.cur.done||G.cur.lock||over)return;
    if(t.items.includes(id)&&!got.includes(id)){got.push(id);UI.tap();draw();const o=els.find(e=>e.id===id);if(o)o.el.classList.add("took");
      if(got.length===t.items.length){over=true;stopTimer();setTimeout(()=>{if(G.rt===my)stage2()},600)}}
    else if(!t.items.includes(id))wrongAns(`That's ${askOf(id)}. Grab only the food in the bubble.`)};
  /* stage 2: say it to the waiter (build the sentence) */
  const stage2=()=>{const n=t.items.length,words=["__op"];t.items.forEach((id,i)=>{if(i)words.push("and");words.push(askOf(id))});words.push("please");
    const exp=words.slice(),alt={0:["Can I have"]};exp[0]="I'd like";
    const tiles=["I'd like","Can I have","Give me",...words.slice(1),t.extraTile?askOf(t.extraTile):"water"];const rn=R(G.seed+G.i*17+2);
    host.innerHTML=`<div class="qprompt">Now say it to the waiter!<small>Build a polite sentence. You can choose any foods, in any order!</small></div><div class="custbox"><span class="cf big" data-who="mia">${face("mia","happy")}</span><div class="obub">What would you like?</div></div>
     <div class="oslots mid">${exp.map(()=>`<div class="oslot"></div>`).join("")}</div><div class="obank" id="obank">${shuf(rn,tiles).map(w=>`<button class="piece wordp otile" data-t="${esc(w)}">${w}</button>`).join("")}</div>${chkBtn}`;
    /* any polite sentence is correct: I'd like / Can I have + a food (and a food ...) + please. The foods can be any foods, in any order. */
    const FOODW=new Set(MID.map(askOf));
    const valid=got=>got.map((w,k)=>k===0?(w==="I'd like"||w==="Can I have"):k===got.length-1?w==="please":k%2===1?FOODW.has(w):w==="and");
    setupTiles(host,exp,{valid,ok:got=>`Yes! ${got[0]} ${got.slice(1,-1).join(" ")}, please.`,hint:"Start with I'd like or Can I have. Do not say Give me! Then say a food, and, a food. End with please.",alt});
    G.rep=()=>speak("mia","What would you like?");say("mia","What would you like?","happy")};
};


/* ====================================================================
   PHASE 3 - WILDLIFE PARK. Only the 10 animals of the Safari game. New games:
   safari (tap the animal that walks past), lineup (put the animals in order), riddle (comparison clues),
   race (guess, watch, say it), cwrite (write a comparison).
   ==================================================================== */
BUILD.p3=[null,null];
const aImgBtn=id=>`<button class="fitem" data-act="bc" data-id="${id}" aria-label="${ANAMES[id]}">${animalImg(id)}<i class="stamp">✓</i></button>`;
function aSet(rn,adj,n,gap){for(let k=0;k<800;k++){const s=shuf(rn,apool(adj)).slice(0,n).sort((a,b)=>aval(b,adj)-aval(a,adj));let ok=true;for(let i=1;i<n;i++)if(aval(s[i-1],adj)-aval(s[i],adj)<gap)ok=false;if(ok)return s}return null}
function mkSafari(rn,n,secs){const adj=pick(rn,AADJ),set=aSet(rn,adj,n,n>4?2:3)||aSet(rn,adj,n,1);return {kind:"safari",adj,secs,set:shuf(rn,set),target:set[0],coach:`Tap ${asup(adj)} animal!`,say:`Photo safari! Tap ${asup(adj)} animal.`,hint:"Think about the animals. Which one is it? Look again."}}
function mkLineup(rn,n){const adj=pick(rn,AADJ),set=aSet(rn,adj,n,n>3?2:3)||aSet(rn,adj,n,1);return {kind:"lineup",adj,order:set,bank:shuf(rn,set),coach:`Line up the animals! ${ucf(asup(adj))} animal is first.`,say:`Line up the animals! ${ucf(asup(adj))} animal is first.`,hint:`Who is ${asup(adj)}? Put it first. Then the next one.`}}
const diff=(a,x,adj)=>aval(a,adj)-aval(x,adj);
/* Who am I? Clear clues: comparison clues with the picture of the other animal (big differences only), and always one
   clue from the Safari game that names the animal (its sound or what it has), so one animal is the only possible answer. */
const ACLUE={dog:"I bark. Woof woof!",cat:"I say meow.",lion:"I have a big mane. Roar!",tiger:"I have orange and black stripes.",elephant:"I have a long trunk.",giraffe:"I have a very long neck.",cow:"I give you milk. Moo!",chicken:"I lay eggs. Cluck cluck!",duck:"I swim on the water. Quack!",horse:"You can ride me. Neigh!"};
const RADJ=["big","small","fast","slow","heavy","tall"];
const clueOk=(c,cl)=>cl.k==="id"?c===cl.id:aval(c,cl.adj)>aval(cl.x,cl.adj);
const rClueTxt=cl=>cl.k==="id"?ACLUE[cl.id]:`I am ${acomp(cl.adj)} than the ${alc(cl.x)}.`;
function mkRiddle(rn,nC,avoid=[]){for(let a=0;a<3000;a++){const target=pick(rn,AIDS.filter(x=>!avoid.includes(x))),clues=[];
    for(const adj of shuf(rn,RADJ)){if(clues.length>=nC-1)break;if((adj==="fast"||adj==="slow")&&(target==="duck"||target==="chicken"))continue;
      const xs=shuf(rn,apool(adj).filter(x=>x!==target&&diff(target,x,adj)>=3&&!clues.some(c=>c.x===x)));if(xs.length)clues.push({k:"cmp",adj,x:xs[0]})}

  const belt=$("#belt"),sz=()=>Math.max(80,Math.min(150,belt.clientHeight*.9)),L=()=>belt.clientWidth+sz()*1.5;
  const els=t.set.map((id,i)=>{const el=document.createElement("div");el.className="wk";el.dataset.id=id;el.innerHTML=animalImg(id);belt.appendChild(el);const x0=i*L()/t.set.length;el.style.width=el.style.height=sz()+"px";el.style.transform=`translateX(${x0}px)`;return {el,id,x:x0}});

  belt.addEventListener("pointerdown",e=>{if(G.cur.done)return;const cx=o=>{const r=o.el.getBoundingClientRect();return (r.left+r.right)/2},hits=els.filter(o=>{const r=o.el.getBoundingClientRect();return e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom}).sort((a,b)=>Math.abs(cx(a)-e.clientX)-Math.abs(cx(b)-e.clientX)),hit=hits[0];if(!hit)return;
    if(hit.id===t.target){over=true;stopTimer();hit.el.classList.add("flash");rightAns(`Click! The ${alc(hit.id)} is ${asup(t.adj)}!`)}

function checkAnimalSentence(t,text){

   mistake (Wildlife Park: which sentence about the animals is wrong?), simon (Outback: remember the weather and clothes in order).
   Each challenge has 4 tasks, one per place.
   ==================================================================== */
const SPELLW=["sunny","rainy","cloudy","snowy","windy","stormy"], SPELLC=["scarf","gloves","boots","dress","skirt","jeans","sweater","raincoat","swimsuit","earmuffs","flipflops"];
function mkSpell(rn,hard){const id=hard?pick(rn,["sweater","raincoat","swimsuit","earmuffs","flipflops","gloves"]):pick(rn,SPELLW),word=id.toUpperCase(),letters=word.split("");let sh=shuf(rn,letters);if(sh.join("")===word)sh=sh.reverse();
  return {kind:"spell",hard,id,word,letters,bank:sh,coach:hard?"What does the customer want? Spell it.":"Look at the weather. Spell the word.",hint:hard?"Look at the clothes. Say the word. Which letter is first?":"Look at the picture. What's the weather like?"}}
TR.spell=(t,host)=>{const pic=t.hard?clothSVG(t.id):wxSVG(t.id);
  host.innerHTML=`<div class="qprompt">Spell the word!<small>${t.hard?"The customer says: I want ... please! Tap the letters in order.":"What's the weather like? Tap the letters in order."}</small></div>
   <div class="typepic">${pic}</div><div class="uslots"><span class="ugrp">${t.letters.map(()=>`<span class="oslot lslot"></span>`).join("")}</span></div><div class="obank ubank" id="obank">${t.bank.map(c=>`<button class="piece otile ltile" data-t="${c}">${c}</button>`).join("")}</div>`+chkBtn;
  setupTiles(host,t.letters,{ok:t.hard?`Yes! ${CLO[t.id].a.replace(/^some /,"")}!`:`Yes! It's ${t.id}.`,hint:t.hint});
  G.rep=()=>speak("kylie",t.hard?`I want ${CLO[t.id].a}, please! Spell it.`:"What's the weather like? Spell the word.");setTimeout(()=>{if(G.rt&&!G.cur.done)G.rep()},300);say("kylie",t.coach,"happy",{mute:true});
};

/* ---------- builders for the reef ---------- */
const normR=s=>s.toLowerCase().replace(/[‘’`]/g,"'").replace(/\bi am\b/g,"im").replace(/'/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
const RQ={
 name:{q:"What's your name?",re:/^(my name is|im) [a-z]+( [a-z]+)?$/,chips:["My name is"],hint:"Write: My name is ..."},
 age:{q:"How old are you?",re:/^im (\d{1,3}|(?:(?:twenty|thirty|forty|fifty|sixty|seventy|eighty|ninety)(?: (?:one|two|three|four|five|six|seven|eight|nine))?|zero|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen|(?:one )?hundred)) years? old$/,chips:["I'm","years old"],hint:"Write: I'm ... years old. You can write the number (8) or the word (eight)."},
 from:{q:"Where are you from?",re:/^im from [a-z]+( [a-z]+)?$/,chips:["I'm from"],hint:"Write: I'm from ..."},
 how:{q:"How are you?",re:/^im (fine|great|good|ok)( thank you| thanks)?$/,chips:["I'm","fine","thank you"],hint:"Write: I'm fine, thank you."}
};
function mkReply(rn,n){const keys=n===1?[pick(rn,["name","age","from","how"])]:["name","age","from"];return {kind:"reply",qs:keys.map(k=>RQ[k]),keys,coach:n===1?"Kylie asks you a question. Write your answer.":"Interview! Write your answers.",say:n===1?RQ[keys[0]].q:"Interview time! Answer the three questions.",hint:RQ[keys[0]].hint}}
TR.reply=(t,host)=>{let focus=0;const many=t.qs.length>1,chips=[...new Set(t.qs.flatMap(q=>q.chips))];
  host.innerHTML=`<div class="qprompt">${many?"Interview time!":"Answer the question!"}<small>Write a full sentence${many?" for each question":""}.</small></div>
   <div class="ivbox">${t.qs.map((q,i)=>`<div class="ivrow"><span class="cf big" data-who="kylie">${face("kylie","happy")}</span><div class="obub"><small>RANGER KYLIE</small>${q.q}</div><input id="iv${i}" class="wide" type="text" autocomplete="off" autocapitalize="sentences" spellcheck="false" maxlength="60" aria-label="Your answer ${i+1}"></div>`).join("")}</div>
   <div class="chips cc">${chips.map(w=>`<button class="chip" data-act="chip" data-w="${esc(w)}">${w}</button>`).join("")}</div><div class="orow"><button class="btn green" data-act="tsub">Check ${UI_I.check}</button></div>`;
  host.addEventListener("focusin",e=>{if(/^iv\d$/.test(e.target.id))focus=+e.target.id.slice(2)});
  G.rep=()=>speakSeq(t.qs.map(q=>["kylie",q.q]));setTimeout(()=>{if(G.rt&&!G.cur.done)G.rep()},300);say("kylie",t.coach,"happy",{mute:true});
  G.chip=w=>{const i=$("#iv"+focus);if(!i||G.cur.done)return;i.value=(i.value&&!/\s$/.test(i.value)?i.value+" ":i.value)+w+" ";i.focus()};
  G.sub=()=>{if(G.cur.done)return;const ins=t.qs.map((_,i)=>$("#iv"+i)),vals=ins.map(i=>i.value.trim());if(vals.some(v=>!v))return;
    const bad=t.qs.findIndex((q,i)=>!q.re.test(normR(vals[i])));
    if(bad<0){ins.forEach(i=>i.disabled=true);rightAns(many?"Great interview!":`Yes! ${ucf(vals[0])}${/[.!?]$/.test(vals[0])?"":"."}`)}
    else{ins[bad].classList.add("shake");setTimeout(()=>ins[bad].classList.remove("shake"),420);ins[bad].focus();wrongAns(t.qs[bad].hint)}};
};

const SFOOD=["rice","bread","fish","cheese","cookies","water","milk","apple","banana","tomato","potato","lettuce"];
const foodWord=id=>askOf(id).replace(/^(a|an) /,"");
function mkSearch(rn,n,k){for(let a=0;a<300;a++){const ids=shuf(rn,SFOOD.filter(w=>w.length<=n)).slice(0,k),g=Array.from({length:n},()=>Array(n).fill("")),pos={};let ok=true;
    for(const w of ids){let placed=false;for(let tr=0;tr<80&&!placed;tr++){const hor=rn()<.5,r=Math.floor(rn()*(hor?n:n-w.length+1)),c=Math.floor(rn()*(hor?n-w.length+1:n));let fit=true;
      for(let i=0;i<w.length;i++){const v=g[hor?r:r+i][hor?c+i:c];if(v&&v!==w[i].toUpperCase())fit=false}
      if(fit){for(let i=0;i<w.length;i++)g[hor?r:r+i][hor?c+i:c]=w[i].toUpperCase();pos[w]=[r,c,hor];placed=true}}if(!placed)ok=false}
    if(!ok)continue;const AB="AAEEIIOOUBCDFGHLMNPRSTWY";for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(!g[r][c])g[r][c]=AB[Math.floor(rn()*AB.length)];
    const lines=[];for(let r=0;r<n;r++)lines.push(g[r].join(""));for(let c=0;c<n;c++)lines.push(g.map(x=>x[c]).join(""));
    if(!ids.every(w=>lines.filter(l=>l.includes(w.toUpperCase())).length===1&&lines.join("|").split(w.toUpperCase()).length===2))continue;
    return {kind:"search",n,ids,g,pos,coach:"Find the foods hidden in the letters!",say:`Food search! Find ${k} foods in the letters. Tap the first letter and the last letter.`,hint:"Look at the pictures. Words go across or down."}}}
TR.search=(t,host)=>{let start=null,tries=0;const found=new Set();host.style.setProperty("--n",t.n);
  const cells=t.g.map((row,r)=>row.map((ch,c)=>`<button class="wsc" data-act="wsc" data-r="${r}" data-c="${c}" aria-label="${ch}">${ch}</button>`).join("")).join("");
  host.innerHTML=`<div class="qprompt">Food search!<small>Find the ${t.ids.length} foods. Tap the first letter, then the last letter.</small></div>
   <div class="splitwrap">${fitBox(`<div class="wsgrid" style="--n:${t.n}">${cells}</div>`,"1")}<div class="wctl"><div class="wsfoods">${t.ids.map(id=>`<button class="wsf" data-act="say" data-who="kylie" data-say="${foodWord(id)}" data-id="${id}" aria-label="${foodWord(id)}">${foodSVG(id)}<i>✓</i></button>`).join("")}</div><div class="hintl" id="wsmsg">Tap a picture to hear the word.</div></div></div>`;
  G.rep=()=>speak("kylie",t.say);setTimeout(()=>{if(G.rt&&!G.cur.done)G.rep()},300);say("kylie",t.coach,"happy",{mute:true});
  const el=(r,c)=>$(`.wsc[data-r="${r}"][data-c="${c}"]`),clear=()=>{$$(".wsc.sel").forEach(b=>b.classList.remove("sel"));start=null},msg=m=>{const e=$("#wsmsg");if(e)e.textContent=m};
  G.wsc=(r,c)=>{if(G.cur.done)return;
    if(!start){start=[r,c];el(r,c).classList.add("sel");msg("Now tap the last letter.");return}
    const [r0,c0]=start;if(r0===r&&c0===c){clear();msg("Tap the first letter of a food.");return}
    let w="",cl=[];if(r0===r&&c>c0)for(let k=c0;k<=c;k++){w+=t.g[r][k];cl.push([r,k])}else if(c0===c&&r>r0)for(let k=r0;k<=r;k++){w+=t.g[k][c];cl.push([k,c])}
    const id=t.ids.find(x=>x.toUpperCase()===w&&!found.has(x));
    if(id){found.add(id);cl.forEach(([a,b])=>{const e=el(a,b);e.classList.remove("sel");e.classList.add("fnd")});$(`.wsf[data-id="${id}"]`).classList.add("got");start=null;UI.ok();speak("kylie",foodWord(id));
      if(found.size===t.ids.length)rightAns(`Yes! You found ${t.ids.map(foodWord).join(", ")}.`);else msg(`Great! ${t.ids.length-found.size} more to find.`)}
    else{clear();tries++;UI.no();msg(tries>=3?"Look at the pictures. Words go across or down, from left to right or from top to bottom.":"That is not one of the foods. Try again!");
      if(tries>=4){const rest=t.ids.find(x=>!found.has(x)),p=t.pos[rest];el(p[0],p[1]).classList.add("hintc")}}};
};

const RADJ2=["big","small","fast","slow","heavy","tall"];
function mkFalse(rn,nTot,nFalse,sup){const rows=[];const used=new Set();
  for(let i=0;i<nTot;i++){const isF=i<nFalse;
    for(let a=0;a<200;a++){let row;
      if(sup&&i%2===1){const adj=pick(rn,RADJ2),set=aSet(rn,adj,3,2);if(!set)continue;const tg=isF?pick(rn,set.slice(1)):set[0];row={text:`The ${alc(tg)} is ${asup(adj)}.`,ids:shuf(rn,set),ok:!isF}}
      else{const adj=pick(rn,RADJ2),pl=apool(adj),x=pick(rn,pl),ys=pl.filter(y=>y!==x&&diff(x,y,adj)>=3);if(!ys.length)continue;const y=pick(rn,ys);row=isF?{text:`The ${alc(y)} is ${acomp(adj)} than the ${alc(x)}.`,ids:[x,y],ok:false}:{text:`The ${alc(x)} is ${acomp(adj)} than the ${alc(y)}.`,ids:[x,y],ok:true}}
      if(used.has(row.text))continue;used.add(row.text);rows.push(row);break}}
  return {kind:"mistake2",rows:shuf(rn,rows),nF:nFalse,coach:nFalse>1?"Find the sentences with a mistake!":"Find the sentence with a mistake!",hint:"Look at the pictures. Think about the animals."}}
TR.mistake2=(t,host)=>{let found=0;
  host.innerHTML=`<div class="qprompt">Find the mistake!<small>Look at the animals. Tap the ${t.nF>1?t.nF+" sentences that are":"sentence that is"} wrong.</small></div>
   <div class="fbox">${t.rows.map((r,i)=>`<button class="frow" data-act="cl" data-k="${i}"><span class="fps">${r.ids.map(id=>`<i>${animalImg(id)}</i>`).join("")}</span><span class="ftx">${r.text}</span></button>`).join("")}</div>
   <div class="orow"><button class="btn paper sm" data-act="rep">${UI_I.sound} Listen</button></div>`;
  G.rep=()=>speakSeq(t.rows.map(r=>["kylie",r.text]));setTimeout(()=>{if(G.rt&&!G.cur.done)G.rep()},300);say("kylie",t.coach,"happy",{mute:true});
  G.cl=(k,b)=>{if(G.cur.done||b.disabled)return;b.disabled=true;
    if(!t.rows[k].ok){b.classList.add("right");found++;if(found===t.nF){$$(".frow").forEach(x=>x.disabled=true);rightAns("Yes! You found the mistake"+(t.nF>1?"s":"")+".")}else say("emma","Yes! One more mistake!","cheer",{mute:true})}
    else{b.classList.add("wrong");wrongAns("That sentence is correct. Look at the pictures again.")}};
};

const SIMW=["sunny","rainy","cloudy","snowy","windy","stormy"], SIMC=["scarf","raincoat","tshirt","boots"];
const simImg=id=>CLO[id]?clothSVG(id):wxSVG(id), simSay=id=>CLO[id]?spokenC(id):id;
function mkSimon(rn,len,mixed){const pad=mixed?shuf(rn,[...shuf(rn,SIMW).slice(0,4),...SIMC]):shuf(rn,SIMW),seq=shuf(rn,pad).slice(0,len);
  return {kind:"simon",pad,seq,mixed,coach:"Watch and listen. Then tap the pictures in the same order.",say:"Watch and listen. Then tap the pictures in the same order.",hint:"Watch again. Remember the order."}}
TR.simon=(t,host)=>{const my=G.rt;let pos=0,busy=true;const sleep=ms=>new Promise(r=>setTimeout(r,ms)),live=()=>G.rt===my&&host.isConnected&&!G.cur.done;
  host.innerHTML=`<div class="qprompt">Remember the order!<small id="sm">Watch and listen.</small></div><div class="simstage" id="stage"><span class="simq">?</span></div><div class="simdots" id="sd">${t.seq.map(()=>"<i></i>").join("")}</div>
   <div class="shelf2 cl ${t.pad.length===6?"six":""}" id="pad">${t.pad.map(id=>`<button class="fitem" data-act="bc" data-id="${id}" aria-label="${simSay(id)}" disabled>${simImg(id)}</button>`).join("")}</div>
   <div class="orow"><button class="btn paper sm" data-act="bn" id="again">${UI_I.replay} Watch again</button></div>`;
  const dots=()=>$$("#sd i").forEach((d,i)=>d.className=i<pos?"on":"");
  const play=async()=>{busy=true;pos=0;dots();$$("#pad .fitem").forEach(b=>b.disabled=true);const sm=$("#sm");if(sm)sm.textContent="Watch and listen.";
    await sleep(500);for(const id of t.seq){if(!live())return;$("#stage").innerHTML=`<span class="simimg">${simImg(id)}</span>${t.mixed?"":`<b>${simSay(id).toUpperCase()}</b>`}`;speak("kylie",simSay(id));await sleep(1250);if(!live())return;$("#stage").innerHTML=`<span class="simq">·</span>`;await sleep(250)}
    if(!live())return;$("#stage").innerHTML=`<span class="simq">?</span>`;if($("#sm"))$("#sm").textContent="Your turn! Tap the pictures in order.";$$("#pad .fitem").forEach(b=>{b.disabled=false;b.classList.remove("sel")});busy=false;speak("kylie","Your turn!")};
  G.rep=()=>{if(!busy)play()};G.bn=()=>{if(!busy&&!G.cur.done)play()};
  say("kylie",t.coach,"happy",{mute:true});speak("kylie",t.say,()=>{if(live())play()});
  G.bc=(id,b)=>{if(busy||G.cur.done)return;
    if(id===t.seq[pos]){b.classList.add("sel");b.disabled=true;speak("kylie",simSay(id));pos++;dots();if(pos===t.seq.length)rightAns("Perfect! Great memory!")}
    else{b.classList.add("bad");setTimeout(()=>b.classList.remove("bad"),400);wrongAns("Not that one. Watch again!");setTimeout(()=>{if(live())play()},900)}};
};

BUILD.p5=[null,null];
BUILD.p5[0]=seed=>{const rn=R(seed);return [mkReply(rn,1),mkSearch(rn,6,3),mkFalse(rn,3,1,false),mkSimon(rn,4,false)]};
BUILD.p5[1]=seed=>{const rn=R(seed);return [mkReply(rn,3),mkSearch(rn,8,4),mkFalse(rn,4,2,true),mkSimon(rn,5,true)]};

  <div class="main"><div class="task" id="task"></div><div class="nextrow" id="nextrow"></div></div><div class="coach">${coachHTML("kylie","")}</div></section>`;
SC.result=()=>{
  const win=G.win,n=G.err,c=G.c,ph=PHASE[G.p];
  const fin=win&&G.p==="p5"&&c===1&&G.first, pass=win&&G.p==="p5"&&c===1&&totalStars()>=10;const msg=fin?`You found all five stars! ${totalStars()} of 10 stars!`:win?(n===0?"No mistakes! Amazing!":`Only ${n} mistake${n>1?"s":""}. Well done!`):`You made ${n} mistakes. You can make up to ${MAXERR} mistakes.`;
  const sub=win?(G.first?(c===0?"The next place is open on the map!":"Phase "+(PH.indexOf(G.p)+1)+" is complete!"):"You already had this star. Great practice!"):"Try again with new questions. You can do it!";
  const btns=win?(c===0?`<button class="btn green" data-act="level" data-c="1">${UI_I.play} Super Challenge</button><button class="btn gold" data-act="map">${UI_I.map} Map</button>`:`${pass?`<button class="btn green pulse" data-act="passport">${UI_I.trophy} GET MY PASSPORT STAMP!</button>`:""}<button class="btn" data-act="map">${UI_I.map} Map</button><button class="btn gold" data-act="again">${UI_I.replay} Play again</button>`)
    :`<button class="btn" data-act="again">${UI_I.replay} Try again</button><button class="btn gold" data-act="map">${UI_I.map} Map</button>`;
  return `<section class="screen" id="s-result"><div class="bg">${sceneOf(G.p)}</div><div class="shade"></div>
   <div class="rcard"><div class="rhero">${win?`${ch("emma","cheer","cheer","celebrate")}${ch("kylie","cheer","cheer","celebrate c2")}${ch("max","cheer","cheer","celebrate c3")}`:`${ch("emma","soft","idle")}${ch("max","soft","idle")}`}</div>
   <h2>${win?(G.first&&c===1?(fin?"ADVENTURE COMPLETE!":"PHASE COMPLETE!"):"GREAT JOB!"):"ALMOST!"}</h2><div class="rrow"><div class="bigstar">${starIcon(win)}</div>${win?`<div class="rcross">${crossSVG(PH.map(phStars),G.first?PH.indexOf(G.p):-1)}</div>`:""}</div><p>${msg}</p><p style="font-size:15px;color:#4F6585">${sub}</p><div class="row">${btns}</div></div></section>`;
};


/* ====================================================================
   PART 5 - EVENTS AND BOOT
   ==================================================================== */
/* ---------- PASSPORT: 5 destinations. 1 UK, 2 New York, 3 Africa (already stamped), 4 Japan (stamped now), 5 = surprise ---------- */
const PASS_NAMES=["United Kingdom","New York","Africa","Japan","Australia"];
function stampFrame(id,top,bottom,center,c1,c2){
  return `<svg viewBox="0 0 200 200" aria-hidden="true"><defs><filter id="ink${id}" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3.4"/></filter><clipPath id="${id}Clip"><circle cx="100" cy="100" r="52"/></clipPath><path id="${id}Top" d="M26 100A74 74 0 0 1 174 100"/><path id="${id}Bot" d="M16 100A84 84 0 0 0 184 100"/></defs>
  <g filter="url(#ink${id})" opacity=".92"><circle cx="100" cy="100" r="94" fill="none" stroke="${c1}" stroke-width="6"/><circle cx="100" cy="100" r="86" fill="none" stroke="${c1}" stroke-width="2.4"/><circle cx="100" cy="100" r="58" fill="none" stroke="${c2}" stroke-width="4"/>${center}
  <text font-family="Baloo 2,Trebuchet MS,sans-serif" font-weight="800" font-size="18" letter-spacing="3" fill="${c1}"><textPath href="#${id}Top" startOffset="50%" text-anchor="middle">${top}</textPath></text>
  <text font-family="Baloo 2,Trebuchet MS,sans-serif" font-weight="800" font-size="12.5" letter-spacing="2.2" fill="${c2}"><textPath href="#${id}Bot" startOffset="50%" text-anchor="middle">${bottom}</textPath></text></g></svg>`;
}
function ukStamp(){ const flag=`<g clip-path="url(#ukClip)"><rect x="40" y="40" width="120" height="120" fill="#2B3F9A"/><path d="M40 40L160 160M160 40L40 160" stroke="#fff" stroke-width="18"/><path d="M40 40L160 160M160 40L40 160" stroke="#C8283C" stroke-width="7"/><path d="M100 40V160M40 100H160" stroke="#fff" stroke-width="30"/><path d="M100 40V160M40 100H160" stroke="#C8283C" stroke-width="17"/></g>`; return stampFrame("uk","UNITED KINGDOM","ENGLISH EXPLORERS ★ 1",flag,"#2B3F9A","#C8283C") }
function nyStamp(){ const lib=`<g transform="translate(100 150) scale(.5)" fill="#1F7A6A" stroke="#1F7A6A" stroke-width="3" stroke-linejoin="round"><path d="M-30 0L30 0L24 -40L-24 -40Z" opacity=".55"/><path d="M-16 -40L16 -40L24 -96L10 -140L-10 -140L-24 -96Z"/><circle cx="0" cy="-156" r="14"/><path d="M-12 -164L-28 -178M-6 -168L-14 -188M0 -170L0 -192M6 -168L14 -188M12 -164L28 -178" stroke-width="6" stroke-linecap="round"/><path d="M12 -128C30 -146 36 -180 32 -208" fill="none" stroke-width="14" stroke-linecap="round"/><path d="M32 -208C22 -220 30 -234 34 -240C42 -232 48 -220 40 -208Z" fill="#C8283C" stroke="#C8283C"/></g>`; return stampFrame("ny","NEW YORK","ENGLISH EXPLORERS ★ 2",lib,"#C8283C","#2B3F9A") }
function africaStamp(){ const af=`<g clip-path="url(#afClip)"><path d="M84 56 L104 52 L122 58 L136 64 L146 78 L152 90 L140 94 L134 106 L130 120 L122 138 L112 152 L102 150 L98 134 L96 118 L86 108 L74 108 L64 96 L62 82 L70 68Z" fill="#2F8F4E"/><path d="M120 72 C126 78 126 90 122 98" fill="none" stroke="#1E6B38" stroke-width="3" stroke-linecap="round"/><g transform="translate(96 112) scale(.34)" fill="#7A4E2A"><path d="M-6 0 C-4 -30 -10 -50 -24 -74 L-16 -76 C-6 -60 0 -50 4 -40 C8 -52 16 -64 30 -76 L36 -70 C22 -56 12 -40 10 -20 L12 0Z"/><ellipse cx="2" cy="-84" rx="60" ry="16" fill="#1E6B38"/></g><circle cx="132" cy="70" r="9" fill="#FFC531"/></g>`; return stampFrame("af","AFRICA","ENGLISH EXPLORERS ★ 3",af,"#D9480F","#2F8F4E") }
function japanStamp(){ const jp=`<g clip-path="url(#jpClip)"><circle cx="124" cy="72" r="13" fill="#C8283C"/><path d="M42 148C62 120 80 94 92 80C97 74 103 74 108 80C120 94 138 120 158 148Z" fill="#2B3F9A"/><path d="M82 92C88 88 92 96 98 91C102 88 106 96 112 91L108 82C103 76 97 76 92 82Z" fill="#fff"/><path d="M52 138C80 128 120 128 148 138" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none" opacity=".7"/></g>`; return stampFrame("jp","JAPAN","ENGLISH EXPLORERS ★ 4",jp,"#C8283C","#2B3F9A") }
function australiaStamp(){ const au=`<g clip-path="url(#auClip)"><path d="M58 98 L64 84 L78 80 L90 70 L98 76 L108 62 L116 70 L126 66 L134 80 L146 88 L150 104 L142 122 L130 132 L118 128 L106 134 L92 130 L78 136 L66 124 L58 112Z" fill="#E2742B"/><path d="M62 112 C80 118 110 112 146 112" fill="none" stroke="#B5481E" stroke-width="2.4" opacity=".6"/><path d="M92 112 C94 102 108 102 110 112Z" fill="#B5481E"/><ellipse cx="128" cy="146" rx="9" ry="5" fill="#E2742B"/><circle cx="78" cy="68" r="8" fill="#FFC531"/></g>`; return stampFrame("au","AUSTRALIA","ENGLISH EXPLORERS ★ 5",au,"#0B6B3A","#C98A00") }const STAMPS=[ukStamp,nyStamp,africaStamp,japanStamp,australiaStamp];

SC.passport=()=>`<section class="screen" id="s-passport"><div class="bg"></div>
  <div class="pp-wrap"><h1 class="pp-title">Passport</h1><div class="pp-book" id="ppBook"><div class="pp-head"><span class="face">${face("emma")}</span><span>EMMA &amp; MAX &middot; PASSPORT</span><span class="face">${face("max")}</span></div>
   <div class="pp-grid">${PASS_NAMES.map((n,i)=>`<div class="pp-slot ${i<4?"pre done":""}" id="ppSlot${i}"><div class="pp-circle"><span class="q">?</span><span class="pp-ring"></span><div class="pp-stamp">${STAMPS[i]()}</div></div><div class="pp-name" id="ppName${i}">${i<4?n:"?"}</div><div class="pp-num">Destination ${i+1}</div></div>`).join("")}</div></div>
   <p class="pp-msg" id="ppMsg">Emma and Max are ready to travel!</p>
   <div class="row" id="ppBtns" hidden><button class="btn green" data-act="map">${UI_I.map} Back to the map</button><button class="btn gold" data-act="home">${UI_I.replay} Home</button></div></div></section>`;
function runPassport(){
  setTimeout(()=>{ if($("#ppSlot4"))speak("emma","Congratulations! Here is your passport.") },300);
  setTimeout(()=>{ const slot=$("#ppSlot4"); if(!slot)return; slot.classList.add("stamped","done");
    setTimeout(()=>{ if(!$("#ppBook"))return; UI.stamp(); const b=$("#ppBook"); b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake"); confetti(); const nm=$("#ppName4"); nm.textContent=PASS_NAMES[4]; nm.classList.add("new") },520);
    setTimeout(()=>{ if(!$("#ppMsg"))return; P.australiaStamp=true; save(); UI.win(); $("#ppMsg").textContent="All five stamps collected! You are a true English Explorer!"; speak("emma","You collected all five stamps! You are a true English Explorer!"); $("#ppBtns").hidden=false },1800) },900) }

let W_=null, SI=0, SK_=null;
function openStory(k){ SK_=k; SI=0; show("story",{k}); storyLine(); }
function storyLine(){ const S=STORY[SK_],[who,text,expr]=S.lines[SI];
  $$(".cast .ch").forEach(c=>{const me=c.dataset.who===who;c.classList.toggle("talk",me);c.classList.toggle("dim",!me);if(me)c.innerHTML=PEOPLE[who](expr||"happy","idle")});
  say(who,text,expr||"happy"); const b=$("[data-act=snext]"); if(b)b.innerHTML=(SI===S.lines.length-1?"Let's go!":"Next")+" "+UI_I.next; }
function afterStory(){ if(SK_==="intro"){P.intro=true;save();show("map")} else {P.seen[SK_]=1;save();W_=SK_;show("world",W_)} }
function resetGame(){ P.stars={p1:[0,0],p2:[0,0],p3:[0,0],p4:[0,0],p5:[0,0]}; P.seen={}; P.resume=null; P.intro=false; save(); show("start"); }
$app.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b||b.disabled)return; const a=b.dataset.act; ac();
  switch(a){
    case "sound": P.muted=!P.muted; save(); if(P.muted)hush(); $$('[data-act="sound"]').forEach(x=>x.innerHTML=P.muted?UI_I.mute:UI_I.sound); toast(P.muted?"Sound off":"Sound on"); break;
    case "start": UI.tap(); if(!P.intro)openStory("intro"); else { show("map"); setTimeout(()=>speak("kylie","Choose a place!"),400) } break;
    case "reset": if(b.dataset.arm){resetGame()} else { b.dataset.arm="1"; b.textContent="Tap again to erase"; setTimeout(()=>{if(b.isConnected){b.dataset.arm="";b.textContent="New game"}},3200) } break;
    case "home": show("start"); break;
    case "passport": UI.tap(); show("passport"); runPassport(); break;
    case "map": show("map"); break;
    case "phase": { const p=b.dataset.p,i=PH.indexOf(p); if(!phaseOpen(i)){toast("Win a star in the last phase first.");UI.no();break} UI.tap(); W_=p; if(!P.seen[p]&&STORY[p])openStory(p); else show("world",p) } break;
    case "world": W_=b.dataset.p||W_; show("world",W_); break;
    case "story": openStory(W_); break;
    case "snext": UI.tap(); if(SI<STORY[SK_].lines.length-1){SI++;storyLine()} else afterStory(); break;
    case "skip": afterStory(); break;
    case "level": { const c=+b.dataset.c,p=W_||(G&&G.p); if(!chOpen(p,c)){toast("Win the first star first.");UI.no();break} UI.tap(); W_=p; startRun(p,c) } break;
    case "again": startRun(G.p,G.c); break;
    case "rep": replay(); break;
    case "say": { const tile=b.closest(".ctile"); speak(VOICE_OF[b.dataset.who],b.dataset.say,null,tile?[tile.querySelector(".cf")]:undefined) } break;
    case "cl": if(G&&G.cl)G.cl(+b.dataset.k,b); break;
    case "gc": if(G&&G.gc)G.gc(b.dataset.c); break;
    case "gundo": if(G&&G.gundo)G.gundo(); break;
    case "gclr": if(G&&G.gclr)G.gclr(); break;
    case "ggo": if(G&&G.ggo)G.ggo(); break;
    case "gdemo": if(G&&G.gdemo)G.gdemo(); break;
    case "chip": if(G&&G.chip)G.chip(b.dataset.w); break;
    case "hs": if(G&&G.hs)G.hs(b); break;
    case "fi": if(G&&G.fi)G.fi(b.dataset.id); break;
    case "srv": if(G&&G.srv)G.srv(); break;
    case "pk": if(G&&G.pk)G.pk(); break;
    case "bc": if(G&&G.bc)G.bc(b.dataset.id,b); break;
    case "wsc": if(G&&G.wsc)G.wsc(+b.dataset.r,+b.dataset.c,b); break;
    case "bn": if(G&&G.bn)G.bn(); break;
    case "bi": if(G&&G.bi)G.bi(b.dataset.id); break;
    case "chk": if(G&&G.chk)G.chk(); break;
    case "tsub": if(G&&G.sub)G.sub(); break;
    case "nx": clearTimeout(TMR); next(); break;
  }
});
document.addEventListener("pointerdown",e=>{window.LASTDOWN=e.target},true);
document.addEventListener("keydown",e=>{ if(e.key==="Enter"&&(e.target.id==="wi"||/^iv\d$/.test(e.target.id))&&G&&G.sub){e.preventDefault();G.sub();return}
  if(G&&G.ck&&(e.key==="ArrowLeft"||e.key==="ArrowRight")){e.preventDefault();G.ck(e.key==="ArrowLeft"?-1:1);return}
  if(G&&G.gc&&!(e.target.matches&&e.target.matches("input"))&&(e.key==="ArrowUp"||e.key==="ArrowLeft"||e.key==="ArrowRight")){e.preventDefault();G.gc(e.key==="ArrowUp"?"S":e.key==="ArrowLeft"?"L":"R");return} if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches(".say")){e.preventDefault();replay()} });
$("#defs defs").innerHTML=DEFS.join("");
/* --sc = how many pixels one unit of the 800 x 480 scene drawings is (the pictures fill the screen and are cut at the sides) */
function fitScene(){const r=$app.getBoundingClientRect();$app.style.setProperty("--sc",Math.max((r.width||innerWidth)/800,(r.height||innerHeight)/480).toFixed(4))}
addEventListener("resize",fitScene);fitScene();
show("start");
