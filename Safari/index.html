<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>African Safari Animal Explorers</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: one full-screen scene at a time. Savanna palette, rounded type, big pill buttons. Single look by choice (a game world), so all colours are explicit. */
:root{
  --sun:#FFB627; --sunset:#D9480F; --acacia:#2F8F4E; --sky:#8FD3F4; --cream:#FFF4D6; --ink:#3A2415; --outline:#4B2E1E;
  --berry:#D8457A; --lilac:#9B7BDB; --good:#2E9E4F; --bad:#C0392B;
  --display:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",ui-rounded,system-ui,sans-serif;
  --body:"Nunito","Trebuchet MS",ui-rounded,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:#F7C873;color:var(--ink);font-family:var(--body);font-weight:600}
button,input{font-family:inherit}
#app{position:relative;height:100%;width:100%;overflow:hidden;background:#F7C873}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:fadein .45s ease both}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
:focus-visible{outline:4px solid #fff;outline-offset:3px;box-shadow:0 0 0 7px var(--sunset)}

/* buttons */
.btn{appearance:none;border:3px solid var(--outline);border-radius:999px;font-family:var(--display);font-weight:800;font-size:clamp(20px,3.4vw,28px);line-height:1;padding:14px 30px;min-height:58px;cursor:pointer;color:#fff;background:var(--sunset);box-shadow:0 6px 0 var(--outline);transition:transform .1s,box-shadow .1s;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--outline)}
.btn{white-space:nowrap}
.btn svg{width:24px;height:24px;flex:none}
.btn.alt{background:var(--sun);color:var(--ink)}
.btn.green{background:var(--acacia)}
.btn.ghost{background:var(--cream);color:var(--ink)}
.btn.small{font-size:18px;min-height:46px;padding:9px 20px;box-shadow:0 4px 0 var(--outline)}
.btn[disabled]{opacity:.55;cursor:default}
.iconbtn{width:52px;height:52px;padding:0;border-radius:50%;min-height:0;font-size:0}
.iconbtn svg{width:26px;height:26px}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center}

/* HUD */
.hud{display:flex;align-items:center;gap:10px;padding-block:max(10px,env(safe-area-inset-top,0px)) 8px;min-height:68px}
.hud .mid{flex:1;min-width:0;text-align:center}
.hud .ttl{font-family:var(--display);font-weight:800;font-size:clamp(17px,3vw,24px);line-height:1.05;color:var(--ink);text-shadow:0 2px 0 rgba(255,255,255,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar{height:14px;border-radius:99px;background:rgba(58,36,21,.25);border:2.5px solid var(--outline);overflow:hidden;margin-top:5px;max-width:340px;margin-inline:auto}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(#7BE06D,#2E9E4F);border-radius:99px;transition:width .6s cubic-bezier(.3,1.4,.5,1)}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--cream);border:3px solid var(--outline);border-radius:99px;padding:6px 14px;font-family:var(--display);font-weight:800;font-size:20px;box-shadow:0 3px 0 var(--outline);height:46px}
.pill svg{width:22px;height:22px}

/* start screen */
#s-start{align-items:center;justify-content:space-between;padding-block:max(18px,env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-bottom,0px));text-align:center}
.bgfill{position:absolute;inset:0;z-index:-1}
.bgfill svg{width:100%;height:100%;display:block}
.title{margin:0;font-family:var(--display);font-weight:800;line-height:.9;color:#FFE08A;font-size:clamp(46px,10.5vw,112px);-webkit-text-stroke:10px var(--outline);paint-order:stroke fill;text-shadow:0 8px 0 var(--outline);letter-spacing:1px}
.ribbon{display:inline-block;margin-top:14px;background:var(--sunset);color:#fff;font-family:var(--display);font-weight:800;font-size:clamp(20px,4vw,38px);padding:6px 30px 8px;border:4px solid var(--outline);border-radius:14px;box-shadow:0 6px 0 var(--outline);transform:rotate(-2deg)}
.heroes{display:flex;align-items:flex-end;justify-content:center;gap:clamp(0px,3vw,40px);height:clamp(190px,38vh,400px);margin-block:4px}
.heroes .who{height:100%;aspect-ratio:240/340}
.heroes svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 8px 0 rgba(75,46,30,.18))}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* dialogue */
.bubble{display:flex;align-items:center;gap:12px}
.bubble .av{flex:none;width:clamp(64px,10vw,92px);aspect-ratio:1;border-radius:50%;border:4px solid var(--outline);overflow:hidden;background:#BFE8F7;box-shadow:0 4px 0 var(--outline)}
.bubble .av svg{width:100%;height:100%;display:block}
.bubble .txt{position:relative;flex:1;min-width:0;background:var(--cream);border:4px solid var(--outline);border-radius:22px;padding:12px 18px;font-size:clamp(17px,2.6vw,24px);font-weight:800;line-height:1.25;box-shadow:0 5px 0 var(--outline);cursor:pointer}
.bubble .txt::before{content:"";position:absolute;left:-14px;top:50%;width:22px;height:22px;background:var(--cream);border-left:4px solid var(--outline);border-bottom:4px solid var(--outline);transform:translateY(-50%) rotate(45deg)}
.bubble .name{display:block;font-family:var(--display);font-size:.8em;color:var(--sunset);line-height:1}
.bubble .txt.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.92)}to{transform:none}}

/* intro / map / mode */
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding-block:14px;min-height:0}
#s-intro .big{height:min(52vh,420px);aspect-ratio:240/340}
#s-intro .big svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 8px 0 rgba(75,46,30,.18))}
.mapwrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}
.mapbox{position:relative;width:min(100%,calc((100dvh - 190px)*1.6667));aspect-ratio:5/3;border:5px solid var(--outline);border-radius:26px;overflow:hidden;box-shadow:0 8px 0 var(--outline);background:#9DD067}
.mapbox svg.m{position:absolute;inset:0;width:100%;height:100%}
.mapbox .port{display:none}
@media (max-aspect-ratio:1/1){.mapbox{aspect-ratio:3/4;width:min(100%,calc((100dvh - 190px)*.75))}.mapbox .land{display:none}.mapbox .port{display:block}}
.stop{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;cursor:pointer;width:34%}
.stop .disc{width:clamp(66px,12vw,104px);aspect-ratio:1;border-radius:50%;border:5px solid var(--outline);background:var(--sun);display:grid;place-items:center;box-shadow:0 6px 0 var(--outline);position:relative}
.stop:not(.locked) .disc{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.stop .disc svg{width:56%;height:56%}
.stop.locked .disc{background:#B9A98F;animation:none}
.stop .lbl{font-family:var(--display);font-weight:800;font-size:clamp(14px,2.2vw,22px);line-height:1;background:var(--cream);border:3px solid var(--outline);border-radius:12px;padding:4px 10px;white-space:nowrap}
.stop .stars{display:flex;gap:2px}
.stop .stars svg{width:20px;height:20px}
.lockic{position:absolute;right:-8px;bottom:-8px;width:36px;height:36px;border-radius:50%;background:var(--cream);border:3px solid var(--outline);display:grid;place-items:center}
.lockic svg{width:20px;height:20px}
:root{--p1x:16%;--p1y:56%;--p2x:50%;--p2y:28%;--p3x:84%;--p3y:52%}
@media (max-aspect-ratio:1/1){:root{--p1x:30%;--p1y:68%;--p2x:68%;--p2y:46%;--p3x:34%;--p3y:21%}.stop{width:44%}}
.mapbubble{position:absolute;left:12px;right:12px;bottom:12px;z-index:5}
.mapbubble .bubble .txt{font-size:clamp(15px,2.2vw,21px);padding:9px 14px}
.mapbubble .bubble .av{width:clamp(52px,8vw,74px)}

.modes{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;width:100%;max-width:820px}
.mode{flex:1 1 260px;max-width:380px;background:var(--cream);border:5px solid var(--outline);border-radius:28px;padding:20px 20px 24px;text-align:center;cursor:pointer;box-shadow:0 8px 0 var(--outline);transition:transform .12s;font:inherit;color:var(--ink)}
.mode:hover{transform:translateY(-4px) rotate(-.6deg)}
.mode h3{margin:6px 0 4px;font-family:var(--display);font-weight:800;font-size:34px;line-height:1}
.mode p{margin:0;font-size:18px;font-weight:700}
.mode .stars{display:flex;justify-content:center;gap:4px;margin-top:10px}
.mode .stars svg{width:26px;height:26px}
.mode.easy h3{color:var(--acacia)}.mode.hard h3{color:var(--sunset)}
h1.h,h2.h{font-family:var(--display);font-weight:800;margin:0;text-align:center;color:var(--ink);text-shadow:0 3px 0 rgba(255,255,255,.55);font-size:clamp(30px,6vw,52px);line-height:1}

/* play */
#s-play{gap:8px;padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}
.stagewrap{flex:1;min-height:0;display:flex;justify-content:center;align-items:center}
.stage{isolation:isolate;position:relative;width:min(100%,calc((100dvh - 214px)*1.6667));aspect-ratio:5/3;border:5px solid var(--outline);border-radius:26px;overflow:hidden;box-shadow:0 8px 0 var(--outline);background:var(--sky)}
@media (max-aspect-ratio:1/1){.stage{aspect-ratio:1/1;width:100%}}
.stage>svg{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.critter{position:absolute;transform:translate(-50%,-100%);background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
.critter .art{display:block;animation:idle 3.2s ease-in-out infinite;transform-origin:50% 100%}
.critter:nth-of-type(2n) .art{animation-delay:-1.4s}
@keyframes idle{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975)}}
.critter svg{width:100%;height:auto;display:block;filter:drop-shadow(0 4px 0 rgba(75,46,30,.16))}
.critter:hover .art{transform:scale(1.07);animation:none}
.mark{position:absolute;left:50%;top:-4%;transform:translateX(-50%);width:clamp(30px,5.4vw,52px);aspect-ratio:1;border-radius:50%;background:var(--sun);border:4px solid var(--outline);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:clamp(20px,3.6vw,34px);color:var(--ink);z-index:2;animation:hop 1.2s ease-in-out infinite;box-shadow:0 3px 0 var(--outline)}
@keyframes hop{50%{transform:translate(-50%,-9px)}}
.critter.found .mark{background:#7BE06D;animation:none}
.critter.found .mark{font-size:0}
.critter.found .mark::after{content:"";width:46%;height:26%;border-left:5px solid var(--outline);border-bottom:5px solid var(--outline);transform:rotate(-45deg) translate(1px,-2px)}
.critter.found{cursor:default}

/* question overlay */
.ov{position:absolute;inset:0;z-index:30;background:rgba(58,36,21,.72);display:flex;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top,0px)) 12px max(12px,env(safe-area-inset-bottom,0px));animation:fadein .25s both;overflow:auto}
.qcard{width:min(900px,100%);max-height:100%;background:var(--cream);border:5px solid var(--outline);border-radius:30px;box-shadow:0 10px 0 var(--outline);padding:18px;display:flex;gap:20px;align-items:center;position:relative;overflow:auto}
.photo{flex:0 0 clamp(150px,34%,300px);background:#fff;padding:12px 12px 30px;border:3px solid var(--outline);border-radius:10px;transform:rotate(-3deg);box-shadow:0 6px 0 rgba(75,46,30,.35);animation:snap .5s cubic-bezier(.3,1.5,.5,1) both}
@keyframes snap{from{transform:rotate(-9deg) scale(.6);opacity:0}to{transform:rotate(-3deg)}}
.photo .frame{background:linear-gradient(#9ADAF5,#E9F5B6 70%,#9DCB5A 70%);border:3px solid var(--outline);border-radius:6px;aspect-ratio:1}
.photo svg{width:100%;height:100%;display:block}
.qside{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.qside h2{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(26px,4.6vw,40px);line-height:1}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{font-family:var(--display);font-weight:800;font-size:clamp(22px,3.8vw,32px);min-height:64px;border-radius:20px;border:4px solid var(--outline);background:#fff;color:var(--ink);cursor:pointer;box-shadow:0 5px 0 var(--outline);transition:transform .1s}
.opt:hover:not([disabled]){transform:translateY(-2px);background:#FFF0B8}
.opt:active:not([disabled]){transform:translateY(4px);box-shadow:0 1px 0 var(--outline)}
.opt[disabled]{opacity:.4;cursor:default;text-decoration:line-through}
.opt.right{background:#9BE58B;opacity:1;text-decoration:none;animation:pop .4s}
.typing{display:flex;flex-direction:column;gap:10px}
.typing input{width:100%;font-family:var(--display);font-weight:800;font-size:clamp(28px,5vw,40px);text-align:center;border:4px solid var(--outline);border-radius:20px;padding:10px 12px;background:#fff;color:var(--ink);text-transform:lowercase}
.slots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.slots span{width:clamp(28px,5vw,40px);height:clamp(34px,6vw,46px);border-bottom:5px solid var(--outline);font-family:var(--display);font-weight:800;font-size:clamp(24px,4vw,32px);display:grid;place-items:end center;text-transform:uppercase;line-height:1.1}
.slots span.ghost{color:#C9A66B}
.fbrow{display:flex;align-items:center;gap:10px;min-height:56px}
.fbrow .av{flex:none;width:52px;height:52px;border-radius:50%;border:3px solid var(--outline);overflow:hidden;background:#BFE8F7}
.fbrow .av svg{width:100%;height:100%;display:block}
.fbrow .t{font-weight:800;font-size:clamp(16px,2.4vw,21px);line-height:1.2}
.fbrow .t.ok{color:#1F7A3A}.fbrow .t.no{color:#A8321F}
.flash{position:absolute;inset:0;background:#fff;pointer-events:none;animation:flash .6s ease-out both;z-index:50}
@keyframes flash{from{opacity:.95}to{opacity:0}}
.burst{position:absolute;right:14px;top:6px;display:flex;gap:2px;animation:pop .5s}
.burst svg{width:48px;height:48px}
@media (max-width:640px),(max-aspect-ratio:1/1){.qcard{flex-direction:column;gap:12px;padding:14px}.photo{flex:none;width:min(46%,200px)}}
@media (max-height:520px) and (orientation:landscape){.photo{flex-basis:26%}.opt{min-height:50px}.fbrow{min-height:40px}.qcard{padding:12px;gap:14px}}

/* results */
#s-results>.bgfill+*{margin-top:auto}#s-results>:last-child{margin-bottom:auto}
#s-results{align-items:center;text-align:center;gap:14px;padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));overflow:auto}
.bigstars{display:flex;gap:8px;justify-content:center}
.bigstars svg{width:clamp(60px,14vw,100px);height:clamp(60px,14vw,100px);animation:starin .6s cubic-bezier(.3,1.6,.5,1) both}
.bigstars svg:nth-child(2){animation-delay:.25s}.bigstars svg:nth-child(3){animation-delay:.5s}
@keyframes starin{from{transform:scale(0) rotate(-120deg)}to{transform:none}}
.score{font-family:var(--display);font-weight:800;font-size:clamp(26px,5vw,40px)}
.badge{display:flex;align-items:center;gap:12px;background:var(--cream);border:4px solid var(--outline);border-radius:22px;padding:10px 18px;box-shadow:0 5px 0 var(--outline);font-family:var(--display);font-weight:800;font-size:clamp(18px,3vw,26px);text-align:left;animation:pop .6s .8s both}
.badge svg{width:56px;height:56px;flex:none}
.rhero{display:flex;gap:10px;justify-content:center;height:clamp(120px,24vh,230px)}
.rhero .w{height:100%;aspect-ratio:240/340}
.rhero svg{width:100%;height:100%;overflow:visible}

/* journal */
#s-journal{padding-bottom:max(14px,env(safe-area-inset-bottom,0px))}
.jscroll{flex:1;overflow:auto;padding:6px 4px 20px;min-height:0}
.jgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:16px;max-width:1100px;margin:0 auto}
.jcard{background:var(--cream);border:4px solid var(--outline);border-radius:24px;box-shadow:0 6px 0 var(--outline);padding:10px 12px 14px;text-align:center;position:relative}
.jcard .pic{background:linear-gradient(#A8DFF5,#E9F5B6 68%,#9DCB5A 68%);border:3px solid var(--outline);border-radius:14px;aspect-ratio:1}
.jcard .pic svg{width:100%;height:100%;display:block}
.jcard h3{margin:8px 0 8px;font-family:var(--display);font-weight:800;font-size:30px;line-height:1}
.jcard .row{gap:8px}
.jcard .got{position:absolute;top:6px;right:6px}
.jcard .got svg{width:34px;height:34px}

/* phases 2 and 3 + shared activity pieces */
[hidden]{display:none!important}
#s-play.compact>.bubble{display:none}
.qwrap .vis .pcard{width:clamp(90px,15vw,150px)}
.area{flex:1;min-height:0;overflow:auto;display:flex;justify-content:center;padding:4px 2px 12px}
.area .stagewrap{width:100%}
.qwrap{width:min(960px,100%);display:flex;flex-direction:column;align-items:center;gap:12px;margin:auto 0}
.qprompt{font-family:var(--display);font-weight:800;font-size:clamp(23px,4.2vw,38px);line-height:1.12;text-align:center;background:var(--cream);border:4px solid var(--outline);border-radius:22px;padding:10px 20px;box-shadow:0 5px 0 var(--outline)}
.blank{display:inline-block;min-width:2.2em;border-bottom:4px solid var(--sunset);color:transparent;line-height:.8}
.vis,.picrow,.picopts{display:flex;gap:clamp(8px,2vw,18px);justify-content:center;align-items:flex-end;flex-wrap:wrap;width:100%}
.pcard{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--cream);border:4px solid var(--outline);border-radius:20px;padding:8px 8px 10px;box-shadow:0 5px 0 var(--outline);font:inherit;color:var(--ink);transition:transform .1s;width:clamp(96px,17vw,168px)}
button.pcard{cursor:pointer}
button.pcard:hover:not([disabled]){transform:translateY(-3px)}
.pcard.right{background:#9BE58B;animation:pop .4s}
.pcard.wrongopt,.opt.wrongopt{opacity:.4}
.pbox{display:flex;align-items:flex-end;justify-content:center;width:100%;aspect-ratio:1;border-radius:12px;background:linear-gradient(#A8DFF5,#E9F5B6 68%,#9DCB5A 68%);overflow:hidden}
.pimg{display:block;aspect-ratio:1;max-width:100%;transition:height .3s}
.pimg svg{width:100%;height:100%;display:block}
.pname{font-family:var(--display);font-weight:800;font-size:clamp(18px,3vw,26px);line-height:1}
.num{position:absolute;top:-12px;right:-10px;width:40px;height:40px;border-radius:50%;background:var(--sunset);color:#fff;font-family:var(--display);font-weight:800;font-size:24px;display:grid;place-items:center;border:3px solid var(--outline);animation:pop .3s}
.facts{display:flex;flex-direction:column;gap:6px;width:100%;max-width:660px}
.fact{background:#FFF9E6;border:3px dashed var(--sun);border-radius:14px;padding:6px 12px;font-size:clamp(15px,2.2vw,19px);font-weight:800}
.fact b{color:var(--sunset)}
.qwrap .opts{max-width:680px;width:100%}
.qwrap .fbrow{width:100%;max-width:680px;background:rgba(255,244,214,.92);border:3px solid var(--outline);border-radius:16px;padding:6px 12px}
.evid{width:100%;max-width:560px;background:var(--cream);border:3px solid var(--outline);border-radius:16px;padding:8px 14px}
.evid h4{margin:0 0 4px;font-family:var(--display);font-size:20px}
.meter{display:flex;align-items:center;gap:10px;font-weight:800;margin:3px 0}
.meter span{flex:0 0 96px}
.meter i{flex:1;height:16px;border-radius:99px;background:rgba(58,36,21,.15);position:relative;overflow:hidden}
.meter i::after{content:"";position:absolute;inset:0;width:var(--w);background:linear-gradient(#FFD25A,#F2692D);border-radius:99px;animation:grow .8s ease-out}
@keyframes grow{from{width:0}}
.tiles{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;min-height:56px}
.tile{font-family:var(--display);font-weight:800;font-size:clamp(20px,3.4vw,28px);padding:8px 16px;min-height:50px;border-radius:14px;border:4px solid var(--outline);background:#fff;cursor:grab;box-shadow:0 4px 0 var(--outline);touch-action:none;user-select:none;color:var(--ink)}
.tile.sel{background:#FFE08A;transform:translateY(-3px)}

function comp(a){ if(a==="dangerous")return"more dangerous"; if(/y$/.test(a))return a.slice(0,-1)+"ier"; if(/e$/.test(a))return a+"r"; if(a.length<=4&&/^[^aeiou]*[aeiou][^aeiouwxy]$/.test(a))return a+a.slice(-1)+"er"; return a+"er" }

/* drag and drop: pointer events, plus tap-to-select fallback handled by the callbacks */
function dragify(root,itemSel,targetSel,drop,click){
  root.addEventListener("pointerdown",e=>{ const it=e.target.closest(itemSel); if(!it||it.disabled||e.button>0)return; e.preventDefault();
    const sx=e.clientX,sy=e.clientY,r=it.getBoundingClientRect(),ox=e.clientX-r.left,oy=e.clientY-r.top; let ghost=null,moved=false,hot=null;
    const mv=ev=>{ if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>7){moved=true;ghost=it.cloneNode(true);ghost.classList.add("ghost");ghost.style.width=r.width+"px";document.body.appendChild(ghost);it.classList.add("lifted")}
      if(moved){ ghost.style.left=ev.clientX-ox+"px";ghost.style.top=ev.clientY-oy+"px"; const t=document.elementFromPoint(ev.clientX,ev.clientY); const tg=t&&t.closest(targetSel); if(hot&&hot!==tg)hot.classList.remove("hot"); if(tg){tg.classList.add("hot");hot=tg} } };
    const end=ev=>{ window.removeEventListener("pointermove",mv); window.removeEventListener("pointerup",end); window.removeEventListener("pointercancel",end); if(hot)hot.classList.remove("hot");
      if(moved){ ghost.remove(); it.classList.remove("lifted"); if(ev.type==="pointerup"){ const t=document.elementFromPoint(ev.clientX,ev.clientY),tg=t&&t.closest(targetSel); if(tg)drop(it,tg) } } else if(ev.type==="pointerup"&&click)click(it) };
    window.addEventListener("pointermove",mv); window.addEventListener("pointerup",end); window.addEventListener("pointercancel",end); });
  root.addEventListener("keydown",e=>{ if(e.key!=="Enter"&&e.key!==" ")return; const it=e.target.closest(itemSel); if(it&&click){e.preventDefault();click(it)} });
}

function runQs(list,next){ let i=0; const go=()=>{ if(i>=list.length)return next(); askMCQ(list[i++],go) }; go() }
function askMCQ(q,next){ G.q={q,wrong:0,done:false,next}; G.spk=1-G.spk;
  const opts=q.options.map((o,i)=>q.pics?pic(o.id,{adj:o.adj,name:!q.hideNames,tag:"button",cls:"popt",attrs:`data-act="mopt" data-i="${i}"`}):`<button class="opt" data-act="mopt" data-i="${i}">${o.label}</button>`).join("");
  $("#area").innerHTML=`<div class="qwrap"><div class="qprompt">${q.prompt}</div>${q.visual||""}<div class="${q.pics?"picopts":"opts"}">${opts}</div>${fbRow(q.start||"")}<div id="evid" style="width:100%;display:flex;justify-content:center"></div><div class="row" id="nextrow" hidden><button class="btn green" data-act="qnext">Next</button></div></div>`;
  say(G.spk?"max":"emma",q.say||q.prompt.replace(/<[^>]+>/g,""));
}
function mAnswer(i,btn){ const S=G.q; if(!S||S.done)return; const o=S.q.options[i], el=$("#area");
  const reveal=()=>{ el.querySelectorAll("[data-act=mopt]").forEach((b,j)=>{ b.disabled=true; if(S.q.options[j].correct)b.classList.add("right") }); $("#evid").innerHTML=S.q.adj?evidence(S.q.ids,S.q.adj):""; $("#nextrow").hidden=false; };
  if(o.correct){ S.done=true; const pts=award(S.wrong+1); UI.ok(); reveal(); fb(`${rnd(PRAISE)} ${S.q.ok} +${pts}`,"ok","cheer"); if(S.q.sound)setTimeout(()=>playAnimal(S.q.sound),900) }
  else { S.wrong++; btn.disabled=true; btn.classList.add("wrongopt"); UI.no(); const maxW=Math.min(2,S.q.options.length-1);
    if(S.wrong>=maxW){ S.done=true; miss(); reveal(); fb(`The answer is: ${S.q.ok} Let's remember it!`,"no","soft") } else fb(`${TRY[S.wrong-1]} Hint: ${S.q.hint}`,"no","oops") } }

const SCENES=[
 {id:"lookout",name:"Lookout Hill",animals:[{id:"elephant",x:22,y:80,w:31},{id:"giraffe",x:53,y:70,w:29},{id:"lion",x:82,y:84,w:25}]},
 {id:"water",name:"Watering Hole",animals:[{id:"duck",x:24,y:84,w:23},{id:"horse",x:54,y:70,w:30},{id:"tiger",x:83,y:85,w:27}]},
 {id:"farm",name:"Farm Corner",animals:[{id:"cow",x:32,y:84,w:34},{id:"chicken",x:72,y:84,w:26}]},
 {id:"camp",name:"Ranger Camp",animals:[{id:"dog",x:30,y:84,w:28},{id:"cat",x:68,y:84,w:24}]}];
function lev1(a,b){ if(a===b)return true; if(Math.abs(a.length-b.length)>1)return false; let i=0;while(i<a.length&&i<b.length&&a[i]===b[i])i++; if(a.length===b.length)return a.slice(i+1)===b.slice(i+1); return a.length>b.length?a.slice(i+1)===b.slice(i):b.slice(i+1)===a.slice(i)}
function snap(next){ G.sc=0; G.found=new Set(); G.snapNext=next; G.busy=false; renderScene() }
function renderScene(){ const sc=SCENES[G.sc]; G.found=new Set(); G.busy=false;
  $("#area").innerHTML=`<div class="stagewrap"><div class="stage" id="stage">${bgSVG(sc.id)}${sc.animals.map(a=>`<button class="critter" data-act="critter" data-id="${a.id}" style="left:${a.x}%;top:${a.y}%;width:${a.w}%;z-index:${Math.round(a.y)}" aria-label="Mystery animal"><span class="mark">?</span><span class="art">${animalSVG(a.id)}</span></button>`).join("")}${fgSVG(sc.id)}</div></div>`;
  const t=$(".hud .ttl"); if(t)t.textContent=sc.name; G.spk=1-G.spk; say(G.spk?"max":"emma","Look! What animal can you see?") }
function openQ(id){ G.busy=true; G.spk=1-G.spk; G.sq={id,att:0,done:false,reveal:0}; UI.flash();
  const hard=G.mode==="hard",word=NAMES[id],opts=shuffle([id,...shuffle(IDS.filter(x=>x!==id)).slice(0,3)]);
  const el=document.createElement("div"); el.className="ov"; el.id="ov";
  el.innerHTML=`<div class="flash"></div><div class="qcard" role="dialog" aria-label="What animal is this?"><div class="photo"><div class="frame">${animalSVG(id)}</div></div><div class="qside"><h2>What animal is this?</h2>
  ${hard?`<form class="typing" id="tf" autocomplete="off"><div class="slots" id="slots" aria-hidden="true">${word.split("").map((c,i)=>`<span data-i="${i}"></span>`).join("")}</div><input id="ans" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="14" aria-label="Type the animal name" placeholder="Type here"><button class="btn green" type="submit">Check</button></form>`:`<div class="opts">${opts.map(o=>`<button class="opt" data-act="pick" data-v="${o}">${NAMES[o]}</button>`).join("")}</div>`}
  ${fbRow(hard?"Type the English word.":"Pick the English word.")}<div class="row" style="justify-content:flex-start"><button class="btn ghost small" data-act="hear">${ICON.sound} Hear it</button></div></div></div>`;
  $("#s-play").appendChild(el);
  if(hard){ const inp=el.querySelector("#ans"); inp.focus(); inp.addEventListener("input",paintSlots); el.querySelector("#tf").addEventListener("submit",e=>{e.preventDefault();snapAnswer(inp.value)}); paintSlots() } }
function paintSlots(){ const q=G.sq,s=$("#slots"); if(!s)return; const v=($("#ans").value||"").toUpperCase(),w=NAMES[q.id].toUpperCase(); s.querySelectorAll("span").forEach((sp,i)=>{ if(v[i]){sp.textContent=v[i];sp.className=""}else if(i<q.reveal){sp.textContent=w[i];sp.className="ghost"}else{sp.textContent="";sp.className=""} }) }
function snapAnswer(raw,btn){ const q=G.sq; if(!q||q.done)return; const id=q.id,word=lc(id),g=String(raw||"").trim().toLowerCase(); if(!g)return; q.att++;
  if(g===word){ q.done=true; const pts=award(q.att); if(!P.discovered.includes(id)){P.discovered.push(id);save()} UI.ok(); setTimeout(()=>playAnimal(id),350); if(btn)btn.classList.add("right"); document.querySelectorAll(".opt").forEach(b=>b.disabled=true); const a=$("#ans"); if(a)a.disabled=true;
    fb(`${rnd(PRAISE)} It's a ${word}! +${pts}`,"ok","cheer"); const b=document.createElement("div"); b.className="burst"; b.innerHTML=star()+(q.att===1?star()+star():""); $(".qcard").appendChild(b); confetti(); setTimeout(()=>speak(G.spk?"max":"emma",NAMES[id]),1900); setTimeout(closeQ,3000) }
  else { UI.no(); if(btn)btn.disabled=true;
    if(q.att>=3){ q.done=true; miss(); document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(b.dataset.v===id)b.classList.add("right")}); const a=$("#ans"); if(a){a.value=NAMES[id];a.disabled=true;paintSlots()} fb(`It's a ${word}. Let's remember it!`,"no","soft"); setTimeout(()=>playAnimal(id),900); setTimeout(closeQ,3600); return }
    const close=G.mode==="hard"&&lev1(g,word); q.reveal=q.att; fb(`${close?"Almost! Check your spelling.":TRY[q.att-1]} Hint: ${CLUE[id]}`,"no","oops"); if(G.mode==="hard"){paintSlots();const a=$("#ans");a.select();a.focus()} } }
function closeQ(){ const ov=$("#ov"); if(ov)ov.remove(); const id=G.sq.id; G.found.add(id); const c=$(`.critter[data-id="${id}"]`); if(c)c.classList.add("found"); G.busy=false;
  const sc=SCENES[G.sc]; const left=sc.animals.filter(a=>!G.found.has(a.id)).length;
  if(left===0){ G.busy=true; if(G.sc<SCENES.length-1){ const nx=SCENES[G.sc+1].name; setTimeout(()=>{say(G.spk?"emma":"max",`Great! Let's go to ${nx}!`,"cheer");UI.win()},300); setTimeout(()=>{G.sc++;renderScene()},3000) } else setTimeout(G.snapNext,900) }
  else say(G.spk?"emma":"max",left===1?"One more animal to find!":"Look! Tap another animal.") }

function tags(next){ const ids=shuffle(IDS),groups=[ids.slice(0,4),ids.slice(4,7),ids.slice(7)]; let gi=0;
  const round=()=>{ if(gi>=groups.length)return next(); const g=groups[gi++]; G.spk=1-G.spk; G.tg={left:g.length,wrong:{},sel:null};
    $("#area").innerHTML=`<div class="qwrap"><div class="qprompt">Drag each name tag to the right animal.</div><div class="picrow">${g.map(id=>`<div class="tagcol">${pic(id,{name:false})}<div class="dropslot" data-act="slot" data-id="${id}" tabindex="0" aria-label="Place for a name tag"></div></div>`).join("")}</div><div class="tiles" id="tiles">${shuffle(g).map(id=>`<button class="tile" data-id="${id}">${NAMES[id]}</button>`).join("")}</div>${fbRow("Drag, or tap a tag and then tap an animal.")}</div>`;
    const root=$(".qwrap"); G.tgRound=round;
    dragify(root,".tile",".dropslot",(t,s)=>tagDrop(t,s),t=>{ root.querySelectorAll(".tile").forEach(x=>x.classList.remove("sel")); t.classList.add("sel"); G.tg.sel=t }); say(G.spk?"max":"emma","Drag each name tag to the right animal.") };
  round() }
function tagDrop(tile,slot){ if(!tile||slot.classList.contains("ok"))return; const id=tile.dataset.id,target=slot.dataset.id; G.tg.sel=null;
  const fill=(ok)=>{ slot.textContent=NAMES[target]; slot.classList.add("ok"); const t=$(`.tile[data-id="${target}"]`); if(t)t.remove(); G.tg.left--; if(G.tg.left===0){ if(ok)setTimeout(()=>playAnimal(target),300); setTimeout(G.tgRound,2600) } };
  if(id===target){ const pts=award((G.tg.wrong[target]||0)+1); UI.ok(); fb(`${rnd(PRAISE)} It's a ${lc(target)}! +${pts}`,"ok","cheer"); fill(true) }
  else { G.tg.wrong[target]=(G.tg.wrong[target]||0)+1; UI.no(); slot.classList.add("shake"); setTimeout(()=>slot.classList.remove("shake"),420); tile.classList.remove("sel");
    if(G.tg.wrong[target]>=3){ miss(); fb(`This one is a ${lc(target)}. Let's remember it!`,"no","soft"); fill(false) } else fb(`${TRY[G.tg.wrong[target]-1]} Hint: ${CLUE[target]}`,"no","oops") } }
function findAct(next){ const ids=shuffle(IDS).slice(0,6); runQs(ids.map(t=>{ const opts=shuffle([t,...shuffle(IDS.filter(x=>x!==t)).slice(0,3)]); return {prompt:`Find the ${lc(t)}!`,say:`Find the ${lc(t)}!`,pics:true,hideNames:true,options:opts.map(id=>({id,correct:id===t})),ok:`That's the ${lc(t)}!`,hint:CLUE[t],ids:[t],adj:null,sound:t} }),next) }

function lesson2(next){ G.spk=0;
  $("#area").innerHTML=`<div class="qwrap"><div class="qprompt">Adjective Cards</div><div class="acards">${ADJ.map(a=>`<button class="acard" data-act="acard" data-adj="${a}"><span class="pbox"><span class="pimg">${animalSVG(REP[a])}</span></span><b>${a}</b><small>The ${lc(REP[a])} is ${a}.</small></button>`).join("")}</div>
  <div class="qprompt" style="font-size:clamp(20px,3.4vw,30px)">Comparing: two animals</div><div class="rules">${[["tall","taller","Add -er."],["big","bigger","Double the last letter. Then add -er."],["heavy","heavier","Change y to i. Then add -er."],["dangerous","more dangerous","Long word? Use more."]].map(r=>`<div class="rule" data-act="rule" data-say="${r[0]}, ${r[1]}"><b>${r[0]} → ${r[1]}</b>${r[2]}</div>`).join("")}</div>
  <div class="row"><button class="btn" data-act="go">Start!</button></div></div>`; G.go=next; say("emma","Tap a card to hear the word. Then press Start!","cheer") }
const STEP_ADJ=()=>shuffle(ADJ);
function lesson3(next){ G.spk=1;
  $("#area").innerHTML=`<div class="qwrap"><div class="qprompt">The Safari Games!</div><div class="vis">${pic("giraffe",{name:false})}${pic("lion",{name:false})}${pic("elephant",{name:false})}</div><div class="qprompt" style="font-size:clamp(20px,3.4vw,30px)">The winner is the...</div><div class="rules">${[["tall","the tallest","Add -est."],["big","the biggest","Double the last letter. Then add -est."],["heavy","the heaviest","Change y to i. Then add -est."],["dangerous","the most dangerous","Long word? Use the most."]].map(r=>`<div class="rule" data-act="rule" data-say="${r[0]}, ${r[1]}"><b>${r[0]} → ${r[1]}</b>${r[2]}</div>`).join("")}</div>
  <div class="row"><button class="btn" data-act="go">Start!</button></div></div>`; G.go=next; say("max","Who will win? Let's find the champions!","cheer") }
function orderAct(next){ const advs=shuffle(["big","small","fast","slow","heavy","tall","strong"]).slice(0,4); let i=0;
  const go=()=>{ if(i>=advs.length)return next(); const adj=advs[i],n=i<2?3:4; i++; let set=null;
    for(let k=0;k<500&&!set;k++){ const s=shuffle(pool(adj)).slice(0,n).sort((x,y)=>av(y,adj)-av(x,adj)); if(s.every((x,j)=>j===0||av(s[j-1],adj)-av(x,adj)>=2))set=s } if(!set)set=heat(adj,3).set.slice().sort((x,y)=>av(y,adj)-av(x,adj));
    G.spk=1-G.spk; G.od={adj,order:set,tapped:[],wrong:0,done:false,next:go};
    $("#area").innerHTML=`<div class="qwrap"><div class="qprompt">Tap the animals in order. Start with ${sup(adj)}!</div><div class="picopts">${shuffle(set).map(id=>pic(id,{adj,tag:"button",attrs:`data-act="oanim" data-id="${id}"`})).join("")}</div>${fbRow("Tap the first animal.")}<div id="evid" style="width:100%;display:flex;justify-content:center"></div><div class="row" id="nextrow" hidden><button class="btn green" data-act="qnext">Next</button></div></div>`;
    G.q={done:false,next:go,order:true}; say(G.spk?"max":"emma",`Tap the animals in order. Start with ${sup(adj)}!`) }; go() }
function orderTap(btn){ const S=G.od; if(!S||S.done||S.tapped.includes(btn.dataset.id))return; S.tapped.push(btn.dataset.id); btn.insertAdjacentHTML("beforeend",`<span class="num">${S.tapped.length}</span>`); UI.tap();
  if(S.tapped.length<S.order.length){ fb(`${S.tapped.length} done. Who is next?`,"","happy"); return }
  const okk=S.tapped.every((x,i)=>x===S.order[i]); const show=()=>{ $("#area").querySelectorAll("[data-act=oanim]").forEach(b=>b.disabled=true); $("#evid").innerHTML=evidence(S.order,S.adj); $("#nextrow").hidden=false; G.q.done=true };
  if(okk){ S.done=true; const pts=award(S.wrong+1); UI.ok(); show(); fb(`${rnd(PRAISE)} ${ucf(sup(S.adj))} is ${lc(S.order[0])}. +${pts}`,"ok","cheer") }
  else { S.wrong++; UI.no(); if(S.wrong>=2){ S.done=true; miss(); $("#area").querySelectorAll("[data-act=oanim]").forEach(b=>{ b.querySelector(".num").textContent=S.order.indexOf(b.dataset.id)+1 }); show(); fb(`This is the right order. Let's remember it!`,"no","soft") }
    else { fb(`Not quite. Hint: who is ${sup(S.adj)}? Start again!`,"no","oops"); setTimeout(()=>{ S.tapped=[]; $("#area").querySelectorAll(".num").forEach(n=>n.remove()) },900) } } }
function buildAct(next){ const advs=shuffle(ADJ).slice(0,4); let i=0;
  const go=()=>{ if(i>=advs.length)return next(); const adj=advs[i++],p=pair(adj),tokens=["The",lc(p.w),"is",...comp(adj).split(" "),"than","the",lc(p.l)]; G.spk=1-G.spk;
    G.bd={tokens,filled:tokens.map(()=>null),wrong:0,done:false,adj,ids:[p.w,p.l],next:go,ok:`${tokens.join(" ")}.`};
    $("#area").innerHTML=`<div class="qwrap"><div class="qprompt">Build the sentence!</div><div class="vis">${pic(p.w,{adj})}${pic(p.l,{adj})}</div>${factsHTML(adj,[p.w,p.l])}<div class="slotrow" id="slots2">${tokens.map((t,k)=>`<span class="slot" data-i="${k}" data-act="bslot" tabindex="0" aria-label="Word place ${k+1}"></span>`).join("")}</div><div class="tiles" id="tiles">${shuffle(tokens.map((t,k)=>k)).map(k=>`<button class="tile" data-k="${k}" data-w="${tokens[k]}">${tokens[k]}</button>`).join("")}</div>${fbRow(`Which animal is ${comp(adj)}?`)}<div id="evid" style="width:100%;display:flex;justify-content:center"></div><div class="row" id="nextrow" hidden><button class="btn green" data-act="qnext">Next</button></div></div>`;
    G.q={done:false,next:go,order:true}; const root=$(".qwrap");
    dragify(root,".tile",".slot",(t,s)=>bPlace(t,+s.dataset.i),t=>{ const k=G.bd.filled.indexOf(null); if(k>=0)bPlace(t,k) }); say(G.spk?"max":"emma",`Build the sentence! Which animal is ${comp(adj)}?`) }; go() }
function bPlace(tile,k){ const S=G.bd; if(!S||S.done||S.filled[k]||tile.hidden)return; S.filled[k]=tile; tile.hidden=true; const sl=$(`.slot[data-i="${k}"]`); sl.textContent=tile.dataset.w; UI.tap();
  if(S.filled.every(Boolean)){ const okk=S.filled.every((t,j)=>t.dataset.w===S.tokens[j]);
    const fin=()=>{ S.done=true; G.q.done=true; $("#evid").innerHTML=evidence(S.ids,S.adj); $("#nextrow").hidden=false };
    if(okk){ const pts=award(S.wrong+1); UI.ok(); $$(".slot").forEach(x=>x.classList.add("ok")); fin(); fb(`${rnd(PRAISE)} ${S.ok} +${pts}`,"ok","cheer") }
    else { S.wrong++; UI.no(); $$(".slot").forEach(x=>{x.classList.add("shake");setTimeout(()=>x.classList.remove("shake"),420)});
      if(S.wrong>=2){ miss(); S.tokens.forEach((t,j)=>{ $(`.slot[data-i="${j}"]`).textContent=t }); $$(".tile").forEach(x=>x.hidden=true); $$(".slot").forEach(x=>x.classList.add("ok")); fin(); fb(`This is the sentence: ${S.ok} Let's remember it!`,"no","soft") }
      else { fb(`Not quite. Hint: The ___ is ${comp(S.adj)} than the ___. Try again!`,"no","oops"); setTimeout(()=>{ S.filled.fill(null); $$(".slot").forEach(x=>x.textContent=""); $$(".tile").forEach(x=>x.hidden=false) },900) } } } }
const $$=s=>[...document.querySelectorAll(s)];
function bReturn(k){ const S=G.bd; if(!S||S.done||!S.filled[k])return; S.filled[k].hidden=false; S.filled[k]=null; $(`.slot[data-i="${k}"]`).textContent="" }

SC.map=()=>{ const pts1=[[16,56],[50,28],[84,52]],pts2=[[30,68],[68,46],[34,21]];
  const stop=(n,name,icon,locked,st)=>`<button class="stop ${locked?"locked":""}" style="left:var(--p${n}x);top:var(--p${n}y)" data-act="phase" data-n="${n}" aria-label="${name}${locked?" (locked)":""}"><span class="disc">${icon}${locked?`<span class="lockic">${ICON.lock}</span>`:""}</span><span class="lbl">${name}</span>${locked?"":stars3(st)}</button>`;
  const [mw,mt]=mapHelp();
  return `<section class="screen" id="s-map">${bgFill("lookout")}
  <div class="hud"><button class="btn alt iconbtn" data-act="home" aria-label="Home">${ICON.home}</button><div class="mid"><div class="ttl">Safari Map</div></div><span class="pill">${star()}${P.points}</span><button class="btn alt iconbtn" data-act="journal" aria-label="Safari Journal">${ICON.book}</button>${soundBtn()}</div>
  <div class="mapwrap"><div class="mapbox">${mapSVG(1000,600,pts1)}${mapSVG(600,800,pts2)}
   ${stop(1,"Lookout Hill",ICON.bino,false,Math.max(P.stars.easy||0,P.stars.hard||0))}${stop(2,"Comparison Camp",ICON.scale,!P.p1done,P.stars.p2||0)}${stop(3,"Champions' Arena",ICON.cup,!P.p2done,P.stars.p3||0)}
   <div class="mapbubble">${bubbleHTML(mw,mt)}</div></div></div></section>`};
SC.mode=()=>`<section class="screen" id="s-mode">${bgFill("lookout")}
  <div class="hud"><button class="btn alt iconbtn" data-act="map" aria-label="Back to map">${ICON.back}</button><div class="mid"><div class="ttl">Phase 1: Animal Detectives</div></div>${soundBtn()}</div>
  <div class="center"><h2 class="h">Choose your mission</h2><div class="modes">
   <button class="mode easy" data-act="startmode" data-m="easy"><h3>Easy</h3><p>Look at the animal.<br>Pick the right word.</p>${stars3(P.stars.easy||0)}</button>
   <button class="mode hard" data-act="startmode" data-m="hard"><h3>Hard</h3><p>Look at the animal.<br>Type the word.</p>${stars3(P.stars.hard||0)}</button></div></div></section>`;
SC.results=()=>{ const st=G.stars,n=G.n,other=G.mode==="easy"?"hard":"easy";
  const next=n===1?`<button class="btn alt" data-act="startmode" data-m="${other}">Try ${other} mode</button>`:"";
  return `<section class="screen" id="s-results">${bgFill("lookout")}
  <h2 class="h">${PHASE[n].place} complete!</h2><div class="bigstars">${[1,2,3].map(i=>star(i<=st?"#FFC928":"#E9DDB8")).join("")}</div>
  <div class="score">${G.pts} points &middot; ${G.first} of ${G.total} on the first try</div>
  <div class="rhero"><div class="w">${emma("cheer","cheer")}</div><div class="w">${max("cheer","cheer")}</div></div>
  <div class="badge">${BADGE[n]}<span>New badge!<br>${PHASE[n].badge}</span></div>
  <div class="row"><button class="btn" data-act="replay" data-n="${n}" data-m="${G.mode}">Play again</button>${next}<button class="btn green" data-act="map">Back to map</button></div></section>`};
SC.final=()=>`<section class="screen" id="s-results">${bgFill("lookout")}
  <div class="diploma"><h2>Safari Explorer Certificate</h2><p>You learned 10 animals and 10 adjectives. You can compare animals and find the champions!</p><div class="badges">${[1,2,3].map(n=>`<div>${BADGE[n]}${PHASE[n].badge}</div>`).join("")}</div><p>${P.points} points &middot; ${[1,2,3].map(n=>(n===1?Math.max(P.stars.easy||0,P.stars.hard||0):P.stars["p"+n]||0)).reduce((a,b)=>a+b,0)} of 9 stars</p></div>
  <div class="rhero"><div class="w">${emma("cheer","cheer")}</div><div class="w">${max("cheer","cheer")}</div></div>
  <div class="row"><button class="btn" data-act="passport" style="font-size:clamp(22px,4vw,30px)">Get my passport stamp!</button><button class="btn green" data-act="map">Back to map</button><button class="btn alt" data-act="journal">${ICON.book} Safari Journal</button><button class="btn ghost" data-act="home">Home</button></div></section>`;
SC.journal=()=>`<section class="screen" id="s-journal">${bgFill("lookout")}
  <div class="hud"><button class="btn alt iconbtn" data-act="back" aria-label="Back">${ICON.back}</button><div class="mid"><div class="ttl">Safari Journal</div></div><button class="btn alt small" data-act="words">Word Book</button>${soundBtn()}</div>
  <div class="jscroll"><div class="jgrid">${IDS.map(id=>`<div class="jcard">${P.discovered.includes(id)?`<span class="got" title="Photo taken">${star("#7BE06D")}</span>`:""}<div class="pic">${animalSVG(id)}</div><h3>${NAMES[id]}</h3><div class="row"><button class="btn small alt" data-act="say" data-id="${id}">${ICON.sound} Say</button><button class="btn small ghost" data-act="roar" data-id="${id}">Sound</button></div></div>`).join("")}</div></div></section>`;
SC.words=()=>`<section class="screen" id="s-journal">${bgFill("lookout")}
  <div class="hud"><button class="btn alt iconbtn" data-act="journal" aria-label="Back to Safari Journal">${ICON.back}</button><div class="mid"><div class="ttl">Word Book</div></div>${soundBtn()}</div>
  <div class="jscroll"><table class="words"><tr><th>Adjective</th><th>Comparative</th><th>Superlative</th><th></th></tr>${ADJ.map(a=>`<tr><td>${a}</td><td>${comp(a)}</td><td>${sup(a)}</td><td><button class="btn small alt iconbtn" data-act="wsay" data-adj="${a}" aria-label="Hear ${a}">${ICON.sound}</button></td></tr>`).join("")}</table></div></section>`;

/* ====================================================================
   PART 7 - EVENTS
   ==================================================================== */
/* ---------- Passport: 5 destinations. 1 United Kingdom and 2 New York are already stamped, 3 Africa is stamped now, 4 and 5 are a surprise ---------- */
const PASS_NAMES=["United Kingdom","New York","Africa","?","?"];
function stampFrame(id,top,bottom,center,c1,c2){
  return `<svg viewBox="0 0 200 200" aria-hidden="true"><defs><filter id="ink${id}" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3.4"/></filter><clipPath id="${id}Clip"><circle cx="100" cy="100" r="52"/></clipPath><path id="${id}Top" d="M26 100A74 74 0 0 1 174 100"/><path id="${id}Bot" d="M16 100A84 84 0 0 0 184 100"/></defs>
  <g filter="url(#ink${id})" opacity=".92"><circle cx="100" cy="100" r="94" fill="none" stroke="${c1}" stroke-width="6"/><circle cx="100" cy="100" r="86" fill="none" stroke="${c1}" stroke-width="2.4"/><circle cx="100" cy="100" r="58" fill="none" stroke="${c2}" stroke-width="4"/>${center}
  <text font-family="Baloo 2,Trebuchet MS,sans-serif" font-weight="800" font-size="18" letter-spacing="3" fill="${c1}"><textPath href="#${id}Top" startOffset="50%" text-anchor="middle">${top}</textPath></text>
  <text font-family="Baloo 2,Trebuchet MS,sans-serif" font-weight="800" font-size="12.5" letter-spacing="2.2" fill="${c2}"><textPath href="#${id}Bot" startOffset="50%" text-anchor="middle">${bottom}</textPath></text></g></svg>`;
}
function ukStamp(){ const flag=`<g clip-path="url(#ukClip)"><rect x="40" y="40" width="120" height="120" fill="#2B3F9A"/><path d="M40 40L160 160M160 40L40 160" stroke="#fff" stroke-width="18"/><path d="M40 40L160 160M160 40L40 160" stroke="#C8283C" stroke-width="7"/><path d="M100 40V160M40 100H160" stroke="#fff" stroke-width="30"/><path d="M100 40V160M40 100H160" stroke="#C8283C" stroke-width="17"/></g>`; return stampFrame("uk","UNITED KINGDOM","ENGLISH EXPLORERS ★ 1",flag,"#2B3F9A","#C8283C") }
function nyStamp(){ const lib=`<g transform="translate(100 150) scale(.5)" fill="#1F7A6A" stroke="#1F7A6A" stroke-width="3" stroke-linejoin="round"><path d="M-30 0L30 0L24 -40L-24 -40Z" opacity=".55"/><path d="M-16 -40L16 -40L24 -96L10 -140L-10 -140L-24 -96Z"/><circle cx="0" cy="-156" r="14"/><path d="M-12 -164L-28 -178M-6 -168L-14 -188M0 -170L0 -192M6 -168L14 -188M12 -164L28 -178" stroke-width="6" stroke-linecap="round"/><path d="M12 -128C30 -146 36 -180 32 -208" fill="none" stroke-width="14" stroke-linecap="round"/><path d="M32 -208C22 -220 30 -234 34 -240C42 -232 48 -220 40 -208Z" fill="#C8283C" stroke="#C8283C"/></g>`; return stampFrame("ny","NEW YORK","ENGLISH EXPLORERS ★ 2",lib,"#C8283C","#2B3F9A") }
function africaStamp(){ const af=`<g clip-path="url(#afClip)"><path d="M84 56 L104 52 L122 58 L136 64 L146 78 L152 90 L140 94 L134 106 L130 120 L122 138 L112 152 L102 150 L98 134 L96 118 L86 108 L74 108 L64 96 L62 82 L70 68Z" fill="#2F8F4E"/><path d="M120 72 C126 78 126 90 122 98" fill="none" stroke="#1E6B38" stroke-width="3" stroke-linecap="round"/><g transform="translate(96 112) scale(.34)" fill="#7A4E2A"><path d="M-6 0 C-4 -30 -10 -50 -24 -74 L-16 -76 C-6 -60 0 -50 4 -40 C8 -52 16 -64 30 -76 L36 -70 C22 -56 12 -40 10 -20 L12 0Z"/><ellipse cx="2" cy="-84" rx="60" ry="16" fill="#1E6B38"/></g><circle cx="132" cy="70" r="9" fill="#FFC531"/></g>`; return stampFrame("af","AFRICA","ENGLISH EXPLORERS ★ 3",af,"#D9480F","#2F8F4E") }
SC.passport=()=>`<section class="screen" id="s-passport">${bgFill("lookout")}
  <div class="pp-wrap"><h1 class="pp-title">Passport</h1><div class="pp-book" id="ppBook"><div class="pp-head"><span class="face">${bust("emma")}</span><span>EMMA &amp; MAX &middot; PASSPORT</span><span class="face">${bust("max")}</span></div>
   <div class="pp-grid">${PASS_NAMES.map((n,i)=>`<div class="pp-slot ${i<2?"pre done":""}" id="ppSlot${i}"><div class="pp-circle"><span class="q">?</span><span class="pp-ring"></span>${i===0?`<div class="pp-stamp">${ukStamp()}</div>`:i===1?`<div class="pp-stamp">${nyStamp()}</div>`:i===2?`<div class="pp-stamp">${africaStamp()}</div>`:""}</div><div class="pp-name" id="ppName${i}">${i<2?n:"?"}</div><div class="pp-num">Destination ${i+1}</div></div>`).join("")}</div></div>
   <p class="pp-msg" id="ppMsg">Emma and Max are ready to travel!</p>
   <div class="row" id="ppBtns" hidden><button class="btn green" data-act="map">Back to the map</button><button class="btn alt" data-act="final">Back to my certificate</button></div></div></section>`;
function runPassport(){
  setTimeout(()=>{ if($("#ppSlot2"))speak("emma","Congratulations! Here is your passport.") },300);
  setTimeout(()=>{ const slot=$("#ppSlot2"); if(!slot)return; slot.classList.add("stamped","done");
    setTimeout(()=>{ if(!$("#ppBook"))return; UI.stamp(); const b=$("#ppBook"); b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake"); confetti(); const nm=$("#ppName2"); nm.textContent=PASS_NAMES[2]; nm.classList.add("new") },520);
    setTimeout(()=>{ if(!$("#ppMsg"))return; P.africaStamp=true; save(); UI.win(); $("#ppMsg").textContent="Third stamp collected! Where will Emma and Max travel next?"; speak("emma","Where will Emma and Max travel next?"); $("#ppBtns").hidden=false },1800) },900) }

let BACK="start";
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b)return; const a=b.dataset.act; ac();
  switch(a){
    case "play": UI.tap(); if(P.seen){show("map");setTimeout(()=>speak(...mapHelp()),400)} else show("intro",0); break;
    case "nextintro":{ UI.tap(); const i=+b.dataset.i+1; if(i>=INTRO.length){P.seen=true;save();show("map");setTimeout(()=>speak(...mapHelp()),400)} else {show("intro",i);setTimeout(()=>speak(INTRO[i][0],INTRO[i][1]),250)} break}
    case "skipintro": P.seen=true;save();show("map"); break;
    case "home": show("start"); break;
    case "map": UI.tap(); G=null; show("map"); break;
    case "back": show(BACK==="map"?"map":"start"); break;
    case "journal": if(!$("#s-journal"))BACK=$("#s-map")?"map":"start"; UI.tap(); show("journal"); break;
    case "words": UI.tap(); show("words"); break;
    case "passport": UI.tap(); show("passport"); runPassport(); break;
    case "final": UI.tap(); show("final"); break;
    case "wsay": speak("emma",`${b.dataset.adj}, ${comp(b.dataset.adj)}, ${sup(b.dataset.adj)}`); break;
    case "sound": P.muted=!P.muted;save(); if(P.muted){try{speechSynthesis.cancel()}catch(e){}} document.querySelectorAll('[data-act="sound"]').forEach(x=>{x.innerHTML=P.muted?ICON.mute:ICON.sound;x.setAttribute("aria-label",P.muted?"Sound off. Turn sound on":"Sound on. Turn sound off")}); toast(P.muted?"Sound off":"Sound on"); break;
    case "phase":{ const n=+b.dataset.n; if(n===1){UI.tap();show("mode")} else if(n===2&&P.p1done){UI.tap();startPhase(2)} else if(n===3&&P.p2done){UI.tap();startPhase(3)} else {UI.no();say(n===2?"emma":"max",n===2?"Finish Lookout Hill first. Then this place will open!":"Finish Comparison Camp first!","oops")} break}
    case "startmode": UI.tap(); startPhase(1,b.dataset.m); break;
    case "replay": UI.tap(); startPhase(+b.dataset.n,b.dataset.m); break;
    case "go": if(G&&G.go){UI.tap();const f=G.go;G.go=null;f()} break;
    case "critter":{ if(!G||G.busy)return; const id=b.dataset.id; if(G.found.has(id)){playAnimal(id);return} openQ(id); break}
    case "pick": snapAnswer(b.dataset.v,b); break;
    case "hear": playAnimal(G.sq.id); break;
    case "mopt": mAnswer(+b.dataset.i,b); break;
    case "oanim": orderTap(b); break;
    case "qnext": if(G&&G.q&&G.q.done){UI.tap();const f=G.q.next;G.q=null;f()} break;
    case "slot":{ if(G&&G.tg&&G.tg.sel)tagDrop(G.tg.sel,b); break}
    case "bslot": bReturn(+b.dataset.i); break;
    case "acard": speak("emma",`${b.dataset.adj}. The ${lc(REP[b.dataset.adj])} is ${b.dataset.adj}.`); if(b.dataset.adj==="fast"||true)playAnimal(REP[b.dataset.adj]); break;
    case "rule": speak("max",b.dataset.say); break;
    case "again": speak(b.dataset.who||LAST.who,(b.querySelector(".line")||{}).textContent||LAST.text); break;
    case "say": speak("emma",NAMES[b.dataset.id]); break;
    case "roar": playAnimal(b.dataset.id); break;
  }
});
document.addEventListener("keydown",e=>{ if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches(".txt[data-act],.dropslot,.slot")){e.preventDefault();e.target.click()} });
document.querySelector("#defs defs").innerHTML=DEFS.join("");
show("start");
</script>
