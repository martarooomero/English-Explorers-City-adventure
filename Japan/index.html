<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>English Explorers Japan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap">
<style>
/* One look by choice (a game world): washi paper, indigo ink, vermilion and sakura pink. Soft shadows, thin warm lines. */
:root{
  --ink:#2D3156; --paper:#FFF8EA; --paper2:#FCEFD6; --edge:#7A5545; --verm:#E4472F; --verm2:#C93A24; --sakura:#F2A0BC; --gold:#F5B327;
  --matcha:#4FA377; --sky:#BEE6F5; --good:#2E9E5B; --bad:#D6402C; --indigo:#35457A;
  --display:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",ui-rounded,system-ui,sans-serif;
  --body:"Nunito","Trebuchet MS",ui-rounded,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:#F6D9C6;color:var(--ink);font-family:var(--body);font-weight:700}
button{font-family:inherit;color:inherit}
#app{position:fixed;inset:0;overflow:hidden;background:#F6D9C6}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));animation:fadein .5s ease both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
[hidden]{display:none!important}
:focus-visible{outline:4px solid #fff;outline-offset:2px;box-shadow:0 0 0 7px var(--verm)}
svg{display:block}
.bg{position:absolute;inset:0;z-index:-2;overflow:hidden}.bg>svg{width:100%;height:100%}
.shade{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(255,248,234,0) 30%,rgba(255,236,214,.55) 100%)}

/* buttons */
.btn{appearance:none;border:0;border-radius:999px;font-family:var(--display);font-weight:800;font-size:clamp(19px,2.6vw,26px);line-height:1;padding:14px 30px;min-height:56px;cursor:pointer;color:#fff;background:linear-gradient(#F56A52,#DD412B);box-shadow:0 5px 0 #A92B1B,0 10px 18px rgba(120,40,20,.25);transition:transform .1s,box-shadow .1s,filter .15s;display:inline-flex;align-items:center;justify-content:center;gap:10px;white-space:nowrap;touch-action:manipulation}
.btn:hover{transform:translateY(-2px);filter:brightness(1.05)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #A92B1B}
.btn svg{width:24px;height:24px;flex:none}
.btn.gold{background:linear-gradient(#FFD45C,#F5B327);color:var(--ink);box-shadow:0 5px 0 #C58A12,0 10px 18px rgba(120,80,10,.22)}
.btn.green{background:linear-gradient(#6CC48C,#3E9A64);box-shadow:0 5px 0 #2B7449,0 10px 18px rgba(30,90,50,.22)}
.btn.paper{background:linear-gradient(#FFFDF6,#F7EAD0);color:var(--ink);box-shadow:0 5px 0 #CDB58E,0 10px 18px rgba(90,60,20,.18)}
.btn.sm{font-size:18px;min-height:46px;padding:9px 20px}
.btn.big{font-size:clamp(30px,5vw,52px);padding:16px clamp(34px,6vw,76px);min-height:76px;animation:throb 1.8s ease-in-out infinite}
@keyframes throb{50%{transform:scale(1.05)}}
.btn[disabled]{opacity:.5;cursor:default;animation:none}
.iconbtn{width:50px;height:50px;min-height:0;padding:0;font-size:0}.iconbtn svg{width:26px;height:26px}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,250,238,.95);border-radius:99px;padding:5px 14px 5px 10px;font-family:var(--display);font-weight:800;font-size:20px;height:46px;box-shadow:0 3px 10px rgba(90,50,20,.22)}
.pill .star{width:28px;height:28px}
.star{width:34px;height:34px}

/* characters */
.ch{display:block;transform-origin:50% 100%}
.ch svg{width:100%;height:auto;overflow:visible;filter:drop-shadow(0 6px 8px rgba(70,40,20,.2))}
.ch.b2{animation-delay:-1.5s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.face{width:100%;height:100%;border-radius:50%;overflow:hidden;background:#CDEBF7}.face svg{width:100%;height:100%}

/* HUD */
.hud{display:flex;align-items:center;gap:10px;padding-block:max(10px,env(safe-area-inset-top,0px)) 6px;min-height:66px;flex:none}
.hud .mid{flex:1;min-width:0;text-align:center}
.hud .ttl{font-family:var(--display);font-weight:800;font-size:clamp(17px,2.8vw,26px);line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 0 rgba(255,255,255,.7)}
.pbar{height:12px;border-radius:99px;background:rgba(45,49,86,.16);overflow:hidden;margin:5px auto 0;max-width:380px}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#F2A0BC,#E4472F);border-radius:99px;transition:width .6s cubic-bezier(.3,1.4,.5,1)}

/* start */
#s-start{align-items:center;justify-content:space-between;text-align:center;padding-block:max(16px,env(safe-area-inset-top,0px)) 0}
#s-start .snd{position:absolute;top:max(12px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px))}
.titlebox{margin-top:clamp(0px,2vh,20px)}
.kicker{display:inline-block;background:var(--ink);color:#FFE9A8;font-family:var(--display);font-weight:800;font-size:clamp(15px,2.4vw,24px);letter-spacing:.22em;padding:4px 22px 4px 26px;border-radius:99px;box-shadow:0 4px 10px rgba(45,49,86,.3)}
.title{margin:8px 0 0;font-family:var(--display);font-weight:800;font-size:clamp(44px,10vw,116px);line-height:.88;color:#fff;text-shadow:0 3px 0 #E4472F,0 6px 0 #B52F1F,0 12px 22px rgba(80,20,10,.35);letter-spacing:.01em}
.title em{font-style:normal;color:#FFE27A;text-shadow:0 3px 0 #E4472F,0 6px 0 #B52F1F,0 12px 22px rgba(80,20,10,.35)}
.ribbon{display:inline-block;margin-top:14px;background:linear-gradient(#FFFDF6,#F7EAD0);font-family:var(--display);font-weight:800;font-size:clamp(17px,3vw,30px);padding:4px 26px 6px;border-radius:12px;box-shadow:0 5px 0 #CDB58E,0 10px 16px rgba(90,60,20,.2);transform:rotate(-1.5deg);color:var(--ink)}
.heroes{display:flex;align-items:flex-end;justify-content:center;gap:clamp(12px,5vw,70px);width:100%;padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
.heroes .ch{height:clamp(150px,36vh,360px);aspect-ratio:240/340}
.heroes .btn{margin-bottom:clamp(12px,5vh,50px)}

/* speech bubble / coach */
.coach{display:flex;align-items:center;gap:12px;flex:none;padding:6px 0 max(10px,env(safe-area-inset-bottom,0px))}
.coach .av{flex:none;width:clamp(58px,9vw,84px);aspect-ratio:1;border-radius:50%;border:3px solid #fff;box-shadow:0 4px 12px rgba(70,40,20,.3);overflow:hidden;background:#CDEBF7}
.coach .av svg{width:100%;height:100%}
.say{position:relative;flex:1;min-width:0;background:linear-gradient(#FFFFFF,#FFF8EA);border-radius:22px;padding:10px 16px 12px;font-size:clamp(16px,2.4vw,23px);line-height:1.25;box-shadow:0 6px 16px rgba(70,40,20,.22);cursor:pointer;display:flex;align-items:center;gap:10px}
.say::before{content:"";position:absolute;left:-9px;top:50%;width:20px;height:20px;background:#FFFCF3;transform:translateY(-50%) rotate(45deg);border-radius:4px}
.say .nm{display:block;font-family:var(--display);font-size:.8em;line-height:1;color:var(--verm)}
.say .tx{flex:1;min-width:0}
.say .rep{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:linear-gradient(#FFD45C,#F5B327);display:grid;place-items:center;box-shadow:0 3px 0 #C58A12;cursor:pointer;color:var(--ink);padding:0}
.say .rep svg{width:24px;height:24px}
.say.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.94)}to{transform:none}}
.say.ok .nm{color:var(--good)}.say.no .nm{color:var(--bad)}

/* map */
#s-map{padding-bottom:0}
.mapwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.mapbox{position:relative;width:min(100%,calc((100dvh - 190px)*1.6667));aspect-ratio:5/3;border-radius:28px;overflow:hidden;box-shadow:0 0 0 5px #fff,0 12px 28px rgba(60,40,20,.32);background:#9ED4E8}
.mapbox>svg{position:absolute;inset:0;width:100%;height:100%}
.stop{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0;cursor:pointer;width:30%}
.stop .disc{width:clamp(60px,10.5vw,104px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFFFFF,#FFF0CF);display:grid;place-items:center;box-shadow:0 0 0 4px #fff,0 0 0 7px var(--verm),0 8px 16px rgba(70,30,20,.35);animation:pulse 2s ease-in-out infinite;position:relative}
.stop:nth-of-type(2) .disc{animation-delay:-.7s}.stop:nth-of-type(3) .disc{animation-delay:-1.4s}
@keyframes pulse{50%{transform:scale(1.07)}}
.stop .disc svg{width:64%;height:64%}
.stop .lbl{font-family:var(--display);font-weight:800;font-size:clamp(12px,1.9vw,20px);line-height:1.05;background:#fff;border-radius:12px;padding:4px 12px 5px;box-shadow:0 3px 8px rgba(70,40,20,.28);white-space:nowrap}
.stop .lbl small{display:block;font-size:.62em;letter-spacing:.14em;color:var(--verm);font-weight:800}
.stop .st{display:flex;gap:1px;background:rgba(255,255,255,.92);border-radius:99px;padding:1px 6px;box-shadow:0 2px 6px rgba(70,40,20,.25)}.stop .st .star{width:clamp(16px,2.4vw,24px);height:clamp(16px,2.4vw,24px)}
.stop:hover .disc{animation-play-state:paused;transform:scale(1.1)}
.mapfig{position:absolute;pointer-events:none;width:clamp(36px,6vw,66px);transition:left .7s ease,top .7s ease;transform:translate(-50%,-92%)}
.guide{display:flex;align-items:center;gap:12px;flex:none;padding:10px 0 max(12px,env(safe-area-inset-bottom,0px))}
.scene.objscene{background:radial-gradient(circle at 50% 40%,#FFFFFF,#FCEFD6)}.bigicon{position:absolute;inset:6%;display:grid;place-items:center}.bigicon svg{height:100%;width:auto;max-width:100%}
.devbar{position:absolute;right:12px;bottom:calc(max(12px,env(safe-area-inset-bottom,0px)) + 4px);display:flex;gap:8px;z-index:5}
.devbar button{font:inherit;font-size:13px;font-weight:800;border:2px dashed rgba(45,49,86,.45);background:rgba(255,255,255,.7);color:var(--ink);border-radius:10px;padding:5px 10px;cursor:pointer}

/* world screen */
#s-world{align-items:center}
.wcard{margin:auto;width:min(920px,100%);background:rgba(255,250,238,.94);border-radius:30px;padding:clamp(14px,3vh,28px) clamp(14px,3vw,30px) clamp(16px,3vh,28px);box-shadow:0 16px 40px rgba(60,30,20,.35);text-align:center;display:flex;flex-direction:column;gap:clamp(8px,1.6vh,16px)}
.wk{font-family:var(--display);font-weight:800;letter-spacing:.2em;color:var(--verm);font-size:clamp(14px,2vw,20px)}
.wcard h2{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(28px,5.4vw,56px);line-height:.95}
.wsub{margin:0;font-size:clamp(14px,2vw,19px);color:#5B5F86}
.levels{display:flex;gap:clamp(8px,2vw,18px);justify-content:center;flex-wrap:wrap}
.lvl{position:relative;flex:1 1 190px;max-width:270px;border:0;border-radius:24px;padding:14px 12px 16px;cursor:pointer;background:linear-gradient(#FFFFFF,#FCEFD6);box-shadow:0 6px 0 #D9BF93,0 12px 20px rgba(90,60,20,.2);transition:transform .12s;display:flex;flex-direction:column;align-items:center;gap:4px}
.lvl:hover:not(.locked){transform:translateY(-4px)}
.lvl .lk{font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.16em;color:var(--verm)}
.lvl b{font-family:var(--display);font-size:clamp(26px,4vw,38px);line-height:1}
.lvl small{font-size:14px;color:#6B6E92}
.lvl .st{margin-top:4px}.lvl .st .star{width:46px;height:46px}
.lvl.locked{cursor:default;background:linear-gradient(#EFEAE0,#DDD5C4);box-shadow:0 6px 0 #BDB39C}
.lvl.locked b,.lvl.locked .lk{color:#8E8A7E}
.lvl .lk2{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.2)}.lvl .lk2 svg{width:20px;height:20px}
.soon{display:inline-block;margin-top:2px;font-size:12.5px;background:#fff;border-radius:8px;padding:2px 8px;color:#6B6E92;font-weight:800}

/* story */
#s-story{justify-content:flex-end}
.cast{--kh:clamp(120px,36vh,340px);position:absolute;left:0;right:0;bottom:calc(max(14px,env(safe-area-inset-bottom,0px)) + 92px);display:flex;align-items:flex-end;justify-content:center;gap:clamp(14px,5vw,80px);pointer-events:none}
.cast .ch{height:var(--kh);aspect-ratio:240/340;transition:filter .25s}
.cast .ch.hiro{height:calc(var(--kh)*1.2)}
.cast .ch.dim{filter:brightness(.92) saturate(.92)}
.cast .ch.talk{filter:none}
.storybar{display:flex;align-items:center;gap:12px;padding:10px 0 max(14px,env(safe-area-inset-bottom,0px))}
.storybar .say{font-size:clamp(17px,2.6vw,26px)}
.skip{position:absolute;top:max(12px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));z-index:3}

/* play */
#s-play{gap:0}
.main{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding-bottom:4px}
.scene{position:relative;flex:1 1 0;min-height:96px;border-radius:24px;overflow:hidden;box-shadow:0 0 0 4px #fff,0 8px 20px rgba(60,40,20,.28);background:#BEE6F5}
.scene>svg,.scene .lay>svg{position:absolute;inset:0;width:100%;height:100%}
.scene .lay{position:absolute;inset:0}
.qprompt{flex:none;text-align:center;font-family:var(--display);font-weight:800;font-size:clamp(22px,3.8vw,38px);line-height:1.05;color:var(--ink);text-shadow:0 2px 0 rgba(255,255,255,.7)}
.qprompt small{display:block;font-family:var(--body);font-weight:800;font-size:clamp(13px,1.9vw,17px);color:#5B5F86;margin-top:3px;text-shadow:none}
.blank{display:inline-block;min-width:3.4em;border-bottom:4px solid var(--verm);text-align:center}
.opts{flex:none;display:flex;gap:clamp(8px,1.6vw,16px);justify-content:center;align-items:stretch;flex-wrap:wrap}
.opt{position:relative;flex:1 1 0;min-width:0;max-width:260px;border:0;border-radius:22px;background:linear-gradient(#FFFFFF,#FCEFD6);box-shadow:0 5px 0 #D9BF93,0 10px 16px rgba(90,60,20,.2);cursor:pointer;padding:10px 8px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:transform .1s;touch-action:manipulation}
.opt:hover:not([disabled]){transform:translateY(-3px)}
.opt:active:not([disabled]){transform:translateY(3px);box-shadow:0 1px 0 #D9BF93}
.opt .w{font-family:var(--display);font-weight:800;font-size:clamp(20px,3.4vw,32px);line-height:1}
.opt .ico{width:clamp(44px,8vw,76px);aspect-ratio:1}.opt .ico svg{width:100%;height:100%}
.opt .thumb{width:100%;aspect-ratio:5/3;border-radius:14px;overflow:hidden;position:relative}.opt .thumb>svg{position:absolute;inset:0;width:100%;height:100%}
.opt.item .ico{width:clamp(64px,13vw,132px)}
.opt .tag{font-family:var(--display);font-weight:800;font-size:clamp(16px,2.4vw,24px);line-height:1;min-height:1em;color:var(--verm);animation:pop .3s}
.opt.right{background:linear-gradient(#C8F2CF,#98DDA6);box-shadow:0 5px 0 #5DB06E;animation:pop .4s}
.opt.wrong{background:linear-gradient(#FFE0DA,#FBC1B8);box-shadow:0 5px 0 #D98E83;opacity:.82}
.opt[disabled]{cursor:default}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.nextrow{flex:none;display:flex;justify-content:center}
.listen{position:relative;flex:1 1 0;min-height:96px;display:flex;align-items:center;justify-content:center;border-radius:24px;background:radial-gradient(circle at 50% 40%,#FFFFFF,#FCEFD6);box-shadow:0 0 0 4px #fff,0 8px 20px rgba(60,40,20,.2)}
.bigsound{width:clamp(96px,22vh,150px);aspect-ratio:1;border-radius:50%;border:0;background:linear-gradient(#FFD45C,#F5B327);box-shadow:0 8px 0 #C58A12,0 14px 24px rgba(120,80,10,.3);display:grid;place-items:center;cursor:pointer;color:var(--ink);animation:throb 1.6s ease-in-out infinite;padding:0}
.bigsound svg{width:52%;height:52%}.bigsound:active{transform:translateY(6px);box-shadow:0 2px 0 #C58A12}
.badge{position:absolute;right:14px;top:12px;background:rgba(255,255,255,.94);border-radius:14px;padding:5px 14px;font-family:var(--display);font-weight:800;font-size:clamp(20px,3.4vw,32px);box-shadow:0 3px 10px rgba(60,30,20,.25);animation:pop .35s}

/* sort / match */
.bins{flex:1 1 0;min-height:0;display:flex;gap:clamp(8px,2vw,18px);justify-content:center;align-items:stretch}
.bin{flex:1 1 0;max-width:340px;border-radius:24px;background:rgba(255,255,255,.78);box-shadow:inset 0 0 0 4px rgba(255,255,255,.9),0 8px 18px rgba(60,40,20,.22);display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px;position:relative;overflow:hidden;transition:background .15s}
.bin .binthumb{width:100%;flex:1 1 0;min-height:56px;border-radius:16px;overflow:hidden;position:relative}.bin .binthumb>svg{position:absolute;inset:0;width:100%;height:100%}
.bin .bw{font-family:var(--display);font-weight:800;font-size:clamp(20px,3.2vw,30px);line-height:1}
.bin.hot,.slot.hot{background:#FFF2BE}
.bin .got{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;min-height:40px}
.bin .got .piece{width:clamp(36px,6vw,54px);aspect-ratio:1}
.tray{flex:none;display:flex;gap:clamp(8px,1.6vw,16px);justify-content:center;flex-wrap:wrap;min-height:70px;padding:4px}
.piece{width:clamp(62px,11vw,96px);aspect-ratio:1;border:0;border-radius:20px;background:linear-gradient(#FFFFFF,#FCEFD6);box-shadow:0 5px 0 #D9BF93,0 8px 14px rgba(90,60,20,.2);cursor:grab;display:grid;place-items:center;padding:6px;touch-action:none;user-select:none}
.piece svg{width:100%;height:100%;pointer-events:none}
.piece.sel{outline:4px solid var(--verm);outline-offset:2px;transform:translateY(-4px)}
.piece.lifted{opacity:.3}
.piece.ghost{position:fixed;z-index:500;pointer-events:none;margin:0;transform:rotate(-5deg) scale(1.08);box-shadow:0 14px 24px rgba(0,0,0,.35)}
.piece.wordp{width:auto;aspect-ratio:auto;min-width:clamp(90px,16vw,150px);height:clamp(52px,8vh,66px);font-family:var(--display);font-weight:800;font-size:clamp(20px,3.2vw,30px);padding:0 16px}
.slot{width:100%;min-height:46px;border-radius:14px;border:3px dashed #C9AE82;background:rgba(255,255,255,.7);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:clamp(18px,3vw,28px);color:var(--ink);transition:background .15s}
.slot.ok{border-style:solid;border-color:#5DB06E;background:#C8F2CF;animation:pop .35s}

/* judge */
.say2{flex:none;display:flex;align-items:center;gap:12px;justify-content:center}

/* shop */
.shopst{position:relative;flex:1 1 0;min-height:140px;border-radius:24px;overflow:hidden;box-shadow:0 0 0 4px #fff,0 8px 20px rgba(60,40,20,.28);background:#E8C9A0;container-type:size}
.shopst>.lay{position:absolute;inset:0}.shopst>.lay>svg{width:100%;height:100%}
.shopst .ch{position:absolute}
.shopst .hiro{left:27%;bottom:3%;height:76%;aspect-ratio:240/340;z-index:2}
.shopst .cust{right:6%;bottom:3%;height:76%;aspect-ratio:240/340;z-index:3;transition:transform .5s cubic-bezier(.3,1.3,.5,1)}
.shopst .cust.enter{animation:enter .6s cubic-bezier(.3,1.3,.5,1) both}
@keyframes enter{from{transform:translateX(60%);opacity:0}to{transform:none;opacity:1}}
.shopst .kidE{left:3%;bottom:3%;height:64%;aspect-ratio:240/340;z-index:3}
.shopst .kidM{left:13%;bottom:3%;height:64%;aspect-ratio:240/340;z-index:3}
.shopst .front{z-index:2}
.cbub{position:absolute;z-index:5;right:4%;top:5%;max-width:min(56%,380px);background:#fff;border-radius:20px;padding:9px 14px 11px;font-family:var(--display);font-weight:800;font-size:clamp(17px,2.9vw,30px);line-height:1.1;box-shadow:0 6px 16px rgba(60,30,20,.3);display:flex;gap:10px;align-items:center}
.cbub::after{content:"";position:absolute;right:16%;bottom:-11px;width:22px;height:22px;background:#fff;transform:rotate(45deg);border-radius:4px}

"use strict";

/* ====================================================================

const DEFS=[];

const RG=(id,s,cx=.5,cy=.5,r=.5)=>DEFS.push(`<radialGradient id="${id}" cx="${cx}" cy="${cy}" r="${r}">${stops(s)}</radialGradient>`);
const OL="#6B4433";
const ol=(w=1.5)=>`stroke="${OL}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;

LG("skE",["#FFEBDC","#FFD3B6"]); LG("skM",["#FFE0C6","#F7C29E"]); LG("skS",["#FBDDBE","#EDBB92"]); LG("skK",["#FFE6D2","#F6C8A6"]); LG("skD",["#F2CBA5","#DDA87C"]);
RG("blush",["rgba(255,112,138,.85)@0","rgba(255,112,138,0)@100"]);
LG("hairE",["#EF9650","#C9652B","#A64A1D"]); LG("hairM",["#8C5832","#5F371A","#472810"]); LG("hairK",["#46425C","#2B2838","#1E1B29"]);
LG("hairG",["#F2F0F4","#D5D2DC","#B9B5C4"]); LG("hairB",["#6B4A3A","#46301F","#341F12"]);
LG("irisG",["#0E7447","#27B968","#92F2A6"]); LG("irisB",["#3A1E0E","#7C4722","#C98E52"]); LG("irisK",["#1C1A26","#3C3447","#756A86"]);
LG("lilac",["#DCCBFA","#A98BE2"]); LG("pinkP",["#FFB1CE","#F27BAA"]); LG("purpleBP",["#A07AE0","#6A44AA"]); LG("brownBP",["#AE7B49","#7A4C25"]);

/* tapered limb with round ends (organic, not a stroked line) */
function tube(x1,y1,x2,y2,w1,w2,fill,bend=0,sw=1.5){
  const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L,r1=w1/2,r2=w2/2,m=(r1+r2)/2;

}
const HAND="M-7.4 -3 C-9 4 -8 11 -3 14 C1 16.4 6 14.6 8 9.4 C10 4 9 -2 7.4 -4Z", THUMB="M6.6 -1.6 C12 -3 15.4 3.6 10.8 9 C9.2 6.4 7.4 4.4 5.8 3Z";

function ac(){ if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();MASTER=AC.createGain();MASTER.gain.value=.8;const c=AC.createDynamicsCompressor();MASTER.connect(c);c.connect(AC.destination)}catch(e){}} if(AC&&AC.state==="suspended")AC.resume(); return AC }

  const osc=c.createOscillator(); osc.type=type; osc.frequency.setValueAtTime(f0,t); if(f1)osc.frequency.exponentialRampToValueAtTime(f1,t+dur);
  const g=c.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+Math.min(.03,dur/4)); g.gain.setValueAtTime(vol,t+dur*.6); g.gain.linearRampToValueAtTime(0,t+dur); osc.connect(g); g.connect(MASTER); osc.start(t); osc.stop(t+dur+.05) }
function noise(o){ const c=ac(); if(!c||P.muted)return; const {t0=0,dur=.3,vol=.1,filt=1000,ftype="bandpass",q=1,f1=null}=o; const t=c.currentTime+t0; const n=Math.floor(c.sampleRate*dur),b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0); for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type=ftype;f.Q.value=q;f.frequency.setValueAtTime(filt,t);if(f1)f.frequency.linearRampToValueAtTime(f1,t+dur);const g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+dur*.25);g.gain.linearRampToValueAtTime(0,t+dur);s.connect(f);f.connect(g);g.connect(MASTER);s.start(t);s.stop(t+dur+.02) }

/* drag and drop with tap-to-select fallback */
function dragify(root,itemSel,targetSel,drop,click){
  root.onpointerdown=e=>{ const it=e.target.closest(itemSel); if(!it||e.button>0)return; e.preventDefault();
    const sx=e.clientX,sy=e.clientY,r=it.getBoundingClientRect(),ox=e.clientX-r.left,oy=e.clientY-r.top; let ghost=null,moved=false,hot=null;
    const mv=ev=>{ if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>7){moved=true;ghost=it.cloneNode(true);ghost.classList.add("ghost");ghost.style.width=r.width+"px";ghost.style.height=r.height+"px";document.body.appendChild(ghost);it.classList.add("lifted")}
      if(moved){ghost.style.left=ev.clientX-ox+"px";ghost.style.top=ev.clientY-oy+"px";const t=document.elementFromPoint(ev.clientX,ev.clientY),tg=t&&t.closest(targetSel);if(hot&&hot!==tg)hot.classList.remove("hot");if(tg){tg.classList.add("hot");hot=tg}} };
    const end=ev=>{ window.removeEventListener("pointermove",mv);window.removeEventListener("pointerup",end);window.removeEventListener("pointercancel",end);if(hot)hot.classList.remove("hot");
      if(moved){ghost.remove();it.classList.remove("lifted");if(ev.type==="pointerup"){const t=document.elementFromPoint(ev.clientX,ev.clientY),tg=t&&t.closest(targetSel);if(tg)drop(it,tg)}} else if(ev.type==="pointerup")click(it) };
    window.addEventListener("pointermove",mv);window.addEventListener("pointerup",end);window.addEventListener("pointercancel",end); };
}

function buildLevel(w,l){
  if(!IMPL[w][l])return null;
  const SEAS=["spring","summer","autumn","winter"], WALL=["sunny","rainy","cloudy","snowy","windy","stormy"];
  const sOpts=(k,n)=>shuffle([k,...shuffle(SEAS.filter(x=>x!==k)).slice(0,n-1)]);
  const wOpts=(k,n)=>shuffle([k,...shuffle(WALL.filter(x=>x!==k)).slice(0,n-1)]);
  if(w==="w1"){
    const ks=shuffle(SEAS), sortSet=n=>shuffle(ks.flatMap(s=>shuffle(SEA[s].objs).slice(0,n).map(o=>[o,s])));
    const listen=k=>({t:"listen",u:1,k,kind:"season",target:k,opts:sOpts(k,l===0?2:4)});
    const icon=k=>({t:"pick",u:1,kind:"season",k,obj:rnd(SEA[k].objs),opts:sOpts(k,4)});
    const scene=k=>({t:"pick",u:1,kind:"season",k,opts:sOpts(k,l===0?3:4)});
    const type=k=>({t:"type",u:1,kind:"season",k});
    const judge=k=>({t:"judge",u:1,kind:"season",k,claim:rnd(SEAS.filter(x=>x!==k))});
    if(l===0){ const t=ks.slice(0,2), t2=shuffle(ks).slice(0,2);
      return [{t:"dream",u:2},...t.map(listen),...t2.map(scene),{t:"sort",u:4,bins:ks,pieces:sortSet(2)}]; }
    if(l===1) return [listen(ks[0]),listen(ks[1]),scene(ks[2]),scene(ks[3]),icon(ks[0]),icon(ks[2]),judge(ks[1]),{t:"sort",u:4,bins:ks,pieces:sortSet(3)}];
    return [listen(ks[0]),listen(ks[1]),icon(ks[2]),icon(ks[3]),type(ks[0]),type(ks[1]),type(ks[2]),judge(ks[3]),{t:"sort",u:4,bins:ks,pieces:sortSet(3)}];
  }
  if(w==="w2"){
    const E=shuffle(["sunny","rainy","cloudy","snowy"]), A=shuffle(WALL);
    const listen=(k,n)=>({t:"listen",u:1,kind:"weather",target:k,opts:wOpts(k,n)});
    const pick=k=>({t:"pick",u:1,kind:"weather",k,opts:wOpts(k,4)});
    const type=k=>({t:"type",u:1,kind:"weather",k});
    const judgeF=k=>({t:"judge",u:1,k,claim:rnd(WALL.filter(x=>x!==k))}), judgeT=k=>({t:"judge",u:1,k,claim:k});
    if(l===0) return [...E.slice(0,3).map(k=>({t:"pick",u:1,kind:"weather",k,opts:shuffle([k,...shuffle(E.filter(x=>x!==k)).slice(0,2)])})),
      ...E.slice(1,3).map(k=>listen(k,2)),{t:"match",u:3,bins:shuffle(["sunny","rainy","snowy"])},{t:"judge",u:1,k:"rainy",claim:"sunny"}];
    if(l===1) return [pick(A[0]),pick(A[1]),pick(A[2]),listen(A[3],4),listen(A[4],4),{t:"match",u:4,bins:A.slice(0,4)},judgeT(A[5]),judgeF(A[1])];
    const T=shuffle(["windy","stormy",rnd(["sunny","rainy","cloudy","snowy"])]);
    return [listen(A[0],4),listen(A[1],4),...T.map(type),{t:"match",u:5,bins:A.slice(0,5)},judgeF(A[2]),judgeF(A[3])];
  }  if(w==="w3"){
    const easy=["scarf","gloves","boots","tshirt","dress","swimsuit"], all=Object.keys(CLO), mode=["easy","med","hard"][l];
    const set=l===0?shuffle(easy):shuffle(all).slice(0,6), pool=l===0?easy:all, n=l===0?3:4;
    const cust=shuffle(["yuki","kenta","sakura","haru","yuki","kenta"]);
    return set.map((it,i)=>({t:"shop",u:1,mode,cust:cust[i],item:it,opts:shuffle([it,...shuffle(pool.filter(x=>x!==it)).slice(0,n-1)])}));
  }
}

function runPick(st){

/* ---- sort (all four seasons) and match (weather words to pictures): pieces go to bins ---- */
function runSort(st,single){
  const W=single;
  const bins=st.bins.map(b=>`<div class="bin" data-bin="${b}"><div class="binthumb">${sceneS(b,true)}</div>${W?`<div class="slot"></div>`:`<div class="bw">${SEA[b].w}</div><div class="got"></div>`}</div>`).join("");
  const pieces=W?st.bins.map(b=>[b,b]):st.pieces;
  const pcs=(W?shuffle(pieces):pieces).map(([p,b])=>`<button class="piece${W?" wordp":""}" data-piece="${p}" data-bin="${b}">${W?WEA[p].w:objSVG(p)}</button>`).join("");
  const prompt=W?"Match the words!":"Where does it belong?", hint=W?"Drag each word to its picture.":"Drag each picture to its season.";
  mainEl().innerHTML=`<div class="bins">${bins}</div><div class="qprompt">${prompt}<small>${hint}</small></div><div class="tray" id="tray">${pcs}</div><div class="nextrow" id="nx" hidden><button class="btn green" data-act="nx">Next ${UI_I.next}</button></div>`;
  const say0=W?"Match the words to the pictures!":"Put each picture in the right season!"; G.rep=()=>speak(st.coach,say0); say(st.coach,say0);
  let left=pieces.length, sel=null;
  const place=(piece,bin)=>{ if(!piece||!bin)return; const ok=piece.dataset.bin===bin.dataset.bin;
    if(W&&bin.querySelector(".slot.ok"))return;
    if(ok){ UI.ok(); if(W){const sl=bin.querySelector(".slot");sl.classList.add("ok");sl.textContent=WEA[piece.dataset.piece].w;speak(st.coach,piece.dataset.piece)} else {const g=bin.querySelector(".got");const c=piece.cloneNode(true);c.className="piece";c.disabled=true;g.appendChild(c);speak(st.coach,SEA[bin.dataset.bin].w.toLowerCase())}
      piece.remove(); sel=null; bump(st.u/pieces.length); left--;
      if(left<=0){ say(st.coach,rnd(PRAISE),"cheer",{cls:"ok"}); afterOk(2300) } else say(st.coach,"Yes! "+rnd(PRAISE),"happy",{cls:"ok",mute:true});
    } else { miss(); UI.no(); bin.classList.add("shake"); setTimeout(()=>bin.classList.remove("shake"),420); piece.classList.remove("sel"); sel=null;
      say(st.coach,W?"Not quite. Look at the picture. Which word is it?":"Not quite. Think about the pictures. Try again!","oops",{cls:"no"}); }
  };
  dragify(mainEl(),".piece:not(.ghost)",".bin",(it,tg)=>place(it,tg),it=>{ if(sel===it){it.classList.remove("sel");sel=null;return} $$(".piece.sel").forEach(x=>x.classList.remove("sel")); sel=it; it.classList.add("sel"); if(W)speak(st.coach,it.dataset.piece); });
  mainEl().querySelectorAll(".bin").forEach(b=>b.addEventListener("click",()=>{ if(sel)place(sel,b) }));
}

let W_=null, SI=0;
function openStory(w){ W_=w; SI=0; show("story",{w}); storyLine(); }
function storyLine(){ const S=STORY[W_],ln=S.lines[SI]; const [who,text,expr]=ln;
  $$(".cast .ch").forEach(c=>{const me=c.dataset.who===who;c.classList.toggle("talk",me);c.classList.toggle("dim",!me);if(me)c.innerHTML=PEOPLE[who](expr||"happy","idle")});
  say(who,text,expr||"happy"); const b=$("[data-act=snext]"); if(b)b.innerHTML=(SI===S.lines.length-1?"Let's go!":"Next")+" "+UI_I.next; }
function afterStory(){ P.seen[W_]=1; save(); show("world",W_); }
function openWorld(w){ W_=w; show("world",w); }
$app.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b||b.disabled)return; const a=b.dataset.act; ac();
  switch(a){
    case "sound": P.muted=!P.muted; save(); if(P.muted)hush(); $$('[data-act="sound"]').forEach(x=>x.innerHTML=P.muted?UI_I.mute:UI_I.sound); toast(P.muted?"Sound off":"Sound on"); break;
    case "start": UI.tap(); show("map"); setTimeout(()=>speak("emma","Choose an adventure!"),400); break;
    case "home": show("start"); break;
    case "wordbook": UI.tap(); show("wordbook"); break;
    case "wbtab": UI.tap(); show("wordbook",b.dataset.t); break;
    case "wsay": speak(b.dataset.v,b.dataset.say); b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop"); break;
    case "map": show("map"); break;
    case "world": UI.tap(); { const w=b.dataset.w; if(P.seen[w]||G&&G.w===w&&b.closest("#s-play"))openWorld(w); else openStory(w) } break;
    case "story": openStory(W_); break;
    case "snext": UI.tap(); if(SI<STORY[W_].lines.length-1){SI++;storyLine()} else afterStory(); break;
    case "skip": afterStory(); break;
    case "level": { const l=+b.dataset.l; if(!unlocked(W_,l)){toast(IMPL[W_][l]?"Finish the previous level first.":"This level is coming soon.");UI.no();break} UI.tap(); startLevel(W_,l); } break;
    case "again": startLevel(G.w,G.l); break;
    case "rep": replay(); break;
    case "opt": if(G.pick)G.pick(+b.dataset.i,b); break;
    case "jopt": if(G.judge)G.judge(b.dataset.v,b); break;
    case "sopt": if(G.shop)G.shop(+b.dataset.i,b); break;
    case "tsub": if(G.type)G.type(); break;
    case "dnext": UI.tap(); if(G.dnext)G.dnext(); break;
    case "nx": clearTimeout(TMR); next(); break;
    case "passport": UI.tap(); show("passport"); runPassport(); break;
    case "final": show("final"); UI.win(); confetti(); setTimeout(()=>speak("emma","Congratulations! You are a super explorer!"),500); break;
  }
});
document.addEventListener("keydown",e=>{ if(e.key==="Enter"&&e.target.id==="ti"&&G&&G.type){e.preventDefault();G.type();return} if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches(".say")){e.preventDefault();replay()} });
$("#defs defs").innerHTML=DEFS.join("");
show("start");

</script>
</body>
</html>
